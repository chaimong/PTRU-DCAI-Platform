  if(/สูตร|คำนวณ|คิดคะแนน|หารด้วย|เกณฑ์คะแนน/.test(t))
    return `<b>${aiEsc(SCORE_RULE)}</b><br>${aiEsc(SCORE_RULE_NOTE)}`;

  if(/กรอบสมรรถนะ|เวอร์ชัน|version/.test(s))
    return `กรอบสมรรถนะเวอร์ชัน <b>${aiEsc(FW.version||"—")}</b>
      · ${FW.competencies.length} สมรรถนะ · ${FW.levels.length} ระดับ
      ${FW.updatedAt?"<br>ปรับปรุงล่าสุด "+aiEsc(String(FW.updatedAt).slice(0,10)):""}`;

  if(isStu&&me){
    const P=personalize(me.id);
    if(!P) return "ยังไม่มีผลการประเมินของท่านในระบบครับ";
    /* กฎเฉพาะเจาะจงต้องมาก่อนกฎทั่วไป มิฉะนั้นคำว่า "คะแนน" หรือ "ระดับ"
       จะดักคำถามที่ถามเรื่องอื่นไปตอบเป็นคะแนนรวมทั้งหมด */
    if(/ลดลง|ถดถอย|แย่ลง|ตกลง/.test(t)){
      if(!P.declining.length) return "ไม่มีสมรรถนะใดที่คะแนนลดลงจากรอบแรกครับ";
      return "สมรรถนะที่คะแนนลดลง<br>"+P.declining.map((o,i)=>
        `${i+1}. ${aiEsc(o.c.th)} · ${o.trend.toFixed(2)} ระดับจากรอบแรก (ปัจจุบัน ${fmt(o.v)})`).join("<br>");
    }
    if(/คะแนน|ได้เท่าไร|ระดับของฉัน|ผลของฉัน|เป้าหมายกี่|ถึงระดับ/.test(t)){
      const lv=P.level?FW.levels[P.level-1]:null;
      return `คะแนนรวมของท่านคือ <b>${fmt(P.overall)}</b> ${lv?"ระดับ "+aiEsc(lv.th):""}
        · ถึงเป้าหมาย ${P.onTarget} จาก ${P.withV.length} สมรรถนะ
        · เป้าหมายเฉลี่ยของชั้นปี ${fmt(P.targetAvg,1)}`;
    }
    if(/อ่อน|ต้องพัฒนา|ปรับปรุง|ต่ำ/.test(t)){
      if(!P.gaps.length) return "ทุกสมรรถนะถึงระดับเป้าหมายแล้วครับ";
      return "สมรรถนะที่ควรพัฒนาก่อน<br>"+P.gaps.map((o,i)=>
        `${i+1}. ${aiEsc(o.c.th)} · ปัจจุบัน ${fmt(o.v)} เป้าหมาย ${o.t} (ขาด ${Math.abs(o.gap).toFixed(2)})`).join("<br>");
    }
    if(/เก่ง|จุดแข็ง|ดีที่สุด/.test(t)){
      if(!P.strengths.length) return "ยังไม่มีข้อมูลเพียงพอครับ";
      return "จุดแข็งของท่าน<br>"+P.strengths.map((o,i)=>
        `${i+1}. ${aiEsc(o.c.th)} · ${fmt(o.v)} (สูงกว่าเป้าหมาย ${o.gap.toFixed(2)})`).join("<br>");
    }
    if(/พัฒนาการ|ก้าวหน้า|ดีขึ้น|แนวโน้ม/.test(t)){
      if(P.growth===null) return "ยังมีรอบการประเมินไม่พอสำหรับดูแนวโน้ม ต้องมีอย่างน้อย 2 รอบครับ";
      return `เทียบรอบแรกกับรอบล่าสุด เปลี่ยนแปลง <b>${(P.growth>=0?"+":"")+P.growth.toFixed(2)}</b> ระดับ
        เฉลี่ย ${(P.perRound>=0?"+":"")+P.perRound.toFixed(2)} ต่อรอบ
        ${P.declining.length?"<br>มี "+P.declining.length+" สมรรถนะที่ลดลง นำโดย "+aiEsc(P.declining[0].c.th):""}`;
    }
    if(/เสี่ยง|risk/.test(s))
      return `ความเสี่ยงไม่ผ่านเกณฑ์ประมาณ <b>${Math.round(P.risk*100)}%</b>
        ${P.risk>=.6?"อยู่ในระดับสูง ควรนัดหมายอาจารย์นิเทศก์":P.risk>=.35?"ต้องเฝ้าระวัง":"อยู่ในระดับต่ำ"}
        <br><span class="sub">ค่านี้มาจากแบบจำลองที่ยังไม่ได้สอบเทียบกับข้อมูลย้อนหลังจริง ใช้ประกอบดุลยพินิจ</span>`;
    if(/แผน|เส้นทาง|ควรทำ|path|เรียนรู้/.test(s)){
      const ph=personalPath(P);
      return "เส้นทางการเรียนรู้ของท่าน<br>"+ph.map((p,i)=>`<b>${i+1}. ${aiEsc(p.head)}</b> <span class="sub">${aiEsc(p.n)}</span>`).join("<br>")+
        `<br><span class="sub">ดูรายละเอียดทั้งหมดได้ที่แดชบอร์ด หัวข้อ 📚 Personalized Learning Path</span>`;
    }
    if(/สอบ|แบบทดสอบ|exam/.test(s))
      return `ท่านทำแบบทดสอบแล้ว <b>${P.examDone}</b> จาก ${P.openTests.length} ชุด
        ${P.openTests.length>P.examDone?"<br>ไปที่เมนู แบบทดสอบสมรรถนะ เพื่อทำชุดที่เหลือ":""}`;
    if(/หลักฐาน|แฟ้ม|portfolio/.test(s))
      return `แฟ้มสะสมงานมี <b>${P.myEv.length}</b> รายการ · ผ่านการตรวจสอบ ${P.evVerified} · รอตรวจ ${P.evPending}`;
  }

  if(!isStu&&/นักศึกษา|กี่คน|จำนวน/.test(t)){
    const st=visStudents();
    return `ท่านดูแลนักศึกษา <b>${st.length}</b> คนในขอบเขตสิทธิ์ของท่าน` +
      (scopeProgram()?` (สาขา ${aiEsc(scopeProgram())})`:"");
  }
  if(!isStu&&/เสี่ยง|เฝ้าระวัง/.test(t)){
    const st=visStudents().map(s=>({s,r:analyze(FW,s.id)})).filter(o=>o.r).map(o=>({s:o.s,risk:o.r.edm.risk}));
    const hi=st.filter(o=>o.risk>=0.35).sort((a,b)=>b.risk-a.risk).slice(0,5);
    if(!hi.length) return "ไม่พบนักศึกษาที่ต้องเฝ้าระวังในขอบเขตของท่านครับ";
    return `พบ <b>${st.filter(o=>o.risk>=0.35).length}</b> คนที่ต้องเฝ้าระวังขึ้นไป<br>`+
      hi.map(o=>`${aiEsc(o.s.name)} · ${Math.round(o.risk*100)}%`).join("<br>");
  }
  if(RATER_ROLES.includes(S.role)&&/ฉันให้คะแนน|สอดคล้อง|เข้มงวด|ใจดี|bias/.test(t)){
    const A=advisorIRR(me?me.id:"");
    if(!A||!A.n||A.n<3) return "ยังมีระเบียนการประเมินของท่านไม่พอสำหรับคำนวณครับ";
    return `จาก ${A.n} เซลล์ คะแนนของท่านเฉลี่ย ${fmt(A.ownMean)} เทียบค่ากลางฝ่ายอื่น ${fmt(A.otherMean)}
      · ส่วนต่าง <b>${(A.bias>=0?"+":"")+A.bias.toFixed(2)}</b><br>${aiEsc(A.verdict)} (p = ${A.p.toFixed(3)})
      <br><span class="sub">ดูรายละเอียดที่ โปรไฟล์ของฉัน › ความสอดคล้องของผู้ประเมิน</span>`;
  }

  /* กฎทั่วไปเรื่องระดับ วางไว้หลังกฎของผู้เรียน เพื่อไม่ให้ดักคำถามอย่าง
     "ฉันถึงระดับเป้าหมายกี่สมรรถนะ" ซึ่งเป็นคำถามเรื่องคะแนนของตนเอง */
  if(/ระดับสมรรถนะ|กี่ระดับ|ระดับมีอะไร|อธิบายระดับ/.test(t))
    return "ระดับสมรรถนะมี "+FW.levels.length+" ระดับ<br>"+
      FW.levels.map((l,i)=>`${i+1}. ${aiEsc(l.th)} · ${aiEsc(l.en)}`).join("<br>");

  if(/สมรรถนะ.*(อะไร|มีกี่)|กี่สมรรถนะ/.test(t))
    return `ชั้นปีนี้เปิดใช้ ${activeComps(FW,isStu&&me?me.year:S.year).length} สมรรถนะ จากทั้งหมด ${FW.competencies.length} ด้าน`;

  const hit=FW.competencies.filter(c=>t.length>=3&&(c.th.includes(t)||String(c.code).toLowerCase()===s));
  if(hit.length){
    const c=hit[0];
    const y=isStu&&me?me.year:S.year;
    const cf=cfgOf(FW,y,c.id);
    return `<b>${c.code} ${aiEsc(c.th)}</b><br>${aiEsc(c.en)} · กลุ่ม ${PTRU[c.ptru]?aiEsc(PTRU[c.ptru].th):"—"}
      <br>ชั้นปีนี้ ${cf.active?"เปิดใช้":"ปิดใช้"} · ระดับเป้าหมาย ${cf.target} · ตัวชี้วัด ${(cf.indicators||[]).length} ข้อ`;
  }

  return `ยังไม่เข้าใจคำถามนี้ครับ ลองถามเช่น
    <br>· คะแนนของฉันเท่าไร · สมรรถนะที่ต้องพัฒนา · แผนการเรียนรู้
    <br>· สูตรคำนวณคะแนน · กรอบสมรรถนะเวอร์ชันอะไร
    <br>หรือพิมพ์ชื่อสมรรถนะเพื่อดูรายละเอียด`;
}

/** ชุดคำถามแนะนำ จัดกลุ่มตามเรื่อง เพื่อให้ผู้ใช้เห็นว่าถามอะไรได้บ้าง
    เลือกให้ตรงกับสิ่งที่บทบาทนั้นเห็นได้จริง จะได้ไม่ถามแล้วระบบตอบว่าไม่มีสิทธิ์ */
function aiSuggestGroups(){
  const common=["สูตรคำนวณคะแนนเป็นอย่างไร","กรอบสมรรถนะเวอร์ชันอะไร","ระดับสมรรถนะมีกี่ระดับ"];
  if(S.role==="Student") return [
    {t:"ผลการเรียนของฉัน",q:["คะแนนรวมของฉันเท่าไร","ฉันถึงระดับเป้าหมายกี่สมรรถนะ",
      "สมรรถนะที่ฉันทำได้ดีที่สุด","สมรรถนะที่ฉันต้องพัฒนา"]},
    {t:"พัฒนาการและความเสี่ยง",q:["พัฒนาการของฉันเป็นอย่างไร","ความเสี่ยงของฉันอยู่ระดับไหน",
      "มีสมรรถนะไหนที่คะแนนลดลงบ้าง"]},
    {t:"สิ่งที่ต้องทำ",q:["แผนการเรียนรู้ของฉัน","ฉันทำแบบทดสอบครบหรือยัง","หลักฐานในแฟ้มสะสมงานของฉัน"]},
    {t:"เกี่ยวกับระบบ",q:common},
  ];
  if(RATER_ROLES.includes(S.role)) return [
    {t:"การให้คะแนนของฉัน",q:["ฉันให้คะแนนสอดคล้องกับคนอื่นไหม","ฉันเข้มงวดหรือใจดีกว่าค่ากลาง"]},
    {t:"นักศึกษาที่ดูแล",q:["ฉันดูแลนักศึกษากี่คน","นักศึกษาที่ต้องเฝ้าระวังมีใครบ้าง"]},
    {t:"เกี่ยวกับระบบ",q:common},
  ];
  return [
    {t:"ภาพรวมนักศึกษา",q:["ดูแลนักศึกษากี่คน","นักศึกษาที่ต้องเฝ้าระวังมีใครบ้าง"]},
    {t:"เกี่ยวกับระบบ",q:common},
  ];
}
function aiSuggestions(){ return aiSuggestGroups().flatMap(g=>g.q).slice(0,6); }

function aiBody(){
  if(AI.tab==="chat"){
    const msgs=AI.msgs.map(m=>`<div class="msg ${m.who==="me"?"me":""}">
      <div class="ic">${m.who==="me"?AI_ICON.user:AI_ICON.bot}</div>
      <div class="b">${m.html}</div></div>`).join("");
    /* คำถามแนะนำจัดกลุ่มตามเรื่อง ช่วยให้ผู้ใช้เห็นขอบเขตที่ถามได้โดยไม่ต้องเดา */
    const groups=aiSuggestGroups().map(g=>`<div class="grp"><div class="lb2">${esc(g.t)}</div>
      ${g.q.map(q=>`<span class="chip" data-ai="ask" data-q="${esc(q)}">${esc(q)}</span>`).join("")}</div>`).join("");
    return `${msgs}${groups}`;
  }
  if(AI.tab==="help"){
    const rows=(NAV[S.role]||[]).map(k=>`<li><b>${esc(NAV_LABEL[k]||k)}</b> — ${esc({
      dashboard:"ภาพรวมและผลวิเคราะห์รายบุคคล",users:"จัดการบัญชีผู้ใช้ ชื่อผู้ใช้ และรหัสผ่าน",
      approvals:"ตรวจสอบและรับรองสิทธิ์ผู้สมัคร",framework:"ตั้งค่าสมรรถนะและตัวชี้วัดรายชั้นปี",
      itemq:"วิเคราะห์คุณภาพข้อสอบด้วย CTT และ IRT",psychometrics:"พารามิเตอร์การวัดของตัวชี้วัด",
      assess:"บันทึกผลการประเมินรายสมรรถนะ",students:"รายชื่อนักศึกษาในขอบเขตของท่าน",
      portfolio:"แฟ้มสะสมงานและการตรวจหลักฐาน",myladder:"พัฒนาการรายสมรรถนะของตนเอง",
      analytics:"ภาพรวมระดับชั้นปีและสาขา",diagnostic:"รายงานวินิจฉัยรายบุคคล",
      progress:"ความก้าวหน้ารายบุคคลทุกรอบ",profile:"ข้อมูลส่วนตัวและความปลอดภัย",
      edm:"แบบจำลองทำนายความเสี่ยง",xai:"คำอธิบายแบบจำลองและความเป็นธรรม",
      irr:"ความสอดคล้องระหว่างผู้ประเมิน",exam:"แบบทดสอบวัดสมรรถนะ",reports:"สร้างและดาวน์โหลดรายงาน"
    }[k]||"—")}</li>`).join("");
    /* ปุ่มซิงก์ย้ายมาอยู่ที่นี่ หลังจากถอดแถบสถานะที่แสดงตลอดเวลาออก
       ผู้ใช้ยังสั่งดึงข้อมูลใหม่ได้โดยไม่ต้องมีกล่องลอยบังหน้าจอ */
    const tools=(typeof liveOn==="function"&&liveOn())
      ? `<div class="grp"><div class="lb2">เครื่องมือ</div>
          <span class="chip" data-ai="sync">ดึงข้อมูลจากฐานข้อมูลใหม่</span>
          <span class="chip" data-ai="reset">คืนตำแหน่งปุ่มผู้ช่วย</span></div>`
      : `<div class="grp"><div class="lb2">เครื่องมือ</div>
          <span class="chip" data-ai="reset">คืนตำแหน่งปุ่มผู้ช่วย</span></div>`;
    return `<p>เมนูที่ท่านใช้ได้ในบทบาท <b>${esc(ROLE_TH[S.role]||S.role)}</b></p>
      <ul style="margin:.4rem 0 0;padding-left:1.1rem">${rows}</ul>
      <p class="hint" style="margin-top:.7rem">เคล็ดลับ: ลากปุ่มผู้ช่วยหรือแถบหัวหน้าต่างนี้
        เพื่อย้ายไปมุมอื่นได้ หากบังปุ่มบนหน้าจอ</p>${tools}`;
  }
  if(AI.tab==="comp"){
    const y=S.role==="Student"?myUser().year:S.year;
    const rows=activeComps(FW,y).map(c=>{
      const cf=cfgOf(FW,y,c.id);
      const v=S.role==="Student"?compScore(FW,myUser().id,c,y):null;
      return `<tr><td style="font-size:.8rem">${esc(c.code)} ${esc(c.th)}</td>
        <td class="num">${cf.target}</td>${S.role==="Student"?`<td class="num">${fmt(v)}</td>`:""}</tr>`;
    }).join("");
    return `<p>สมรรถนะที่เปิดใช้ใน${esc(yearOf(FW,y).label)} · ${SCORE_RULE}</p>
      <table class="tight"><thead><tr><th>สมรรถนะ</th><th class="num">เป้าหมาย</th>
      ${S.role==="Student"?"<th class=num>ของท่าน</th>":""}</tr></thead><tbody>${rows}</tbody></table>`;
  }
  if(AI.tab==="search"){
    const q=String(AI.q||"").trim().toLowerCase();
    if(!q) return `<p>พิมพ์คำค้นด้านล่างเพื่อค้นหาสมรรถนะ ตัวชี้วัด หรือผู้ใช้ในขอบเขตสิทธิ์ของท่าน</p>`;
    const comps=FW.competencies.filter(c=>c.th.toLowerCase().includes(q)||String(c.code).toLowerCase().includes(q)).slice(0,6);
    const y=S.role==="Student"?myUser().year:S.year;
    const inds=allInds(FW,y).filter(i=>String(i.th).toLowerCase().includes(q)).slice(0,6);
    const users=(S.role==="Student"?[]:visStudents().filter(u=>
      u.name.toLowerCase().includes(q)||String(u.code).toLowerCase().includes(q))).slice(0,6);
    const sec=(t,arr)=>arr.length?`<div style="margin-top:.5rem"><b>${t}</b><ul style="margin:.2rem 0 0;padding-left:1.1rem">${arr.join("")}</ul></div>`:"";
    const out=sec("สมรรถนะ",comps.map(c=>`<li>${esc(c.code)} ${esc(c.th)}</li>`))
      +sec("ตัวชี้วัด",inds.map(i=>`<li>${esc(i.th)} <span class="sub">${esc(i.comp.code)}</span></li>`))
      +sec("นักศึกษา",users.map(u=>`<li>${esc(u.name)} <span class="sub">${esc(u.code)} · ${esc(u.program||"")}</span></li>`));
    return out||`<p>ไม่พบผลลัพธ์สำหรับ "${esc(q)}"</p>`;
  }
  return `<p><b>คู่มือการใช้ระบบโดยย่อ</b></p>
    <ol style="margin:.3rem 0 0;padding-left:1.15rem">
      <li>เข้าสู่ระบบด้วย<b>อีเมลหรือชื่อผู้ใช้</b> พร้อมรหัสผ่าน (อย่างน้อย ${PW_MIN} อักขระ)</li>
      <li>เมนูด้านซ้ายเปลี่ยนตามบทบาท ระบบแสดงเฉพาะสิ่งที่ท่านมีสิทธิ์ใช้</li>
      <li>คะแนนทุกหน้าคำนวณด้วยกติกาเดียวกัน คือ ${esc(SCORE_RULE)}</li>
      <li>ผู้ประเมินบันทึกผลที่เมนู <b>การประเมิน</b> เลือกนักศึกษา สมรรถนะ แล้วให้ระดับครบทุกตัวชี้วัด</li>
      <li>นักศึกษาดูผลวิเคราะห์รายบุคคลได้ที่<b>แดชบอร์ด</b> และพัฒนาการรายด้านที่ <b>พัฒนาการของฉัน</b></li>
      <li>รายงานทุกฉบับมีผู้ออกเอกสาร วันที่ และเวอร์ชันกรอบสมรรถนะกำกับไว้</li>
      <li>ระหว่างบันทึกข้อมูลจะมีแถบแจ้ง <b>⏳ กำลังบันทึกข้อมูล…</b> และแจ้งผลเมื่อสำเร็จ</li>
    </ol>
    <p class="hint" style="margin-top:.6rem">ผู้ช่วยนี้ตอบจากข้อมูลในระบบเท่านั้น ไม่ได้ส่งข้อมูลผู้เรียนออกไปยังบริการภายนอก</p>`;
}

function renderAI(){

    const w=document.getElementById("aiwrap"), p=document.getElementById("aipanel");
    if(w) w.remove(); if(p) p.remove();
    return;
  }
  ensureAppStyles();
  let wrap=document.getElementById("aiwrap"), panel=document.getElementById("aipanel");

  if(AI.open){
    if(wrap) wrap.style.display="none";
    if(!panel){ panel=document.createElement("div"); panel.id="aipanel"; document.body.appendChild(panel); }
    panel.style.display="flex";
    /* ลากหน้าต่างได้จากแถบหัว ยกเว้นตรงปุ่มปิด */
    aiDraggable(panel,tg=>!!tg.closest(".hd")&&!tg.closest("button"));
    panel.innerHTML=`
      <div class="hd">
        <span class="av" style="width:2.2rem;height:2.2rem">${AI_ICON.bot.replace('<svg','<svg width="20" height="20"')}</span>
        <div><b>ผู้ช่วยอัจฉริยะ</b>
          <span class="sub2"><i></i>พร้อมใช้งาน · ตอบจากข้อมูลจริงในระบบ</span></div>
        <button data-ai="close" aria-label="ปิดหน้าต่างผู้ช่วย" title="ปิด">
          ${AI_ICON.close.replace('<svg','<svg width="17" height="17"')}</button></div>
      <div class="tabs2">${AI_TABS.map(([k,l,ic])=>
        `<button class="${AI.tab===k?"on":""}" data-ai="tab" data-k="${k}">${AI_ICON[ic]}<span>${l}</span></button>`).join("")}</div>
      <div class="bd" id="aibd">${aiBody()}</div>
      ${(AI.tab==="chat"||AI.tab==="search")?`<div class="ft">
        <input id="aiq" placeholder="${AI.tab==="chat"?"พิมพ์คำถามของท่าน…":"พิมพ์คำค้น เช่น ชื่อสมรรถนะ หรือชื่อนักศึกษา"}"
          value="${esc(AI.tab==="search"?(AI.q||""):"")}">
        <button data-ai="send" aria-label="${AI.tab==="chat"?"ส่งคำถาม":"ค้นหา"}" title="${AI.tab==="chat"?"ส่ง":"ค้นหา"}">
          ${(AI.tab==="chat"?AI_ICON.send:AI_ICON.find).replace('<svg','<svg width="17" height="17"')}</button></div>`:""}`;
    const bd=document.getElementById("aibd"); if(bd&&AI.tab==="chat") bd.scrollTop=bd.scrollHeight;
    const q=document.getElementById("aiq"); if(q) q.focus();
    aiApplyPos(panel);
  } else {
    if(panel) panel.style.display="none";
    if(!wrap){ wrap=document.createElement("div"); wrap.id="aiwrap"; document.body.appendChild(wrap); }
    wrap.style.display="flex";
    wrap.innerHTML=`<div id="aibubble" data-ai="open">
        <b>ผู้ช่วยอัจฉริยะ</b>ถามเรื่องคะแนน สมรรถนะ หรือวิธีใช้ระบบได้เลย</div>
      <button id="aibtn" data-ai="open" aria-label="เปิดผู้ช่วยอัจฉริยะ · ลากเพื่อย้ายตำแหน่ง"
        title="กดเพื่อเปิด · ลากเพื่อย้ายตำแหน่ง">
        ${AI_ICON.bot.replace('<svg','<svg width="26" height="26"')}<span class="dot"></span></button>`;
    /* ลากย้ายได้ทั้งจากปุ่มและจากกล่องข้อความ */
    aiDraggable(wrap,()=>true);
    aiApplyPos(wrap);
  }
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-ai]"); if(!el) return;
  e.stopPropagation(); e.preventDefault();
  if(AI.dragging) return;          // เพิ่งลากเสร็จ ไม่ถือเป็นการกดเปิด
  const a=el.dataset.ai;
  if(a==="open"){
    AI.open=true;
    if(!AI.greeted){
      AI.greeted=true;
      aiSay("ai",`สวัสดีครับ ${esc(S.user?S.user.name:"")} ผมเป็นผู้ช่วยของระบบ PTRU
        ถามเรื่องคะแนน สมรรถนะ หรือวิธีใช้ระบบได้เลยครับ`);
    }
  }
  else if(a==="close") AI.open=false;
  else if(a==="tab") AI.tab=el.dataset.k;
  else if(a==="ask"){ const q=el.dataset.q; aiSay("me",esc(q)); aiSay("ai",aiAnswer(q)); }
  else if(a==="sync"){ if(typeof liveSyncAll==="function") liveSyncAll(true); }
  else if(a==="reset"){ AI.pos=null; aiSavePos(); }
  else if(a==="send"){
    const inp=document.getElementById("aiq"); const v=inp?inp.value.trim():"";
    if(!v) return;
    if(AI.tab==="search"){ AI.q=v; }
    else { aiSay("me",esc(v)); aiSay("ai",aiAnswer(v)); if(inp) inp.value=""; }
  }
  renderAI();
},true);

document.addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  if(e.target&&e.target.id==="aiq"){
    e.preventDefault();
    const btn=document.querySelector('#aipanel [data-ai="send"]');
    if(btn) btn.click();
  }
});

aiLoadPos();

/** แผนภาพกรอบแนวคิดการออกแบบ วาดด้วย SVG แทนแผนภาพอักษร
    เพราะแผนภาพอักษรจะเสียรูปเมื่อจอแคบหรือเมื่อฟอนต์ไม่ใช่แบบความกว้างคงที่ */
function rsDiagram(){
  const box=(x,y,w,h,lines,cls)=>{
    const cx=x+w/2, top=y+h/2-(lines.length-1)*8.5;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" class="${cls}"></rect>`+
      lines.map((t,i)=>`<text x="${cx}" y="${top+i*17}" class="${cls}">${t}</text>`).join("");
  };
  const arrow=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#rs-ar)"></line>`;
  const line=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line>`;
  return `<svg class="dia" viewBox="0 0 620 470" role="img"
      aria-label="กรอบแนวคิดการออกแบบ เริ่มจาก PTRU MODEL สู่ PTRU-DCAI MODEL แตกออกเป็นกรอบสมรรถนะ หลักฐานดิจิทัล และกลไกการประเมิน แล้วรวมเข้าสู่ปัญญาประดิษฐ์และการวิเคราะห์ ส่งต่อเป็นข้อมูลป้อนกลับและแดชบอร์ด นำไปสู่การเติบโตของสมรรถนะ">

    ${arrow(310,50,310,74)}
    ${box(200,76,220,40,["PTRU-DCAI MODEL"],"b")}
    ${line(310,116,310,140)}${line(105,140,515,140)}
    ${arrow(105,140,105,168)}${arrow(310,140,310,168)}${arrow(515,140,515,168)}
    ${box(20,170,170,52,["Competency","Framework"],"c")}
    ${box(225,170,170,52,["Digital","Evidence"],"c")}
    ${box(430,170,170,52,["Assessment","Engine"],"c")}
    ${line(105,222,105,250)}${line(310,222,310,250)}${line(515,222,515,250)}
    ${line(105,250,515,250)}${arrow(310,250,310,278)}
    ${box(210,280,200,40,["AI / Analytics"],"b")}
    ${arrow(310,320,310,344)}
    ${box(185,346,250,40,["Feedback & Dashboard"],"c")}
    ${arrow(310,386,310,410)}
    ${box(190,412,240,42,["Competency Growth"],"g")}
  </svg>`;
}

function rsPerson(p){
  const dial="tel:"+String(p.tel).replace(/[^\d+]/g,"");
  return `<div class="person">
    <img src="${photoSrc(p.photo)}" alt="ภาพถ่าย ${esc(p.name)}">
    <div class="who">
      <span class="role">${esc(p.role)}</span>
      <div class="nm">${esc(p.name)}</div>
      <div class="af">${esc(p.pos)}<br>${esc(p.unit)}</div>
      <div class="dl">คุณวุฒิ: ${esc(p.degree)}<br>
        โทรศัพท์: <a href="${dial}">${esc(p.tel)}</a></div>
    </div></div>`;
}

const RS_UI={open:false};
/** หน้าแรกเท่านั้น ไม่แสดงบนหน้าสมัครสมาชิกหรือหน้าลืมรหัสผ่าน */
function rsOnFront(){
  return !S.user && ["register","regstudent","forgot"].indexOf(S.screen)<0;
}
function renderResearch(){
  const btn0=document.getElementById("rsbtn"), md0=document.getElementById("rsmodal");
  if(!rsOnFront()){
    if(btn0) btn0.remove();
    if(md0) md0.remove();
    RS_UI.open=false;
    return;
  }
  ensureAppStyles();
  let btn=btn0;
  if(!btn){
    btn=document.createElement("button");
    btn.id="rsbtn"; btn.type="button"; btn.dataset.rs="open";
    btn.setAttribute("title","ดูข้อมูลโครงการวิจัยและคณะผู้วิจัย");
    btn.innerHTML=`<span class="ic">${RS_ICON.book}</span>
      <span class="tx"><b>โครงการวิจัย</b>
        <i>ทุนสนับสนุนงานวิจัย มรภ.เลย ปีงบประมาณ 2569</i></span>`;
    document.body.appendChild(btn);
  }
  btn.style.display=RS_UI.open?"none":"flex";

  let md=md0;
  if(RS_UI.open){
    if(!md){
      md=document.createElement("div");
      md.id="rsmodal"; md.dataset.rs="backdrop";
      md.setAttribute("role","dialog"); md.setAttribute("aria-modal","true");
      md.setAttribute("aria-labelledby","rs-h");
      md.innerHTML=`<div class="card">
        <div class="hd">
          <span class="av">${RS_ICON.book}</span>
          <div><b id="rs-h">โครงการวิจัยที่ได้รับทุนสนับสนุน</b>
            <span>${esc(RESEARCH.fund)} ${esc(RESEARCH.fundYear)}</span></div>
          <button type="button" data-rs="close" aria-label="ปิดหน้าต่างข้อมูลโครงการวิจัย"
            title="ปิด">${RS_ICON.close}</button></div>
        <div class="bd">${rsBody()}</div></div>`;
      document.body.appendChild(md);
      const c=md.querySelector('[data-rs="close"]'); if(c) c.focus();
    }
    md.style.display="flex";
  } else if(md){
    md.remove();
  }
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-rs]"); if(!el) return;
  const a=el.dataset.rs;
  /* คลิกบนเนื้อหาของหน้าต่างต้องไม่ปิด ปิดเฉพาะเมื่อคลิกที่พื้นหลังจริง ๆ */
  if(a==="backdrop"&&e.target!==el) return;
  e.stopPropagation(); e.preventDefault();
  RS_UI.open=(a==="open");
  renderResearch();
  if(!RS_UI.open){ const b=document.getElementById("rsbtn"); if(b) b.focus(); }
},true);

document.addEventListener("keydown",e=>{
  if(e.key!=="Escape"||!RS_UI.open) return;
  RS_UI.open=false; renderResearch();
  const b=document.getElementById("rsbtn"); if(b) b.focus();
});

/* วาดผู้ช่วยและปุ่มโครงการวิจัยใหม่ทุกครั้งที่หน้าจอหลักเปลี่ยน
   ผู้ช่วยแสดงเฉพาะหลังเข้าสู่ระบบ ส่วนปุ่มโครงการวิจัยแสดงเฉพาะหน้าแรกก่อนเข้าสู่ระบบ */
const renderBase=render;
render=function(){
  renderBase();
  try{ renderAI(); }catch(e){ console.warn("[PTRU] AI:",e); }
  try{ renderResearch(); }catch(e){ console.warn("[PTRU] research:",e); }
};

render();
</script>
<script>
/* ปิดเมนูคลิกขวาตามนโยบายของคณะ
   เขียนใหม่จากสคริปต์รุ่นเดิมที่อ้าง document.layers (Netscape 4) และสร้างฟังก์ชันจากสตริง
   ซึ่งเบราว์เซอร์ปัจจุบันไม่รองรับและถูก Content-Security-Policy ปิดกั้น
   ยกเว้นช่องกรอกข้อความ เพื่อให้ผู้ใช้ยังตัดแปะและแก้คำผิดได้ตามปกติ
   หมายเหตุ มาตรการนี้เป็นเพียงการป้องปราม ไม่ได้ป้องกันการคัดลอกเนื้อหาได้จริง */
document.addEventListener('contextmenu', e => {
  if (e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
  e.preventDefault();
}, false);
</script>
