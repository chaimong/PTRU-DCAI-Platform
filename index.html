/* ---------- หน้าจอกำลังเข้าสู่ระบบ ----------
   แทนแถบแจ้งเตือนเดิม เพราะการเข้าสู่ระบบใช้เวลาหลายวินาที
   เปอร์เซ็นต์ผูกกับขั้นตอนจริงที่ทำเสร็จแล้ว ไม่ใช่ตัวเลขที่วิ่งเองตามเวลา
   ผู้ใช้จึงรู้ว่าระบบค้างอยู่ที่ขั้นใดหากช้าผิดปกติ */
const LOADER={pct:0,stage:""};
/* ระยะเวลาที่ปล่อยให้ข้อความ กำลังออกจากระบบ ค้างอยู่ก่อนแจ้งผลสำเร็จ
   การออกจากระบบเองเสร็จทันที ค่านี้จึงมีไว้ให้ผู้ใช้อ่านข้อความทัน ไม่ได้ถ่วงการทำงาน */
const LOGOUT_NOTICE_MS=550;
function loaderShow(title){
  ensureAppStyles();
  let el=document.getElementById("loadscreen");
  if(!el){
    el=document.createElement("div");
    el.id="loadscreen";
    el.setAttribute("role","status");
    el.setAttribute("aria-live","polite");
    el.innerHTML=`<div class="box">
      <div class="ring">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="54" fill="none" stroke="var(--ai-blue)" stroke-width="3"
            stroke-dasharray="7 7" opacity=".38"></circle>
          <circle id="ld-arc" cx="60" cy="60" r="46" fill="none" stroke="var(--ai-blue)" stroke-width="7"
            stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289"
            style="transition:stroke-dashoffset .35s ease"></circle>
          <!-- หัวขบวนหมุนวิ่งบนวงเส้นประรอบนอก จึงกวาดครบรอบวงกลมให้เห็นชัดว่าระบบยังทำงานอยู่
               เส้นรอบวงที่ r=54 ยาว 339 หน่วย ขีดยาว 52 เว้น 288 จึงเหลือหัวขบวนเดียววิ่งวน -->
          <circle class="spin" cx="60" cy="60" r="54" fill="none" stroke="var(--ai-blue)" stroke-width="5"
            stroke-linecap="round" stroke-dasharray="52 288"></circle>
        </svg>
        <div class="pct" id="ld-pct">0%</div>
      </div>
      <h3 id="ld-title">กำลังเข้าสู่ระบบ...</h3>
      <p>กรุณารอสักครู่</p>
      <div class="stage" id="ld-stage"></div>
    </div>`;
    document.body.appendChild(el);
  }
  el.style.display="flex";
  if(title){ const h=document.getElementById("ld-title"); if(h) h.textContent=title; }
  loaderSet(0,"");
}
function loaderSet(pct,stage){
  LOADER.pct=clamp(Math.round(pct),0,100);
  if(stage!==undefined) LOADER.stage=stage;
  const p=document.getElementById("ld-pct"), a=document.getElementById("ld-arc"), s=document.getElementById("ld-stage");
  if(p) p.textContent=LOADER.pct+"%";
  if(a) a.setAttribute("stroke-dashoffset",String(289-289*LOADER.pct/100));
  if(s) s.textContent=LOADER.stage||"";
}
function loaderHide(){
  const el=document.getElementById("loadscreen");
  if(!el) return;
  loaderSet(100,"เสร็จสมบูรณ์");
  setTimeout(()=>{ el.style.opacity="0"; setTimeout(()=>{ el.style.display="none"; el.style.opacity=""; },180); },220);
}

/* ---------- แถบแจ้งเตือนการทำงาน ----------
   วางไว้นอก #app จึงไม่ถูกลบเมื่อหน้าจอวาดใหม่ระหว่างรอเซิร์ฟเวอร์ตอบ
   ใช้บอกผู้ใช้ว่าระบบกำลังบันทึกอยู่ และบอกผลเมื่อบันทึกเสร็จ */
let TOAST_TIMER=null;
function toast(msg,kind,sticky){
  let el=document.getElementById("toast");
  if(!el){
    el=document.createElement("div");
    el.id="toast";
    el.setAttribute("role","status");
    el.setAttribute("aria-live","polite");
    el.style.cssText="position:fixed;left:50%;top:1.1rem;transform:translateX(-50%);z-index:200;"+
      "max-width:min(30rem,92vw);padding:.65rem 1.05rem;border-radius:10px;font-size:.9rem;line-height:1.5;"+
      "box-shadow:0 6px 24px rgba(0,0,0,.18);border:1px solid var(--line);transition:opacity .18s;pointer-events:none";
    document.body.appendChild(el);
  }
  const style={
    wait:["var(--surface)","var(--text)","var(--line)"],
    ok:["var(--ok-bg)","var(--ok)","var(--ok-line)"],
    err:["var(--risk-bg)","var(--risk)","var(--risk-line)"],
  }[kind||"wait"];
  el.style.background=style[0]; el.style.color=style[1]; el.style.borderColor=style[2];
  el.textContent=msg;
  el.style.opacity="1";
  clearTimeout(TOAST_TIMER);
  if(!sticky) TOAST_TIMER=setTimeout(()=>{ el.style.opacity="0"; },kind==="err"?5200:2800);
}
const toastSaving =()=>toast("⏳ กำลังบันทึกข้อมูล…","wait",true);
const toastSaved  =m=>toast("✅ "+(m||"บันทึกข้อมูลลงฐานข้อมูลสำเร็จ"),"ok");
const toastFailed =m=>toast("⚠️ "+(m||"บันทึกข้อมูลไม่สำเร็จ"),"err");

function render(){

     ช่วยให้ผู้สมัครพิมพ์ต่อได้ทันทีทุกขั้น โดยไม่ต้องเลื่อนหาช่องแรก */

function findInd(cid,iid,y){
  const cfg=cfgOf(FW,y,cid); return cfg.indicators.find(i=>i.id===iid);
}
function reindexQ(){
  // ปรับความยาวเวกเตอร์ q ของทุกตัวชี้วัดให้เท่ากับจำนวนสมรรถนะปัจจุบัน
  FW.years.forEach(y=>Object.values(y.config).forEach(cf=>cf.indicators.forEach(i=>{
    while(i.q.length<FW.competencies.length) i.q.push(0);
    i.q.length=FW.competencies.length;})));
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(e.target.closest("[data-stop]") && el && el.dataset.act==="drawerclose" && e.target.closest("[data-stop]")!==el.closest("[data-stop]")) return;
  if(!el) return;
  const a=el.dataset.act, v=el.dataset.v, k=el.dataset.k, cid=el.dataset.c;
  if(el.tagName==="SELECT"||el.tagName==="INPUT"&&el.type!=="checkbox") return;
  let re=true;
  switch(a){
    /* --- ยืนยันตัวตน --- */
    case "fill": { document.getElementById("em").value=v; document.getElementById("pw").value=PASSWORD; S.err=""; re=false; break; }
    case "pwtoggle": { S.pwShow[v]=!S.pwShow[v];
      /* เก็บสิ่งที่พิมพ์ไว้ก่อน เพราะการ render ใหม่จะสร้าง input ขึ้นมาใหม่ทั้งหมด */
      const keep={}; document.querySelectorAll('input[type="password"],input[data-act="pwcheck"]')
        .forEach(x=>{ if(x.id) keep[x.id]=x.value; });
      render();
      Object.keys(keep).forEach(id=>{ const x=document.getElementById(id); if(x) x.value=keep[id]; });
      const back=document.getElementById(v); if(back){ back.focus(); back.setSelectionRange(back.value.length,back.value.length); }
      re=false; break; }
    case "go": S.screen=v; S.err=""; S.notice=""; S.forgotSent=false;
      /* หน้าแรกเหลือปุ่มสมัครสมาชิกปุ่มเดียว จึงไม่เลือกประเภทไว้ล่วงหน้า
         ผู้สมัครกดเลือกเองได้ทั้งสี่ประเภทในขั้นที่ 1
         ส่วน regstudent คงไว้สำหรับลิงก์เดิมที่ชี้มาสมัครนักศึกษาโดยตรง */
      if(v==="register"||v==="regstudent")
        S.reg={step:1, kind:v==="regstudent"?"student":"", data:{}, found:null, notice:"", ref:""};
      break;
    case "login": {
      const em=val("em"), pw=val("pw");
      const key=em.toLowerCase();
      /* เข้าสู่ระบบด้วยอีเมลหรือชื่อผู้ใช้ก็ได้ ให้ตรงกับ findUserByLogin_ ใน Code.gs */
      const u=USERS.find(x=>x.email.toLowerCase()===key)
            ||USERS.find(x=>String(x.code||"").toLowerCase()===key);
      if(!u||pw!==(u.pw||PASSWORD)){S.err="อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบแล้วลองอีกครั้ง";break;}
      if(u.status!=="active"){S.err="บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ";break;}
      S.err="";
      if(u.roles.some(r=>["Administrator","Dean","Program Chair"].includes(r))){S.otpUser=u;break;}
      S.user=u; S.role=u.roles[0]; S.page="dashboard"; break; }
    case "otp": { if(val("otp")==="246810"){S.user=S.otpUser;S.role=S.otpUser.roles[0];S.otpUser=null;S.err="";S.page="dashboard";}
      else S.err="รหัสยืนยันไม่ถูกต้อง รหัสมีอายุ 5 นาที"; break; }
    case "otpback": S.otpUser=null; S.err=""; break;
    /* แจ้งเตือนทันทีที่กด แล้วค่อยแจ้งผลสำเร็จหลังวาดหน้าจอใหม่
       ผู้ใช้จึงเห็นว่าระบบรับคำสั่งแล้ว ไม่ต้องเดาว่ากดติดหรือไม่ */
    case "logout": {
      const who=(S.user&&S.user.name)?" · "+S.user.name:"";
      toast("⏳ กำลังออกจากระบบ"+who+"…","wait",true);
      S.user=null; S.role=null; S.screen="login"; S.err=""; S.notice="";
      setTimeout(()=>toast("ออกจากระบบเรียบร้อยแล้ว","ok"),LOGOUT_NOTICE_MS);
      break; }
    /* --- สมัครสมาชิก (ชุดเดียว ใช้ร่วมกันทุกประเภทผู้สมัคร) --- */
    case "regkind": { S.reg.kind=v; S.reg.found=null; S.reg.notice=""; S.err=""; break; }
    case "regback": { S.reg.step=Math.max(1,+v||1); S.err=""; break; }
    case "regnext1": {
      const d=S.reg.data;
      /* กันกรณีกดถัดไปโดยยังไม่เลือกประเภท ปุ่มถูกปิดไว้แล้วแต่ยังกดผ่านแป้นพิมพ์ได้ */
      if(!S.reg.kind){S.err="กรุณาเลือกประเภทผู้สมัครก่อน";break;}
      if(regIsStudent()){
        const code=val("rg_code").trim();
        const em=normEmail(val("rg_em1"));
        const prog=(document.getElementById("rg_prog1")||{}).value||"";
        if(!code){S.err="กรุณากรอกรหัสนักศึกษา";break;}
        if(!em){S.err="กรุณากรอกอีเมลมหาวิทยาลัย";break;}
        if(!isStudentEmail(em)){S.err=`อีเมลต้องเป็นของมหาวิทยาลัย ลงท้ายด้วย @${STUDENT_EMAIL_DOMAIN} เท่านั้น`;break;}
        if(!prog){S.err="กรุณาเลือกสาขาวิชา";break;}
        const found=students().find(x=>String(x.code)===code)||null;
        if(USERS.some(u=>u.email.toLowerCase()===em&&(!found||u.id!==found.id))){
          S.err="อีเมลนี้ถูกใช้กับบัญชีอื่นแล้ว";break;}
        S.reg.found=found;
        S.reg.notice=found?"":"ไม่พบรหัสนี้ในทะเบียน ท่านสมัครต่อได้ เจ้าหน้าที่จะตรวจสอบสถานภาพภายหลัง";
        S.reg.data={code, em, prog,
          pre:d.pre||PREFIX_STU[0],
          fn:found?String(found.name).split(" ")[0]:(d.fn||""),
          ln:found?String(found.name).split(" ").slice(1).join(" "):(d.ln||""),
          year:found?found.year:(d.year||1),
          tel:d.tel||"", sch:(found&&found.school)||d.sch||"",
          c1:d.c1, c2:d.c2};
      } else {
        S.reg.data=Object.assign({pre:PREFIX_TCH[0],prog:PROGRAMS[0].id,
          aff:AFFILIATIONS[0],grp:SUBJECT_GROUPS[0],lvl:TEACH_LEVELS[0]},d);
      }
      S.err=""; S.reg.step=2; break; }
    case "regnext2": {
      const d=S.reg.data, g=id=>{const e=document.getElementById(id); return e?String(e.value):"";};
      d.pre=g("rg_pre"); d.fn=val("rg_fn").trim(); d.ln=val("rg_ln").trim();
      d.tel=normTel(val("rg_tel")); d.em=normEmail(val("rg_em"));
      d.prog=g("rg_prog"); d.sch=val("rg_sch").trim();
      if(!d.fn||!d.ln){S.err="กรุณากรอกชื่อและนามสกุล";break;}
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.em)){S.err="รูปแบบอีเมลไม่ถูกต้อง";break;}
      if(regIsStudent()&&!isStudentEmail(d.em)){
        S.err=`อีเมลนักศึกษาต้องลงท้ายด้วย @${STUDENT_EMAIL_DOMAIN}`;break;}
      if(d.tel&&!/^0\d{8,9}$/.test(d.tel)){S.err="หมายเลขโทรศัพท์ไม่ถูกต้อง ตัวอย่างเช่น 0812345678";break;}
      const mine=S.reg.found?S.reg.found.id:null;
      if(USERS.some(u=>u.email.toLowerCase()===d.em.toLowerCase()&&u.id!==mine)){
        S.err="อีเมลนี้ถูกใช้กับบัญชีอื่นแล้ว";break;}
      if(regIsStudent()){
        d.year=+g("rg_year")||1;
      } else if(regIsAdvisor()){
        /* อาจารย์นิเทศก์เป็นบุคลากรของคณะ ไม่ต้องกรอกโรงเรียนหรือสังกัด */
        d.sch=""; d.aff=""; d.lvl="";
        d.grp=S.reg.kind==="major"?g("rg_grp"):"";
        d.exp=val("rg_exp");
        if(!d.tel){S.err="กรุณากรอกหมายเลขโทรศัพท์เพื่อให้คณะติดต่อกลับได้";break;}
        if(d.exp!==""&&(+d.exp<0||+d.exp>50)){S.err="ประสบการณ์การนิเทศต้องอยู่ระหว่าง 0 ถึง 50 ปี";break;}

    case "itemadd": { addItem(v); const ni=BANK[BANK.length-1]; if(ni) scheduleItemSave(ni.id); S.iqMsg="เพิ่มข้อสอบใหม่แล้ว และจะบันทึกลง ItemBank อัตโนมัติ"; break; }
    case "itemsyncall": { S.iqMsg="กำลังซิงก์ข้อสอบและเฉลยทั้งหมดลง ItemBank…"; void syncAllItemsToSheet(true); break; }

      if(!confirm("ยืนยันการลบข้อ "+v+"?\n\nระบบจะล้างผลวิเคราะห์คุณภาพข้อสอบและผลการฝึกโมเดลเดิม แล้วคำนวณใหม่เมื่อเปิดดูครั้งถัดไป")) break;

    case "itemkey": { const it=findItem(v); if(it){ it.key=+k; it.custom=true; scheduleItemSave(it.id);
      S.iqMsg="กำหนดให้ตัวเลือก "+CHOICE_LB[+k]+" เป็นเฉลยของข้อ "+v+" และจะบันทึกลง ItemBank"; } break; }

      bankChanged(); S.iqMsg="คืนค่าคลังข้อสอบของสมรรถนะนี้กลับเป็นชุดตั้งต้นแล้ว"; break; }
    case "fwexam": { S.examYear=S.year; S.examComp=v; S.page="exam"; break; }

    case "fwtest": { cfgEdit(S.year,v).test.open=true; break; }
    case "examstart": void startExamFromServer(v); break;
    case "examexit": S.examComp=null; S.examAns={}; S.examItems=[]; S.examAttemptId=null; S.examDone=false; S.examQ=0; S.examBusy=false; S.examDbSaved=false; S.err=""; break;
    case "examans": S.examAns[v]=+k; S.err=""; break;
    case "examprev": S.examQ=Math.max(0,(Number(S.examQ)||0)-1); break;
    case "examnext": { const its2=S.examItems||[],cur2=its2[Number(S.examQ)||0]; if(cur2&&S.examAns[cur2.id]!==undefined) S.examQ=Math.min(its2.length-1,(Number(S.examQ)||0)+1); break; }
    case "examsubmit": void examSubmit(); break;
    case "edmcompare": S.edmCompare=true; break;
    case "edmback": S.edmCompare=false; break;
    case "edmreset": EDM_CACHE=null; S.msg=""; break;
    case "gotoprofile": S.page="profile"; S.pfTab=v; S.pfMsg=""; S.pfErr=""; break;
    case "histround": S.histRound=v; break;
    case "pfsave": {
      const u=myUser(); const g=id=>{const e=document.getElementById(id);return e?String(e.value).trim():undefined;};
      const nm=g("pf_name"), em=g("pf_em"), tel=g("pf_tel");
      if(!nm){S.pfErr="กรุณากรอกชื่อ-นามสกุล";break;}
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em||"")){S.pfErr="รูปแบบอีเมลไม่ถูกต้อง";break;}
      if(USERS.some(x=>x.id!==u.id&&!x.linkTo&&x.email.toLowerCase()===em.toLowerCase())){S.pfErr="อีเมลนี้ถูกใช้กับบัญชีอื่นแล้ว";break;}
      if(tel&&!/^0\d{8,9}$/.test(tel.replace(/[-\s]/g,""))){S.pfErr="หมายเลขโทรศัพท์ไม่ถูกต้อง";break;}
      u.name=nm; u.email=em; u.tel=tel||"";
      const pos=g("pf_pos"); if(pos!==undefined) u.acadPos=pos;
      const s1=g("pf_sch"); if(s1!==undefined) u.school=s1;
      const s2=g("pf_sch2"); if(s2!==undefined) u.school=s2;
      const af=g("pf_aff"); if(af!==undefined) u.aff=af;
      const gr=g("pf_grp"); if(gr!==undefined) u.group=gr;
      const lv=g("pf_lvl"); if(lv!==undefined) u.teachLevel=lv;
      const ex=g("pf_exp"); if(ex!==undefined) u.exp=ex;
      if(S.user.linkTo||S.user.id===u.id) S.user=u;
      S.pfErr=""; S.pfMsg="บันทึกข้อมูลส่วนตัวแล้ว"; break; }
    case "pfpw": {
      const g=id=>{const e=document.getElementById(id);return e?String(e.value):"";};
      const o=g("sec_old"), p1=g("sec_p1"), p2=g("sec_p2");
      const uu=myUser(); const curPw=uu.pw||PASSWORD;
      if(o!==curPw){S.pfErr="รหัสผ่านปัจจุบันไม่ถูกต้อง";break;}
      if(p1.length<PW_MIN){S.pfErr=`รหัสผ่านใหม่ต้องยาวอย่างน้อย ${PW_MIN} อักขระ`;break;}
      if(p1===o){S.pfErr="รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสผ่านเดิม";break;}
      if(p1!==p2){S.pfErr="รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน";break;}
      uu.pw=p1; uu.pwChanged="3 ก.ย. 2569";
      S.pfErr=""; S.pfMsg="เปลี่ยนรหัสผ่านเรียบร้อยแล้ว ครั้งต่อไปให้เข้าสู่ระบบด้วยรหัสผ่านใหม่ (มีผลจนกว่าจะรีเฟรชหน้า เพราะต้นแบบยังไม่มีฐานข้อมูล)"; break; }
    case "runcdm": S.dxCdm=true; break;

    /* --- การประเมิน --- */
    case "asscore": S.asScores[v]=+k; S.asSaved=false; break;
    /* เลือกสมรรถนะจากตารางสรุปของผู้ประเมิน ทำงานเหมือนเลือกจากกล่องเลือกด้านบน */
    case "ascomp2": S.asComp=v; S.asScores={}; S.asSaved=false; break;
    case "assave":
      S.asSaved=true;
      /* โหมดจริงจะมี livePush แจ้งสถานะการบันทึกให้เอง ตรงนี้จึงแจ้งเฉพาะโหมดสาธิต */
      if(!(typeof liveOn==="function"&&liveOn())) toast("✅ บันทึกผลการประเมินแล้ว (โหมดสาธิต ยังไม่เขียนลงฐานข้อมูล)","ok");
      break;

    /* --- แฟ้มสะสมงาน --- */
    case "evcomp": { const i=S.evNew.comps.indexOf(v);
      if(i<0) S.evNew.comps.push(v); else S.evNew.comps.splice(i,1); break; }
    case "evmode": { S.evNew.mode=v; S.evErr="";
      /* สลับวิธีส่งงานแล้วล้างข้อมูลของอีกวิธีทิ้ง กันการส่งซ้อนกันสองทาง */
      if(v==="link"){ S.evNew.fileName=""; S.evNew.fileMime=""; S.evNew.fileData=""; }
      else S.evNew.link="";
      break; }
    case "evadd": { const t=val("ev_title");
      if(!t){ S.evErr="กรุณาระบุชื่อหลักฐาน"; break; }
      if(!S.evNew.comps.length){ S.evErr="กรุณาเลือกสมรรถนะอย่างน้อยหนึ่งรายการ"; break; }
      const useLink=S.evNew.mode!=="file";
      const link=String(S.evNew.link||"").trim();
      if(useLink){
        if(!link){ S.evErr="กรุณาวางลิงก์งานที่ส่ง หรือสลับไปใช้การอัปโหลดไฟล์"; break; }
        if(!isHttpUrl(link)){ S.evErr="ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https:// เช่น https://drive.google.com/..."; break; }
      } else if(!S.evNew.fileData){ S.evErr="กรุณาเลือกไฟล์ หรือสลับไปใช้การวางลิงก์"; break; }
      S.evErr="";
      EVIDENCE.unshift({id:nid("e"),student:myUser().id,title:t,type:S.evNew.type,
        date:new Date().toISOString().slice(0,10),comps:[...S.evNew.comps],status:"pending",
        url:useLink?link:""});
      S.evNew={title:"",type:S.evNew.type,comps:[],mode:S.evNew.mode,link:"",fileName:"",fileMime:"",fileData:""};
      break; }
    case "evverify": case "evreject": {
      const e2=EVIDENCE.find(x=>x.id===v); if(!e2){ re=false; break; }
      e2.status=(a==="evverify")?"verified":"rejected"; break; }

    case "noop": alert("ต้นแบบนี้ยังไม่ได้เชื่อมต่อบริการสร้างไฟล์ ฟังก์ชันนี้ต้องพัฒนาในฝั่งเซิร์ฟเวอร์"); re=false; break;
    default: re=false;
  }
  if(re) render();
});

/* select และ checkbox */
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v, k=el.dataset.k, cid=el.dataset.c, val2=el.value;
  let re=true;
  switch(a){
    case "role": S.role=val2; S.page="dashboard"; break;
    case "usrf": S.usrFilter[el.dataset.k||"role"]=val2; break;
    case "dxsid": S.dxSid=val2; S.dxCdm=false; break;
    case "prgsid": S.prgSid=val2; break;
    case "edmsid": S.edmSid=val2; break;
    case "xaisid": S.xaiSid=val2; break;
    case "itemta": case "itemtb": case "itemtc": case "itemtd": {
      const it=findItem(v); if(!it) { re=false; break; }
      it.tA=clamp(+it.tA||1,0.1,4); it.tB=clamp(+it.tB||0,-4,4);
      if(it.tC===undefined) it.tC=GUESS_C; if(it.tD===undefined) it.tD=1;
      it.tC=clamp(+it.tC,0,0.5); it.tD=clamp(+it.tD,0.5,1);
      if(it.tC>=it.tD){ it.tC=Math.max(0,+(it.tD-0.05).toFixed(3));
        S.iqMsg="ข้อ "+v+": ขอบล่าง c ต้องน้อยกว่าขอบบน d ระบบปรับค่า c ให้เป็น "+it.tC+" แล้ว"; }
      else S.iqMsg="ปรับพารามิเตอร์ของข้อ "+v+" แล้ว (a="+it.tA+" b="+it.tB+" c="+it.tC+" d="+it.tD+
        ") ระบบสร้างข้อมูลจำลองและผลวิเคราะห์ใหม่ทั้งหมด";
      it.custom=true; bankChanged(); break; }
    case "avatarup": {
      const f=el.files&&el.files[0];
      S.pfPhotoBusy=true; S.pfPhotoMsg=""; S.pfPhotoErr=false; render();
      readAvatar(f,(data,err)=>{
        const u=myUser();
        if(err||!u){ S.pfPhotoBusy=false; S.pfPhotoErr=true; S.pfPhotoMsg=err||"ไม่พบบัญชีผู้ใช้"; render(); return; }
        u.photo=data;                       // แสดงผลทันทีจากรูปที่ย่อแล้ว ไม่ต้องรอเซิร์ฟเวอร์
        S.pfPhotoErr=false;
        if(typeof liveOn==="function"&&liveOn()){
          /* ส่งเฉพาะรูปที่ย่อเหลือ 256 พิกเซล ไม่ใช่ไฟล์ต้นฉบับ
             ไฟล์จากกล้องมือถือมักหลายเมกะไบต์ ส่งขึ้นไปทั้งไฟล์จะช้าและเปลืองพื้นที่ Drive โดยเปล่าประโยชน์ */
          S.pfPhotoMsg="กำลังบันทึกรูปลงที่จัดเก็บไฟล์ของระบบ…"; render();
          uploadAvatar(data).then(url=>{
            S.pfPhotoBusy=false;
            if(url){ u.photo=url; S.pfPhotoErr=false; S.pfPhotoMsg="บันทึกรูปประจำตัวลงระบบเรียบร้อยแล้ว"; }
            else { S.pfPhotoErr=true; S.pfPhotoMsg="แสดงรูปในเครื่องได้ แต่บันทึกลงระบบไม่สำเร็จ กรุณาลองใหม่"; }
            render();
          });
        } else {
          S.pfPhotoBusy=false;
          S.pfPhotoMsg="ตั้งรูปประจำตัวเรียบร้อยแล้ว";
          render();
        }
      });
      re=false; break; }
    case "setfy": S.fy=val2; S.repView=null; S.repMsg=""; EDM_CACHE=null; S.dxSid=null; S.prgSid=null; break;
    case "setfp": S.fp=val2; S.repView=null; S.repMsg=""; EDM_CACHE=null; S.dxSid=null; S.prgSid=null; break;
    case "irtmodel": S.irtModel=mirtModel(val2); IQ_CACHE={}; MIRT_CACHE=null; break;
    case "iqcomp": S.iqComp=val2; S.iqItem=0; S.iqMsg=""; break;
    case "pfaff": case "pfgrp": case "pflvl": case "pfsch": break;
    case "lecscope": S.lecScope=val2; break;
    case "assid": S.asSid=val2; S.asScores={}; S.asComp=null; S.asSaved=false; break;
    case "ascomp": S.asComp=val2; S.asScores={}; S.asSaved=false; break;
    case "astype": S.asType=val2; break;
    case "evtype": S.evNew.type=val2; re=false; break;
    case "evsid": S.evSid=val2; S.evErr=""; break;
    case "evfile": {
      const f=el.files&&el.files[0];
      if(!f){ S.evNew.fileName=""; S.evNew.fileData=""; S.evNew.fileMime=""; break; }
      if(f.size>10*1024*1024){ S.evErr="ไฟล์ใหญ่เกิน 10 เมกะไบต์ กรุณาลดขนาดก่อนอัปโหลด";
        S.evNew.fileName=""; S.evNew.fileData=""; S.evNew.fileMime=""; break; }
      const rd=new FileReader();
      rd.onload=()=>{ S.evNew.fileName=f.name; S.evNew.fileMime=f.type||"application/octet-stream";
        S.evNew.fileData=String(rd.result).split(",")[1]||""; S.evErr=""; render(); };
      rd.onerror=()=>{ S.evErr="อ่านไฟล์ไม่สำเร็จ"; render(); };
      rd.readAsDataURL(f);
      re=false; break; }
    case "fwtarget":
      cfgEdit(S.year,v).target=+val2; saveYearCfg(S.year); break;
    case "fwtest": { cfgEdit(S.year,v).test.open=true; saveYearCfg(S.year); break; }
    case "fwactive":
      cfgEdit(S.year,v).active=el.checked; saveYearCfg(S.year); break;
    case "fwmcsel": { const c=FW.competencies.find(x=>x.id===v); if(c){ c.ptru=val2; saveComp(c); } break; }
    case "fwcopy": { if(!val2) {re=false;break;}
      const src=yearOf(FW,+val2), dst=yearOf(FW,S.year);
      /* เดิมคัดลอกไม่ครบ ตกทั้ง test (จำนวนข้อและเวลาสอบ) จนค่าที่ตั้งไว้หายไปเป็นค่าตั้งต้น */
      dst.config=Object.fromEntries(Object.entries(src.config).map(([cid2,cf])=>[cid2,{
        active:cf.active,target:cf.target,
        test:{open:(cf.test&&cf.test.open)!==false,

/* Apps Script กำหนดส่วนหัว CORS เองไม่ได้ ระบบจึงใช้สองช่องทาง
   1) POST แบบ text/plain  ใช้ได้เมื่อหน้าเว็บถูกเปิดผ่าน http หรือ https
   2) JSONP ผ่านแท็ก script ใช้เมื่อเบราว์เซอร์ปิดกั้นคำขอข้ามต้นทาง
      เช่นเปิดไฟล์จากเครื่องโดยตรง (file://) ซึ่งต้นทางจะเป็น null
   ระบบจะลองช่องทางแรกก่อน หากติดปัญหาการเชื่อมต่อจึงเปลี่ยนไปใช้ช่องทางสำรองอัตโนมัติ */
let JSONP_SEQ = 0;
function jsonpCall(params, timeout) {
  return new Promise((resolve, reject) => {
    const cb = 'ptruJSONP' + (++JSONP_SEQ) + '_' + Date.now().toString(36);
    const q = Object.keys(params)
      .filter(k => params[k] !== undefined && params[k] !== null && params[k] !== '')
      .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
    const url = LIVE_CFG.url + (LIVE_CFG.url.indexOf('?') < 0 ? '?' : '&') + q + '&callback=' + cb;
    if (url.length > 7000) {
      reject(Object.assign(new Error('ข้อมูลยาวเกินกว่าจะส่งด้วยช่องทางสำรองได้ กรุณาเปิดหน้าเว็บผ่าน http หรือ https'),
        {transport: true}));
      return;
    }
    const el = document.createElement('script');
    let settled = false;
    const clean = () => { try { delete window[cb]; } catch (x) { window[cb] = undefined; }
                          if (el.parentNode) el.parentNode.removeChild(el); clearTimeout(timer); };
    const timer = setTimeout(() => {
      if (settled) return; settled = true; clean();
      reject(Object.assign(new Error('เซิร์ฟเวอร์ไม่ตอบภายในเวลาที่กำหนด'), {transport: true}));
    }, timeout || LIVE_CFG.timeout);
    window[cb] = out => {
      if (settled) return; settled = true; clean();
      if (!out || !out.ok) reject(Object.assign(new Error((out && out.error) || 'เกิดข้อผิดพลาดที่เซิร์ฟเวอร์'),
        {server: true, code: out && out.code}));
      else resolve(out.data);
    };
    el.onerror = () => {
      if (settled) return; settled = true; clean();
      reject(Object.assign(new Error('เรียกเซิร์ฟเวอร์ผ่านช่องทางสำรองไม่สำเร็จ กรุณาตรวจสอบ URL และสิทธิ์การเข้าถึง'),
        {transport: true}));
    };
    el.src = url;
    document.head.appendChild(el);
  });
}

const API = {
  token: null,
  transport: null,          // 'post' หรือ 'jsonp' เมื่อทราบแล้วว่าช่องทางใดใช้ได้

  /** ส่งแบบ POST ชนิด text/plain โดยตั้งใจ เพื่อไม่ให้เบราว์เซอร์ส่ง preflight */
  async post(body) {
    const ctrl = ('AbortController' in window) ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), LIVE_CFG.timeout) : null;
    let res;
    try {
      res = await fetch(LIVE_CFG.url, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(body),
        redirect: 'follow',
        signal: ctrl ? ctrl.signal : undefined,
      });
    } catch (e) {
      throw Object.assign(new Error('เบราว์เซอร์ติดต่อเซิร์ฟเวอร์แบบ POST ไม่สำเร็จ'), {transport: true});
    } finally { if (timer) clearTimeout(timer); }
    if (!res.ok) throw Object.assign(new Error('เซิร์ฟเวอร์ตอบกลับ HTTP ' + res.status), {transport: true});
    let out;
    try { out = await res.json(); }
    catch (e) { throw Object.assign(new Error('ข้อมูลที่ได้รับไม่ใช่ JSON กรุณาตรวจสอบการ deploy'), {transport: true}); }
    if (!out.ok) throw Object.assign(new Error(out.error || 'เกิดข้อผิดพลาดที่เซิร์ฟเวอร์'),
      {server: true, code: out.code});
    return out.data;
  },

  jsonpUntil: 0,            // เวลาที่จะกลับไปลองช่องทางปกติอีกครั้ง

  async call(action, params) {
    const body = Object.assign({action, token: API.token}, params || {});

    /* ตกไปใช้ช่องทางสำรองเพียงชั่วคราว ไม่ใช่ถาวร
       เดิมเมื่อ POST พลาดหนึ่งครั้ง ระบบจะปักธงเป็น jsonp แล้วใช้ช่องทางสำรองไปตลอดทั้งเซสชัน
       ทั้งที่ความล้มเหลวส่วนใหญ่เป็นเรื่องชั่วคราว ทำให้รับส่งข้อมูลช้าลงและส่งข้อมูลยาวไม่ได้ */
    const usePost = API.transport !== 'jsonp' || Date.now() > API.jsonpUntil;
    if (usePost) {
      /* ลองซ้ำเมื่อสะดุดที่การเชื่อมต่อ Apps Script มีช่วงตอบช้าหรือหลุดเป็นครั้งคราว
         ข้อผิดพลาดจากฝั่งเซิร์ฟเวอร์ (เช่น รหัสผ่านผิด) ไม่ต้องลองซ้ำ */
      let lastErr = null;
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const d = await API.post(body);
          API.transport = 'post';
          if (LIVE.note) LIVE.note = '';
          return d;
        } catch (e) {
          if (e.server) throw e;
          lastErr = e;
          if (attempt < 2) await new Promise(r => setTimeout(r, 600 * (attempt + 1)));
        }
      }
      LIVE.note = 'ใช้ช่องทางสำรองชั่วคราว เพราะช่องทางปกติติดขัด' + (lastErr && lastErr.message ? ' · ' + lastErr.message : '');
    }
    const d = await jsonpCall({action, token: API.token || '', payload: JSON.stringify(params || {})});
    API.transport = 'jsonp';
    API.jsonpUntil = Date.now() + 60000;    // อีกหนึ่งนาทีให้กลับไปลองช่องทางปกติใหม่
    return d;
  },

  /** ตรวจสถานะบริการ ลองทั้งสองช่องทางเช่นกัน */
  async health() {
    if (API.transport !== 'jsonp') {
      try {
        const u = LIVE_CFG.url + (LIVE_CFG.url.indexOf('?') < 0 ? '?' : '&') + 'action=health';
        const res = await fetch(u, {method: 'GET', redirect: 'follow'});
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const out = await res.json();
        if (!out.ok) throw Object.assign(new Error(out.error || 'health ไม่สำเร็จ'), {server: true});
        API.transport = 'post';
        return out.data;
      } catch (e) {
        if (e.server) throw e;
      }
    }
    const d = await jsonpCall({action: 'health'}, 20000);
    API.transport = 'jsonp';
    return d;
  },
};

/** ทำให้ค่าความยากของ GRM เรียงจากน้อยไปมากและมีจำนวนเท่ากับจำนวนระดับลบหนึ่ง */
function fixB(arr, need) {
  let b = Array.isArray(arr) ? arr.map(Number).filter(v => isFinite(v)) : [];
  const base = [-1.60, -0.60, 0.45, 1.45, 2.30];
  while (b.length < need) b.push(base[b.length] !== undefined ? base[b.length] : (b.length ? b[b.length - 1] + 0.9 : 0));
  b = b.slice(0, need).sort((x, y) => x - y);
  for (let k = 1; k < b.length; k++) if (b[k] <= b[k - 1]) b[k] = b[k - 1] + 0.12;
  return b.map(v => +v.toFixed(2));
}

/*───────── 21.4 กรอบสมรรถนะจากเซิร์ฟเวอร์ ─────────*/
function applyFramework(d) {
  const levels = (d.levels || []).slice().sort((a, b) => (a.seq || 0) - (b.seq || 0))
    .map(l => ({id: l.level_id, th: l.name_th || '', en: l.name_en || ''}));
  const comps = (d.competencies || []).slice().sort((a, b) => (a.seq || 0) - (b.seq || 0))
    .map(c => ({id: c.comp_id, code: c.code || '', th: c.name_th || '', en: c.name_en || '', ptru: c.ptru || 'P'}));
  if (!levels.length || !comps.length) return false;

  const cfgBy = {};
  (d.year_config || []).forEach(c => cfgBy[Number(c.year) + '|' + c.comp_id] = c);
  const indBy = {};
  (d.indicators || []).forEach(i => {
    const k = Number(i.year) + '|' + i.comp_id;
    (indBy[k] = indBy[k] || []).push(i);
  });

  /* ชื่อชั้นปีและระยะพัฒนาการที่ผู้ดูแลตั้งไว้ในฐานข้อมูล ถ้ายังไม่เคยตั้งจึงใช้ค่าตั้งต้นของระบบ */
  const meta = (d.year_meta && typeof d.year_meta === 'object') ? d.year_meta : {};
  const years = [1, 2, 3, 4].map(y => {
    const ys = YEAR_STAGES.find(s => s.year === y) || {label: 'ชั้นปีที่ ' + y, stage: '', target: 3};
    const m = meta[String(y)] || {};
    const config = {};
    comps.forEach((c, ci) => {
      const cf = cfgBy[y + '|' + c.id];
      const list = (indBy[y + '|' + c.id] || []).slice().sort((a, b) => (a.seq || 0) - (b.seq || 0));
      config[c.id] = {
        active: cf ? cf.is_active !== false : list.length > 0,
        target: cf ? numOr(cf.target_level, ys.target) : ys.target,

        test: {open: cf ? !!cf.exam_open : false,
               n: cf ? (numOr(cf.exam_items, ITEMS_PER_COMP_DEF) || ITEMS_PER_COMP_DEF) : ITEMS_PER_COMP_DEF,
               min: cf ? (numOr(cf.exam_minutes, EXAM_MIN_DEF) || EXAM_MIN_DEF) : EXAM_MIN_DEF},
        indicators: list.map(i => ({
          id: i.ind_id,
          th: i.text || '',
          descriptors: levels.map((l, k) =>
            (i.descriptors && (i.descriptors[k + 1] !== undefined ? i.descriptors[k + 1] : i.descriptors[String(k + 1)]))
            || DEFAULT_DESC[k] || ''),
          irt: {a: (numOr(i.irt_a, 0) > 0 ? +numOr(i.irt_a, 1.15).toFixed(2) : 1.15),
                b: fixB(jparse(i.irt_b, []), Math.max(1, levels.length - 1))},
          cdm: {g: numOr(i.cdm_g, 0.15), s: numOr(i.cdm_s, 0.12)},
          q: (function () {
            const q = jparse(i.q_vector, []);
            const out = Array.from({length: comps.length}, (_, k) => (Array.isArray(q) && q[k] ? 1 : 0));
            if (!out.some(Boolean)) out[ci] = 1;   // ไม่ได้กำหนดไว้ ให้ผูกกับสมรรถนะของตนเอง
            return out;
          })(),
        })),
      };
    });
    return {year: y, label: m.label || ys.label, stage: m.stage || ys.stage,
            config};
  });

  /* เก็บเวอร์ชันกรอบสมรรถนะจากเซิร์ฟเวอร์ไว้กำกับเอกสารทุกฉบับ */
  FW = {levels, competencies: comps, years,
        version: String(d.version || '—'), updatedAt: String(d.updated_at || '')};
  LIVE.fwLive = true;
  S.fwSel = FW.competencies[0].id;
  S.iqComp = FW.competencies[0].id;
  reindexQ();
  return true;
}

/*───────── 21.5 คลังข้อสอบจากเซิร์ฟเวอร์ ─────────*/
const KEYCOL = ['A', 'B', 'C', 'D', 'E'];
function applyItems(rows) {
  const items = (rows || []).filter(i => String(i.status) === 'active' || !i.status).map(i => ({
    id: i.item_id, comp: i.comp_id, no: numOr(i.seq, 1),
    stem: i.stem || '',
    choices: [i.choice_a, i.choice_b, i.choice_c, i.choice_d, i.choice_e].map(x => x == null ? '' : String(x)),
    key: Math.max(0, KEYCOL.indexOf(String(i.answer_key || 'A').toUpperCase())),
    tA: numOr(i.true_a, 1), tB: numOr(i.true_b, 0), tC: numOr(i.true_c, 0.2), tD: numOr(i.true_d, 1),
  }));
  if (!items.length) return false;
  BANK = items; LIVE.bankLive = true; bankChanged();
  return true;
}

/*───────── 21.6 ผลการประเมินรายบุคคล ─────────*/
function applyAssessments(sid, d) {
  const asm = d.assessments || [], sc = d.scores || [];
  const byAsm = {}; asm.forEach(a => byAsm[a.assess_id] = a);
  const rounds = {};
  sc.forEach(s => {
    const a = byAsm[s.assess_id]; if (!a) return;
    const rn = String(a.round_no || 1);
    let R = rounds[rn];
    if (!R) {
      R = rounds[rn] = {no: +rn || 1, date: a.assess_date || ''};
      RATERS.forEach(x => R[x.key] = {});       // กล่องคะแนนของทุกฝ่ายตามนิยามกลาง
    }
    if (a.assess_date && (!R.date || String(a.assess_date) > String(R.date))) R.date = a.assess_date;
    const rater = raterByType(a.assess_type);   // ประเภทที่ไม่อยู่ในกติกา เช่น peer หรือ director จะถูกข้าม
    if (!rater) return;
    const v = Number(s.level_score); if (!isFinite(v)) return;
    const box = R[rater.key];
    const cell = box[s.ind_id] = box[s.ind_id] || {sum: 0, n: 0};
    cell.sum += v; cell.n++;
  });
  const flatten = box => {
    const o = {};
    Object.keys(box).forEach(k => o[k] = box[k].sum / box[k].n);
    return o;
  };
  const list = Object.keys(rounds).map(k => rounds[k]).sort((a, b) => a.no - b.no).map(R => {
    const out = {no: R.no, label: 'ครั้งที่ ' + R.no, when: R.date || ''};
    RATERS.forEach(x => out[x.key] = flatten(R[x.key]));
    /* คะแนนรวมรายตัวชี้วัด ใช้กติกาเดียวกับที่แสดงบนหน้าจอ
       เฉลี่ยอาจารย์นิเทศก์สองประเภทเข้าด้วยกันก่อน แล้วจึงเฉลี่ยสามฝ่ายที่มีข้อมูล */
    const ids = new Set();
    RATERS.forEach(x => Object.keys(out[x.key]).forEach(id => ids.add(id)));
    const resp = {};
    ids.forEach(id => {
      const groups = SCORE_GROUPS.map(g => {
        const vals = g.raters.map(k => out[k][id]).filter(x => x !== undefined);
        return vals.length ? mean(vals) : null;
      }).filter(x => x !== null);
      if (!groups.length) return;
      resp[id] = clamp(Math.round(mean(groups)), 1, FW.levels.length);   // แบบจำลองจิตมิติต้องการหมวดคะแนนแบบจำนวนเต็ม
    });
    out.resp = resp;
    /* ชื่อเดิมที่โค้ดบางส่วนยังอ้างถึง */
    out.men = out.men; out.self = out.slf;
    return out;
  });

  delete RESP[sid]; delete HIST[sid]; delete ASSESS_LOG[sid];
  RATERS.forEach(x => { delete x.store()[sid]; });
  if (list.length) {
    HIST[sid] = list;
    const last = list[list.length - 1];
    RESP[sid] = last.resp;
    RATERS.forEach(x => { x.store()[sid] = last[x.key]; });
  }

  /* ระเบียนการประเมินจริงรายครั้ง พร้อมผู้ประเมินและวันที่จากชีต Assessments
     รายงานความก้าวหน้าและประวัติการประเมินอ่านจากตรงนี้ ไม่ได้สังเคราะห์ขึ้นเอง */
  const nBy = {};
  sc.forEach(s => { const k = String(s.assess_id); nBy[k] = (nBy[k] || 0) + 1; });
  ASSESS_LOG[sid] = asm.filter(a => raterByType(a.assess_type)).map(a => ({
    assess_id: String(a.assess_id || ''), comp_id: String(a.comp_id || ''),
    type: String(a.assess_type || '').toLowerCase(),
    round_no: Number(a.round_no) || 1,
    date: String(a.assess_date || a.created_at || '').slice(0, 10),
    assessor_id: String(a.assessor_id || ''), assessor_name: '',
    assessor_role: String(a.assessor_role || ''),
    n_items: nBy[String(a.assess_id)] || 0,
    comment: String(a.comment || ''),
  }));

  LIVE.deep.add(sid);
  return list.length;
}

function applyEvidenceRows(sid, rows) {
  const list = (rows || []).map(e => ({
    id: e.evidence_id, student: e.student_id, title: e.title || '',
    type: e.evidence_type || 'อื่น ๆ',
    date: String(e.uploaded_at || '').slice(0, 10),
    comps: jparse(e.comp_ids, []) || [],
    status: e.status || 'pending',
    url: e.file_url || '',
  }));
  EVIDENCE = list;
  const u = userById(sid);
  if (u) {
    /* ความครบถ้วนของหลักฐาน = สัดส่วนรายการที่ผ่านการตรวจสอบแล้ว */
    u.evidence = list.length ? list.filter(x => x.status === 'verified').length / list.length : null;
  }
  return list.length;
}

/*───────── 21.7 การดึงข้อมูลหลังเข้าสู่ระบบ ─────────*/
/** ดึงข้อมูลตั้งต้นแบบเดิมทีละคำสั่ง ใช้เมื่อเซิร์ฟเวอร์ยังไม่มีคำสั่ง boot.data
    เรียกพร้อมกันทั้งหมดแทนการเรียงกันทีละคำสั่ง จึงยังเร็วกว่าของเดิม */
async function liveBootLegacy() {
  const staff = ['Administrator', 'Program Chair', 'Dean'].includes(S.role);
  const grab = async (action, pick) => {
    try { const r = await API.call(action, {}); return pick(r) || []; } catch (e) { return []; }
  };
  const [framework, users, registrations, items] = await Promise.all([
    API.call('framework.get', {}).catch(() => null),
    grab('users.list', r => r.users),
    staff ? grab('reg.list',  r => r.registrations || r.rows) : Promise.resolve([]),
    staff ? grab('item.list', r => r.items) : Promise.resolve([]),
  ]);
  return {framework, users, registrations, items, skipped: []};
}

async function liveHydrate() {
  liveBusy(1);
  try {
    const me = S.user;

    const roleNow = S.role;
    const isStudent = roleNow === 'Student';

    /* 1) ยิงทุกคำขอที่ไม่ขึ้นต่อกันพร้อมกันในรอบเดียว
       Apps Script ตอบแต่ละคำขอหลายวินาที การเรียงกันจึงบวกเวลากันตรง ๆ
       assess.bulk คัดนักศึกษาตามสิทธิ์ที่ฝั่งเซิร์ฟเวอร์เอง จึงไม่ต้องรอรายชื่อผู้ใช้ก่อน
       เวลารวมจึงเท่ากับคำขอที่ช้าที่สุดเพียงคำขอเดียว แทนที่จะเป็นผลบวกของทุกคำขอ */
    loaderSet(62, 'กำลังโหลดข้อมูลทั้งหมดพร้อมกัน');
    const [bootRes, bulkRes, evRes, examRes] = await Promise.all([
      API.call('boot.data', {}).catch(e => ({__err: e})),
      API.call('assess.bulk', {}).catch(() => null),
      isStudent ? API.call('evidence.list', {student_id: me.id}).catch(() => null) : Promise.resolve(null),
      isStudent ? API.call('exam.results', {student_id: me.id}).catch(() => null) : Promise.resolve(null),
    ]);

    let boot = bootRes;
    if (boot && boot.__err) {
      const e = boot.__err;
      /* เซิร์ฟเวอร์ยังเป็นรุ่นก่อนที่ไม่มี boot.data (ยังไม่ได้ deploy Code.gs รุ่นใหม่)
         ถอยไปเรียกทีละคำสั่งแบบเดิม เพื่อให้หน้าเว็บยังใช้งานได้ */
      if (String(e.code) === 'NO_ROUTE' || /ไม่พบคำสั่ง/.test(e.message || '')) {
        LIVE.note = 'เซิร์ฟเวอร์ยังเป็นรุ่นก่อน กรุณาอัปเดต Code.gs เพื่อให้โหลดข้อมูลได้เร็วขึ้น';
        boot = await liveBootLegacy();
      } else { liveErr(e); boot = null; }
    }

    if (boot && boot.framework) {
      if (!applyFramework(boot.framework))
        LIVE.info = 'เซิร์ฟเวอร์ยังไม่มีข้อมูลกรอบสมรรถนะ ระบบจึงใช้กรอบตั้งต้นในไฟล์นี้แทน กรุณารัน seedFramework() ในโปรเจกต์ Apps Script';
    }

    /* 2) ผู้ใช้งาน */
    let users = ((boot && boot.users) || []).map(mapUser);
    if (!users.some(u => u.id === me.id)) users = users.concat([me]);
    USERS = users;
    S.user = userById(me.id) || me;

    /* 3) ล้างข้อมูลจำลองที่ไม่ควรแสดงในโหมดจริง */
    Object.keys(RESP).forEach(k => delete RESP[k]);
    RATERS.forEach(x => { const st = x.store(); Object.keys(st).forEach(k => delete st[k]); });
    Object.keys(HIST).forEach(k => delete HIST[k]);
    Object.keys(ASSESS_LOG).forEach(k => delete ASSESS_LOG[k]);
    LIVE.deep.clear(); LIVE.evLoaded.clear();
    EVIDENCE = []; PENDING = [];

    /* 4) ข้อมูลของผู้ดูแลและผู้บริหาร มาพร้อม boot.data แล้ว */
    PENDING = ((boot && boot.registrations) || []).map(mapReg);
    const items = (boot && boot.items) || [];
    if (items.length) applyItems(items);
    else if (!LIVE.bankLive) { BANK = buildBank(); bankChanged(); }

    /* 5) ผลรายตัวชี้วัด มาพร้อมรอบเดียวกันแล้ว เหลือเพียงนำมาใช้
       ต้องทำหลังใส่กรอบสมรรถนะ เพราะการรวมคะแนนใช้จำนวนระดับจากกรอบ */
    loaderSet(84, 'กำลังประมวลผลการประเมิน');
    let bulkOk = 0;
    if (bulkRes && bulkRes.students) {
      Object.keys(bulkRes.students).forEach(sid => {
        applyAssessments(sid, bulkRes.students[sid]);
        bulkOk++;
      });
    }
    if (evRes) applyEvidenceRows(me.id, evRes.evidence);
    if (examRes) applyExamRows(me.id, examRes);

    /* ถ้า assess.bulk ใช้ไม่ได้ (เซิร์ฟเวอร์รุ่นก่อน) ค่อยถอยไปวิธีเดิม */
    const role = S.role;
    if (!bulkOk) {
      if (role === 'Student') await Promise.all([liveStudent(me.id, true), liveExamResults(me.id)]);
      else if (LIVE_CFG.autoDeep) liveSyncAll();
    }
    loaderSet(95, 'เตรียมหน้าจอ');
    render();

    /* 6) คลังข้อสอบว่างเปล่า ค่อยซิงก์ชุดตั้งต้นทีหลัง ไม่ให้ขวางการเข้าใช้งาน */
    const staff = ['Administrator', 'Program Chair'].includes(role);
    if (staff && !items.length) {
      BANK = buildBank(); bankChanged();
      syncAllItemsToSheet(false).then(ok => {
        if (!ok) LIVE.info = 'ไม่สามารถซิงก์คลังข้อสอบชุดตั้งต้นลง ItemBank ได้';
        render();
      });
    }
  } finally { liveBusy(-1); }
}

function mapReg(r) {
  return {
    id: r.reg_id, ref: r.ref || '',
    name: [r.prefix, r.first_name, r.last_name].filter(Boolean).join(' ').trim(),
    email: r.email || '', tel: r.phone || '', school: r.school || '', aff: r.affiliation || '',
    program: r.program_id || '', group: r.subject_group || '', teachLevel: r.teach_level || '',
    exp: r.experience_years === '' || r.experience_years == null ? '' : String(r.experience_years),
    /* บทบาทมาจากคอลัมน์ role ที่ผู้สมัครเลือกเอง เดิมอนุมานจากรหัสเชิญซึ่งเลิกใช้แล้ว */
    role: String(r.role || '') === 'Director' ? 'Director' : 'Mentor',
    at: String(r.submitted_at || '').slice(0, 10),
  };
}

/** ดึงผลการสอบล่าสุดของนักศึกษาจากฐานข้อมูลทุกครั้งที่เข้าสู่ระบบ */
async function liveExamResults(sid){
  if(!liveOn() || !sid) return 0;
  try { return applyExamRows(sid, await API.call('exam.results', {student_id:sid})); }
  catch(e) { liveErr(e); return 0; }
}

/** แปลงผลการสอบจากเซิร์ฟเวอร์ลงคลังในหน้าเว็บ
    แยกออกมาเพื่อให้ liveHydrate ใช้ผลที่ดึงมาพร้อมคำขออื่นได้ โดยไม่ต้องยิงซ้ำ */
function applyExamRows(sid, d){
  try {
    const attempts = Array.isArray(d && d.attempts) ? d.attempts : [];
    const latest = {};
    attempts.filter(a => String(a.status || '').toLowerCase() === 'submitted' || a.submitted_at)
      .sort((a,b) => String(a.submitted_at || a.created_at || '').localeCompare(String(b.submitted_at || b.created_at || '')))
      .forEach(a => {
        const cid = String(a.comp_id || '');
        if (!cid) return;
        latest[cid] = a;
      });
    Object.keys(latest).forEach(cid => {
      const a = latest[cid];
      const existing = EXAM_RESULTS.filter(r => r.sid===sid && r.comp===cid).slice(-1)[0] || {};
      EXAM_RESULTS = EXAM_RESULTS.filter(r => !(r.sid===sid && r.comp===cid)).concat([{
        sid:sid, comp:cid, year:Number(a.year || (userById(sid)||{}).year || 0),
        correct:Number(a.n_correct || 0), n:Number(a.n_items || 0),
        theta:Number(a.theta || 0), se:Number(a.se || 0), level:Number(a.level || 1),
        ans:existing.ans || {}, itemResults:Array.isArray(a.item_results)?a.item_results:[], percent:Number(a.percent||0), at:a.submitted_at || a.created_at || '',
        dbSaved:true, attempt_id:a.attempt_id || ''
      }]);
    });
    return Object.keys(latest).length;
  } catch(e) {
    liveErr(e);
    return 0;
  }
}

/** ดึงแฟ้มสะสมงานของนักศึกษาหนึ่งคน ใช้ร่วมกันทั้งหน้าของนักศึกษาและของผู้ตรวจสอบ
    force = true เมื่อต้องการดึงซ้ำหลังบันทึกหรือหลังตรวจสอบ */
async function liveEvidence(sid, force) {
  if (!liveOn() || !sid) return 0;
  if (!force && LIVE.evLoaded.has(sid)) return 0;
  LIVE.evLoaded.add(sid);                 // กันการยิงซ้ำระหว่างที่คำขอยังไม่กลับ
  liveBusy(1);
  try {
    const r = await API.call('evidence.list', {student_id: sid});
    applyEvidenceRows(sid, r.evidence);
    LIVE.err = '';
    return (r.evidence || []).length;
  } catch (e) { LIVE.evLoaded.delete(sid); liveErr(e); return 0; }
  finally { liveBusy(-1); }
}

/** ดึงผลรายตัวชี้วัดของนักศึกษาหนึ่งคน พร้อมแฟ้มสะสมงานเมื่อระบุ */
async function liveStudent(sid, withEvidence) {
  if (!liveOn() || !sid) return 0;
  liveBusy(1);
  try {
    const d = await API.call('assess.byStudent', {student_id: sid});
    const n = applyAssessments(sid, d);       // จำนวนรอบการประเมินที่ดึงลงมาได้
    if (withEvidence) await liveEvidence(sid, true);
    return n;
  } catch (e) { liveErr(e); return 0; }
  finally { liveBusy(-1); }
}

/** ดึงผลการประเมินของผู้เรียนที่กำลังใช้งานอยู่ใหม่จากฐานข้อมูล
    ใช้บนหน้าพัฒนาการของฉัน เพื่อให้ผู้เรียนยืนยันได้เองว่าตัวเลขมาจากฐานข้อมูลจริง
    ดึงผลสอบมาด้วย เพราะรายงานหน้านี้อ้างถึงทั้งสองแหล่ง */
async function mySync() {
  if (!liveOn()) return;
  const me = userById(S.user.linkTo || S.user.id) || S.user;
  if (!me) return;
  toast('⏳ กำลังดึงผลการประเมินจากฐานข้อมูล…', 'wait', true);
  liveBusy(1);
  try {
    await liveStudent(me.id, true);
    try { await liveExamResults(me.id); } catch (x) {}
    const rec = (ASSESS_LOG[me.id] || []).length;
    LIVE.err = '';
    LIVE.info = rec
      ? `ดึงข้อมูลจากฐานข้อมูลแล้ว พบระเบียนการประเมินจริง ${rec} รายการ`
      : 'เชื่อมต่อฐานข้อมูลได้ แต่ยังไม่มีผู้ประเมินบันทึกผลของท่าน';
    toastSaved(LIVE.info);
  } catch (e) {
    liveErr(e);
    toastFailed((e && e.message) || '');
  } finally { liveBusy(-1); render(); }
}

/** ซิงก์ผลรายตัวชี้วัดของนักศึกษาทุกคนที่ผู้ใช้มีสิทธิ์เห็น */
async function liveSyncAll(force) {
  if (!liveOn() || LIVE.sync.running) return;
  const list = visStudents().filter(s => force || !LIVE.deep.has(s.id));
  if (!list.length) { LIVE.info = 'ข้อมูลรายบุคคลเป็นปัจจุบันแล้ว'; render(); return; }
  LIVE.sync = {done: 0, total: list.length, running: true};
  render();

  /* ดึงเป็นชุด แทนการยิงคำขอทีละคน
     เดิมนักศึกษาสี่สิบคนคือสี่สิบคำขอ และแต่ละคำขออ่านชีต Assessments กับ AssessmentScores ใหม่ทั้งชีต
     assess.bulk อ่านสองชีตนั้นครั้งเดียวแล้วแจกตามนักศึกษา
     ยังแบ่งเป็นชุดละ 40 คน เพื่อไม่ให้คำตอบก้อนเดียวใหญ่เกินไปเมื่อข้อมูลสะสมมาก */
  const CHUNK = 40;
  const parts = [];
  for (let i = 0; i < list.length; i += CHUNK) parts.push(list.slice(i, i + CHUNK));

  /* ยิงหลายชุดพร้อมกัน แทนการรอทีละชุด
     Apps Script ตอบคำขอละหลายวินาที การรอเรียงกันจึงบวกเวลากันตรง ๆ
     จำกัดจำนวนที่ยิงพร้อมกันไว้ตาม LIVE_CFG.parallel เพื่อไม่ให้ชนโควตาของ Apps Script */
  let failed = 0;
  const runPart = async part => {
    try {
      const d = await API.call('assess.bulk', {student_ids: part.map(s => s.id)});
      const box = (d && d.students) || {};
      part.forEach(s => applyAssessments(s.id, box[s.id] || {assessments: [], scores: []}));
    } catch (e) {
      liveErr(e); failed += part.length;
      /* คำขอชุดล้มเหลว ถอยไปดึงทีละคนเฉพาะชุดนี้ เพื่อให้ได้ข้อมูลเท่าที่ได้ */
      for (const s of part) {
        try { applyAssessments(s.id, await API.call('assess.byStudent', {student_id: s.id})); failed--; }
        catch (x) { /* ข้ามคนที่ดึงไม่ได้ */ }
      }
    }
    LIVE.sync.done = Math.min(list.length, LIVE.sync.done + part.length);
    render();
  };
  let next = 0;
  const worker = async () => { while (next < parts.length) await runPart(parts[next++]); };
  await Promise.all(Array.from({length: Math.min(LIVE_CFG.parallel, parts.length)}, worker));
  LIVE.sync.running = false;
  EDM_CACHE = null;
  LIVE.info = failed
    ? 'ซิงก์ผลการประเมินแล้ว ' + (list.length - failed) + ' จาก ' + list.length + ' คน'
    : 'ซิงก์ผลการประเมินรายบุคคลครบ ' + list.length + ' คนแล้ว';
  render();
}

/*───────── 21.8 การเข้าสู่ระบบด้วยบัญชีจริง ─────────*/
async function liveLogin(email, pw) {

  liveBusy(1);

  LIVE.err = '';
  S.err = '';
  S.notice = '';

  /* หน้าจอกำลังเข้าสู่ระบบ แทนแถบแจ้งเตือนเดิม
     เปอร์เซ็นต์เดินตามขั้นตอนที่ทำเสร็จจริง ไม่ใช่ตัวเลขที่วิ่งเองตามเวลา */
  loaderShow('กำลังเข้าสู่ระบบ...');
  loaderSet(8, 'กำลังส่งคำขอไปยังฐานข้อมูล');
  render();

  try {

    /* 1. Authentication */
    const r = await API.call('auth.login', {
      email,
      password: pw,
      ua: navigator.userAgent
    });
    loaderSet(45, 'ยืนยันตัวตนสำเร็จ กำลังเตรียมสิทธิ์การใช้งาน');

    /* 2. Token */
    API.token = r.token;

    try {
      sessionStorage.setItem('ptru_token', r.token);
    } catch (e) {}

    /* 3. User */
    const u = mapUser(r.user);

    if (Array.isArray(r.roles) && r.roles.length) {
      u.roles = r.roles.filter(Boolean);
    }

    /* 4. ตั้งค่า Session */
    LIVE.session = true;

    S.user = u;
    S.role = u.roles?.[0] || null;
    S.page = 'dashboard';
    S.err = '';
    S.otpUser = null;

    S.notice = r.must_change_password
      ? 'บัญชีนี้ยังใช้รหัสผ่านชั่วคราว กรุณาเปลี่ยนรหัสผ่านที่หน้าโปรไฟล์'
      : '';

    /* 5. โหลดข้อมูลตั้งต้นให้เสร็จก่อนปิดหน้าจอโหลด
          ผู้ใช้จึงเห็นแดชบอร์ดที่มีข้อมูลครบตั้งแต่ครั้งแรก
          ไม่ใช่หน้าว่างที่ค่อย ๆ เติมข้อมูลเข้ามาทีหลัง */
    liveBusy(-1);
    loaderSet(60, 'กำลังโหลดกรอบสมรรถนะและรายชื่อผู้ใช้');

    try { await liveHydrate(); }
    catch (err) {
      console.warn('[PTRU] liveHydrate failed:', err);
      S.notice = 'เข้าสู่ระบบสำเร็จ แต่โหลดข้อมูลบางส่วนไม่สำเร็จ กดปุ่มซิงก์ข้อมูลเพื่อลองใหม่';
    }

    loaderHide();
    toast("✅ เข้าสู่ระบบสำเร็จ","ok");
    render();
    return true;

  } catch (e) {

    LIVE.session = false;
    API.token = null;

    try {
      sessionStorage.removeItem('ptru_token');
    } catch (x) {}

    S.err = (e && e.message) || 'เข้าสู่ระบบไม่สำเร็จ';
    S.notice = '';
    loaderHide();
    toastFailed(S.err);

    return false;

  } finally {

    // กรณีเกิด error ก่อนถึงจุด login สำเร็จ
    if (LIVE.busy > 0) {
      liveBusy(-1);
    }

    render();
  }
}


/*───────── 21.9 การออกจากระบบ ─────────*/
function liveLogout() {

  const token = API.token;
  const who = (S.user && S.user.name) ? ' · ' + S.user.name : '';

  /* แจ้งผู้ใช้ทันทีที่กด เดิมไม่มีสัญญาณใดเลยระหว่างรอเซิร์ฟเวอร์ตอบ ผู้ใช้จึงกดซ้ำ */
  toast('⏳ กำลังออกจากระบบ' + who + '…', 'wait', true);

  /* ตัด Session ฝั่ง UI ทันที ไม่รอเซิร์ฟเวอร์
     เดิม await auth.logout ก่อน ทำให้ค้างอยู่หลายวินาทีทั้งที่งานฝั่งผู้ใช้จบไปแล้ว
     การเพิกถอนโทเคนส่งตามไปเบื้องหลัง โดยแนบโทเคนที่เก็บไว้ก่อนล้างค่า */
  API.token = null;
  LIVE.session = false;

  LIVE.deep.clear();
  LIVE.evLoaded.clear();

  try {
    sessionStorage.removeItem('ptru_token');
  } catch (e) {}

  S.user = null;
  S.role = null;
  S.screen = 'login';
  S.err = '';
  S.notice = '';
  S.page = 'dashboard';

  render();
  /* หน่วงข้อความสำเร็จไว้ครู่หนึ่ง ไม่ใช่เพื่อรออะไร แต่เพราะทั้งฟังก์ชันจบในไม่กี่มิลลิวินาที
     ถ้าแจ้งผลทันทีจะทับข้อความ กำลังออกจากระบบ ในเฟรมเดียวกันจนผู้ใช้อ่านไม่ทัน */
  setTimeout(() => toast('ออกจากระบบเรียบร้อยแล้ว', 'ok'), LOGOUT_NOTICE_MS);

  /* auth.logout ต้องอ่านโทเคนจากคำขอ หากไม่แจ้ง เซสชันในชีต Sessions จะค้างจนหมดอายุเอง
     ส่งแบบไม่รอผล เพราะหน้าจอกลับไปหน้าเข้าสู่ระบบเรียบร้อยแล้ว */
  if (token) {
    Promise.resolve()
      .then(() => API.call('auth.logout', {token: token}))
      .catch(e => console.warn('[PTRU] logout:', e));
  }
}

/** ส่งรูปที่ย่อแล้ว (data URL ขนาด 256 พิกเซล) ขึ้นที่จัดเก็บไฟล์ของระบบ
    คืนค่า URL ที่ใช้แสดงผลได้ หรือค่าว่างเมื่อไม่สำเร็จ */
async function uploadAvatar(dataUrl) {
  if (!liveOn()) return '';
  const m = String(dataUrl || '').match(/^data:([^;,]+);base64,(.+)$/);
  if (!m) return '';
  liveBusy(1);
  try {
    const d = await API.call('file.upload',
      {kind: 'photo', filename: 'avatar.jpg', mime_type: m[1], data_base64: m[2]});
    LIVE.err = '';
    return (d && d.file_url) || '';
  } catch (e) { liveErr(e); return ''; }
  finally { liveBusy(-1); }
}

async function livePush(action, params, okMsg, after) {
  if (!liveOn()) return;
  liveBusy(1);
  toastSaving();                 // แจ้งผู้ใช้ว่ากำลังบันทึก เพราะ Apps Script ตอบช้าหลายวินาที
  try {
    const d = await API.call(action, params);
    if (okMsg) LIVE.info = okMsg;
    LIVE.err = '';
    if (after) await after(d);
    toastSaved(okMsg);
    return d;
  } catch (e) {
    liveErr(e);
    LIVE.queue.push({action, params, at: new Date().toISOString()});
    toastFailed((e && e.message) || '');
  } finally { liveBusy(-1); render(); }
}

/** รอบการประเมินที่ใช้บันทึก ค่าตั้งต้นคือรอบล่าสุดที่มีอยู่ เพื่อให้คะแนนของ
    อาจารย์นิเทศก์และครูพี่เลี้ยงอยู่รอบเดียวกันแล้วนำมาเฉลี่ยกันได้
    หากต้องการเปิดรอบใหม่ ให้ตั้ง LIVE_CFG.round เป็นตัวเลขรอบที่ต้องการ */
function liveRound(sid) {
  if (typeof LIVE_CFG.round === 'number') return LIVE_CFG.round;
  const h = HIST[sid] || [];
  return h.length ? Math.max.apply(null, h.map(r => r.no || 1)) : 1;
}

const isFileUrl = () => {

function liveBadge() {
  const dot = c => `<i style="width:.5rem;height:.5rem;border-radius:50%;background:${c};display:inline-block;flex:none"></i>`;
  let state, color;
  if (LIVE.checking) { state = 'กำลังตรวจสอบเซิร์ฟเวอร์'; color = 'var(--warn)'; }
  else if (!LIVE.on) { state = 'ยังไม่ได้เชื่อมต่อฐานข้อมูล'; color = 'var(--risk)'; }
  else if (!LIVE.session) { state = 'เชื่อมต่อฐานข้อมูล'; color = 'var(--ok)'; }
  else { state = 'เชื่อมต่อฐานข้อมูล'; color = 'var(--ok)'; }

  const bits = [];
  if (API.transport) bits.push(API.transport === 'jsonp' ? 'ช่องทางสำรอง' : 'ช่องทางปกติ');
  if (LIVE.busy) bits.push('กำลังรับส่งข้อมูล');
  if (LIVE.sync.running) bits.push(`ซิงก์รายบุคคล ${LIVE.sync.done}/${LIVE.sync.total}`);
  if (LIVE.note) bits.push(LIVE.note);

  const st = LIVE.status || {}, sd = st.data || {};
  const btns = [];
  if (!LIVE.checking && !LIVE.on) btns.push(`<button class="btn btn-ghost btn-sm" data-act="livecheck">ทดสอบการเชื่อมต่อ</button>`);
  if (LIVE.on && !LIVE.busy && (st.warnings || []).length)
    btns.push(`<button class="btn btn-ghost btn-sm" data-act="liverepair" title="รวมข้อมูลซ้ำและแก้รหัสอ้างอิงให้ตรงมาตรฐาน">ซ่อมข้อมูล</button>`);
  if (LIVE.on && !LIVE.busy && !sd.users)
    btns.push(`<button class="btn btn-ghost btn-sm" data-act="livesetup" title="สร้างชีต ข้อมูลตั้งต้น และบัญชีผู้ดูแลระบบ">ติดตั้งระบบ</button>`);
  if (LIVE.on && !LIVE.busy && LIVE.session && S.role === 'Administrator' &&
      (sd.indicators !== undefined && sd.indicators < 680))
    btns.push(`<button class="btn btn-ghost btn-sm" data-act="liveseed" title="เติมกรอบสมรรถนะ บัญชีผู้ใช้ คลังข้อสอบ และผลการประเมินตั้งต้น">เติมข้อมูลตั้งต้น</button>`);

  /* ซ่อนแถบสถานะเมื่อทุกอย่างปกติ
     เดิมแสดงตลอดเวลาแม้ไม่มีอะไรต้องทำ กลายเป็นกล่องข้อความบังหน้าจอโดยไม่จำเป็น
     แสดงเฉพาะเมื่อมีสิ่งที่ผู้ใช้ต้องรู้หรือต้องจัดการจริง คือ
     ยังต่อฐานข้อมูลไม่ได้ · มีข้อผิดพลาด · ต้องติดตั้งหรือซ่อมข้อมูล · กำลังซิงก์อยู่
     ส่วนผลสำเร็จตามปกติแจ้งผ่านแถบ toast ด้านบนอยู่แล้ว */
  const mustShow = LIVE.checking || !LIVE.on || !!LIVE.err || btns.length || LIVE.sync.running;
  if (!mustShow) return '';

  const msg = LIVE.err ? `<div style="color:var(--risk)">${esc(LIVE.err)}</div>`
            : (LIVE.info ? `<div style="color:var(--muted)">${esc(LIVE.info)}</div>` : '');
  const warn = (!LIVE.on && !LIVE.checking && isFileUrl())
    ? `<div style="color:var(--warn)">หน้านี้ถูกเปิดจากไฟล์ในเครื่องโดยตรง หากช่องทางสำรองยังไม่ทำงาน
         กรุณา deploy เวอร์ชันล่าสุดของ PTRU_Code.gs ที่รองรับ JSONP หรือเปิดหน้าเว็บผ่าน http หรือ https</div>` : '';

  return `<div style="position:fixed;right:.75rem;bottom:.75rem;z-index:80;display:flex;align-items:flex-start;gap:.5rem;
      max-width:min(34rem,92vw);padding:.5rem .8rem;border:1px solid var(--line);border-radius:10px;
      background:var(--surface);box-shadow:0 2px 12px rgba(0,0,0,.14);font-size:.78rem;line-height:1.5">
    <span style="padding-top:.4rem">${dot(color)}</span>
    <div style="flex:1;min-width:0">
      <div><b>${esc(state)}</b>${bits.length ? `<span style="color:var(--muted)"> · ${esc(bits.join(' · '))}</span>` : ''}</div>
      ${msg}${warn}
      ${btns.length ? `<div style="margin-top:.35rem;display:flex;gap:.35rem;flex-wrap:wrap">${btns.join('')}</div>` : ''}
    </div></div>`;
}

      '<h2>เข้าสู่ระบบ</h2><div class="alert alert-info">' + esc(note) + '</div>');
};

/*───────── 21.11 ดักการทำงานก่อนตัวจัดการเดิม (capture) ─────────*/
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;

  if (a === 'livesync') { e.stopPropagation(); e.preventDefault(); liveSyncAll(true); return; }
  /* ผู้เรียนดึงเฉพาะข้อมูลของตนเอง ไม่ใช้ liveSyncAll ซึ่งจะไล่ดึงนักศึกษาทุกคนโดยไม่จำเป็น */
  if (a === 'mysync') { e.stopPropagation(); e.preventDefault(); mySync(); return; }
  if (a === 'livecheck') { e.stopPropagation(); e.preventDefault(); liveConnect(true); return; }
  if (a === 'livesetup') { e.stopPropagation(); e.preventDefault(); liveSetup(); return; }
  if (a === 'liveseed')  { e.stopPropagation(); e.preventDefault(); liveSeed(); return; }
  if (a === 'liverepair') { e.stopPropagation(); e.preventDefault(); liveRepair(); return; }

  /* การเข้าสู่ระบบต้องไม่รอผลตรวจสอบเซิร์ฟเวอร์
     เดิมถ้าผู้ใช้กดเข้าสู่ระบบระหว่างที่ health ยังไม่ตอบ (ใช้เวลาหลายวินาที) LIVE.on ยังเป็นเท็จ
     ระบบจึงตกไปใช้ตัวตรวจของโหมดสาธิตซึ่งไม่รู้จักบัญชีจริง แล้วขึ้นว่า "อีเมลหรือรหัสผ่านไม่ถูกต้อง"
     ทั้งที่รหัสผ่านถูกต้อง คำสั่ง auth.login ไม่ได้ต้องพึ่ง health จึงส่งไปที่เซิร์ฟเวอร์ได้ทันที */
  const serverMode = LIVE_CFG.mode !== 'demo' && (LIVE.on || LIVE.checking);
  if (serverMode && (a === 'login' || a === 'fill')) {
    e.stopPropagation(); e.preventDefault();
    if (a === 'fill') {
      S.err = 'ระบบเชื่อมต่อฐานข้อมูลจริง กรุณากรอกอีเมลและรหัสผ่านของบัญชีในระบบ';
      render(); return;
    }
    const em = val('em'), pw = val('pw');
    if (!em || !pw) { S.err = 'กรุณากรอกอีเมลและรหัสผ่าน'; render(); return; }
    liveLogin(em, pw); return;
  }

  if (!LIVE.on) return;                      // โหมดสาธิต ปล่อยให้ตัวจัดการเดิมทำงาน

  if (a === 'logout' && LIVE.session) { e.stopPropagation(); liveLogout(); return; }

  if (a === 'forgot') {
    e.stopPropagation();
    const em = val('fe') || val('em') || val('f_em');
    S.forgotSent = true; render();
    livePush('auth.forgot', {email: em}, 'ส่งคำขอตั้งรหัสผ่านใหม่ไปยังเซิร์ฟเวอร์แล้ว');
    return;
  }
  /* ขั้นที่ 1 ของนักศึกษา ตรวจรหัสนักศึกษากับทะเบียนจริง
     ประเภทอื่นไม่ต้องตรวจอะไร ปล่อยให้ตัวจัดการเดิมพาไปขั้นถัดไปได้เลย */
  if (a === 'regnext1' && S.reg.kind === 'student') {
    e.stopPropagation(); e.preventDefault();
    const code = val('rg_code').trim();
    const em = normEmail(val('rg_em1'));
    const prog = (document.getElementById('rg_prog1') || {}).value || '';
    if (!code) { S.err = 'กรุณากรอกรหัสนักศึกษา'; render(); return; }
    if (!em) { S.err = 'กรุณากรอกอีเมลมหาวิทยาลัย'; render(); return; }
    if (!isStudentEmail(em)) {
      S.err = `อีเมลต้องเป็นของมหาวิทยาลัย ลงท้ายด้วย @${STUDENT_EMAIL_DOMAIN} เท่านั้น`; render(); return; }
    if (!prog) { S.err = 'กรุณาเลือกสาขาวิชา'; render(); return; }
    liveBusy(1);
    toast('⏳ กำลังตรวจสอบรหัสนักศึกษากับทะเบียน…', 'wait', true);
    render();
    API.call('reg.checkStudent', {code}).then(d => {
      const f = d.found ? d.student : null;
      S.reg.found = f ? {id: 'srv', code: f.code,
        name: [f.first_name, f.last_name].filter(Boolean).join(' '),
        program: f.program_id, year: +f.year || 1, email: f.email || '', school: ''} : null;
      /* อีเมลและสาขาวิชาใช้ค่าที่ผู้สมัครกรอกไว้เสมอ ไม่ให้ค่าจากทะเบียนเขียนทับ */
      S.reg.data = {code, em, prog,
        pre: S.reg.data.pre || PREFIX_STU[0],
        fn: f ? f.first_name || '' : (S.reg.data.fn || ''),
        ln: f ? f.last_name || '' : (S.reg.data.ln || ''),
        year: f ? +f.year || 1 : (S.reg.data.year || 1),
        tel: S.reg.data.tel || '', sch: S.reg.data.sch || '',
        c1: S.reg.data.c1, c2: S.reg.data.c2};
      S.reg.notice = d.found
        ? 'พบข้อมูลในทะเบียนแล้ว ระบบเติมชื่อและชั้นปีให้อัตโนมัติ'
        : 'ไม่พบรหัสนี้ในทะเบียน ท่านสมัครต่อได้ เจ้าหน้าที่จะตรวจสอบสถานภาพภายหลัง';
      toast(d.found ? '✅ ตรวจสอบรหัสนักศึกษาสำเร็จ' : 'ℹ️ ไม่พบรหัสนี้ในทะเบียน สมัครต่อได้', d.found ? 'ok' : 'wait');
      S.err = ''; S.reg.step = 2;
    }).catch(x => { S.err = x.message; toastFailed(x.message); })
      .finally(() => { liveBusy(-1); render(); });
    return;
  }
  /* ขั้นสุดท้าย ส่งข้อมูลจริงขึ้นเซิร์ฟเวอร์
     นักศึกษาได้บัญชีทันที ส่วนครูพี่เลี้ยงและผู้บริหารเข้าคิวรออนุมัติ */
  if (a === 'regsubmit') {
    e.stopPropagation(); e.preventDefault();
    const d = S.reg.data;
    const chk = id => !!(document.getElementById(id) || {}).checked;
    d.c1 = chk('rg_c1'); d.c2 = chk('rg_c2');
    if (!d.c1 || !d.c2) { S.err = 'กรุณายอมรับเงื่อนไขให้ครบทุกข้อ'; render(); return; }
    const p1 = val('rg_p1'), p2 = val('rg_p2');
    if (p1.length < PW_MIN) { S.err = `รหัสผ่านต้องมีความยาวอย่างน้อย ${PW_MIN} อักขระ`; render(); return; }
    if (p1 !== p2) { S.err = 'รหัสผ่านทั้งสองช่องไม่ตรงกัน'; render(); return; }
    d.pw = p1;
    liveBusy(1); render();
    /* คำสั่งเดียวใช้ได้ทุกประเภท และเปิดใช้งานบัญชีให้ทันที ผู้สมัครจึงเข้าสู่ระบบได้เลย */
    API.call('reg.submit', {
      kind: S.reg.kind,
      code: d.code || '', prefix: d.pre, first_name: d.fn, last_name: d.ln,
      email: d.em, phone: d.tel, password: d.pw,
      program_id: d.prog, year: S.reg.kind === 'student' ? d.year : '',
      school: d.sch || '', affiliation: d.aff || '',
      subject_group: d.grp || '', teach_level: d.lvl || '', experience_years: d.exp || '',
      consent_pdpa: true, consent_media: true, consent_truth: true
    }).then(r => {
      S.reg.ref = (r && r.ref) || '';
      S.reg.username = (r && r.username) || '';
      if (r && r.in_registry !== undefined) S.reg.found = r.in_registry ? (S.reg.found || true) : null;
      S.err = ''; S.reg.step = 4;
    }).catch(x => { S.err = x.message; })
      .finally(() => { liveBusy(-1); render(); });
    return;
  }

  /* เก็บเจตนาไว้ก่อน เพื่อใช้ตอนส่งข้อมูลหลังตัวจัดการเดิมทำงานเสร็จ */
  if (a === 'usrsave') {
    const g = id => { const x = document.getElementById(id); return x ? x.value.trim() : ''; };
    LIVE.intent = {act: a, id: v, data: {
      name: g('uf_name'), code: g('uf_code'), email: g('uf_email'), role: g('uf_role'),
      program: g('uf_prog'), year: g('uf_year'), school: g('uf_school'), status: g('uf_status'),
      password: (document.getElementById('uf_pw') || {}).value || ''}};
  } else if (a === 'usrdel' || a === 'usrtoggle' || a === 'appok' || a === 'apprej') {
    const u = a === 'appok' || a === 'apprej' ? null : userById(v);
    LIVE.intent = {act: a, id: v, before: u ? {status: u.status} : null,
                   reg: (PENDING.find(x => x.id === v) || null)};
  } else if (a === 'evadd') {
    LIVE.intent = {act: a, data: {title: val('ev_title'), type: S.evNew.type, comps: [...S.evNew.comps],
      mode: S.evNew.mode, link: String(S.evNew.link || '').trim(),
      fileName: S.evNew.fileName, fileMime: S.evNew.fileMime, fileData: S.evNew.fileData}};
  } else if (a === 'evverify' || a === 'evreject') {
    LIVE.intent = {act: a, id: v, data: {sid: evidenceOwner()}};
  } else if (a === 'assave') {
    LIVE.intent = {act: a, data: {sid: S.asSid, comp: S.asComp, type: S.asType, scores: Object.assign({}, S.asScores)}};
  } else if (a === 'pfsave') {
    const g = id => { const x = document.getElementById(id); return x ? x.value.trim() : ''; };
    LIVE.intent = {act: a, data: {fn: g('pf_fn'), ln: g('pf_ln'), email: g('pf_em'), tel: g('pf_tel'),
      school: g('pf_sch'), group: g('pf_grp'), teachLevel: g('pf_lvl'), exp: g('pf_exp')}};
  } else if (a === 'pfpw') {
    LIVE.intent = {act: a, data: {oldPw: val('sec_old'), newPw: val('sec_p1')}};
  } else {
    LIVE.intent = null;
  }
}, true);

/*───────── 21.12 ส่งข้อมูลกลับหลังตัวจัดการเดิมทำงาน (bubble) ─────────*/
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !liveOn()) return;
  const it = LIVE.intent; LIVE.intent = null;
  if (!it || it.act !== el.dataset.act) return;
  if (S.err) return;                       // ตัวจัดการเดิมพบข้อผิดพลาด ไม่ต้องส่งขึ้นเซิร์ฟเวอร์

  const d = it.data || {};
  switch (it.act) {
    case 'usrsave': {
      const body = {first_name: String(d.name).split(' ')[0] || d.name,
        last_name: String(d.name).split(' ').slice(1).join(' '), code: d.code, email: d.email,
        role: d.role, program_id: d.program || '', year: d.year || '', school: d.school || '',
        status: d.status};
      const reload = async () => {
        try { const r = await API.call('users.list', {}); USERS = (r.users || []).map(mapUser); } catch (x) {}
      };
      if (it.id) {
        livePush('users.update', Object.assign({user_id: it.id}, body), 'บันทึกบัญชีไปยังฐานข้อมูลแล้ว',
          async () => {
            /* รหัสผ่านแก้ผ่าน users.update ไม่ได้โดยเจตนา จึงต้องเรียก users.setPassword แยก */
            if (d.password) await livePush('users.setPassword', {user_id: it.id, password: d.password},
              'ตั้งรหัสผ่านใหม่ให้บัญชีนี้แล้ว');
            await reload();
          });
      } else {
        livePush('users.create', Object.assign({password: d.password || ''}, body), '',
          async r => {
            /* รหัสผ่านชั่วคราวที่ระบบสุ่มให้ ต้องแสดงให้ผู้ดูแลเห็นด้วย
               เผื่อกรณีส่งอีเมลไม่สำเร็จ ผู้ดูแลจะได้แจ้งเจ้าของบัญชีโดยตรง */
            LIVE.info = (r && r.temp_password)
              ? `สร้างบัญชีแล้ว ชื่อผู้ใช้ ${r.username || d.email} · รหัสผ่านชั่วคราว ${r.temp_password} (กรุณาคัดลอกเก็บไว้ ระบบจะไม่แสดงอีก)`
              : `สร้างบัญชีในฐานข้อมูลแล้ว เข้าสู่ระบบด้วยชื่อผู้ใช้ ${(r && r.username) || d.code || d.email} และรหัสผ่านที่ท่านตั้งไว้`;
            await reload();
          });
      }
      break;
    }
    case 'usrtoggle': {
      const u = userById(it.id);
      livePush('users.setStatus', {user_id: it.id, status: u ? u.status : 'active'}, 'ปรับสถานะบัญชีในฐานข้อมูลแล้ว');
      break;
    }
    case 'usrdel':
      livePush('users.delete', {user_id: it.id}, 'ดำเนินการลบหรือระงับบัญชีในฐานข้อมูลแล้ว',
        async () => { try { const r = await API.call('users.list', {}); USERS = (r.users || []).map(mapUser); } catch (x) {} });
      break;
    case 'appok':
      livePush('reg.approve', {reg_id: it.id}, 'อนุมัติคำขอในฐานข้อมูลแล้ว',
        async () => { try { const r = await API.call('users.list', {}); USERS = (r.users || []).map(mapUser); } catch (x) {} });
      break;
    case 'apprej':
      livePush('reg.reject', {reg_id: it.id, reason: ''}, 'บันทึกการปฏิเสธคำขอในฐานข้อมูลแล้ว');
      break;
    case 'evadd':
      /* มีไฟล์แนบให้ส่งขึ้น Google Drive ก่อน แล้วจึงผูก URL ไว้กับรายการหลักฐาน */
      (async () => {
        let url = '', how = '';
        if (d.mode === 'link') {
          url = d.link; how = 'ลิงก์';           // ส่งงานด้วยลิงก์ ไม่ต้องอัปโหลดไฟล์
        } else if (d.fileData) {
          try {
            const up = await API.call('file.upload', {kind: 'evidence', filename: d.fileName,
              mime_type: d.fileMime, data_base64: d.fileData});
            url = (up && up.file_url) || '';
            how = 'ไฟล์แนบ';
          } catch (x) { liveErr(x); render(); return; }
        }
        await livePush('evidence.add',
          {title: d.title, evidence_type: d.type, comp_ids: d.comps, description: '', file_url: url},
          url ? `บันทึกหลักฐานพร้อม${how}ลงฐานข้อมูลแล้ว` : 'บันทึกหลักฐานลงฐานข้อมูลแล้ว',
          async () => { await liveEvidence(S.user.id, true); });
      })();
      break;
    case 'evverify':
    case 'evreject':
      livePush('evidence.verify',
        {evidence_id: it.id, status: it.act === 'evverify' ? 'verified' : 'rejected', reason: ''},
        it.act === 'evverify' ? 'บันทึกผลการตรวจสอบหลักฐานแล้ว' : 'ตีกลับหลักฐานให้นักศึกษาแก้ไขแล้ว',
        async () => { await liveEvidence(d.sid, true); });
      break;
    case 'assave': {
      if (!d.sid || !d.comp || !Object.keys(d.scores).length) break;
      const type = d.type || (S.role === 'Mentor' ? 'mentor' : 'lecturer');
      livePush('assess.submit', {student_id: d.sid, comp_id: d.comp, assess_type: type,
        scores: d.scores, round_no: liveRound(d.sid), term_id: LIVE_CFG.term},
        'บันทึกผลการประเมินลงฐานข้อมูลแล้ว',
        async () => { await liveStudent(d.sid, false); EDM_CACHE = null; });
      break;
    }
    case 'pfsave': {
      const body = {user_id: S.user.id};
      if (d.fn) body.first_name = d.fn;
      if (d.ln) body.last_name = d.ln;
      if (d.email) body.email = d.email;
      if (d.tel) body.phone = d.tel;
      if (d.school) body.school = d.school;
      if (d.group) body.subject_group = d.group;
      if (d.teachLevel) body.teach_level = d.teachLevel;
      if (d.exp) body.experience_years = d.exp;
      livePush('users.update', body, 'บันทึกข้อมูลส่วนตัวลงฐานข้อมูลแล้ว');
      break;
    }
    case 'pfpw':
      if (d.oldPw && d.newPw)
        livePush('auth.changePassword', {old_password: d.oldPw, new_password: d.newPw},
          'เปลี่ยนรหัสผ่านในฐานข้อมูลแล้ว');
      break;
  }
});

/*───────── 21.12ก. บันทึกกรอบสมรรถนะลงฐานข้อมูล ─────────
   เดิมหน้าตั้งค่ากรอบสมรรถนะแก้ได้แต่ในหน่วยความจำของเบราว์เซอร์เท่านั้น
   พอรีเฟรชหน้าหรือผู้ประเมินคนอื่นเปิดดู ค่าก็กลับไปเป็นของเดิม
   จึงดูเหมือนตั้งค่าไม่ได้จริง ทั้งที่ฝั่งเซิร์ฟเวอร์มีเส้นทางบันทึกครบอยู่แล้วแต่ไม่เคยถูกเรียก */
/* จับเวลาแยกรายชั้นปี เดิมใช้ตัวจับเวลาเดียวร่วมกัน การแก้ค่าของหลายชั้นปีติดกัน
   จะทำให้คำขอของชั้นปีก่อนหน้าถูกยกเลิกไปก่อนได้ยิง */
let LIVE_CFGTIMER = {}, LIVE_INDTIMER = {}, LIVE_COMPTIMER = {};

/** บันทึกการตั้งค่าทั้งชั้นปีลงฐานข้อมูล ส่งทุกสมรรถนะไปพร้อมกันในคำขอเดียว
    เพราะผู้ดูแลมักแก้หลายช่องติดกัน การหน่วงเวลาไว้จึงยิงคำขอครั้งเดียวหลังพิมพ์จบ
    delay = 0 ใช้กับการกระทำที่จบในครั้งเดียว เช่น คัดลอกจากชั้นปีอื่น */
function saveYearCfg(year, delay) {
  if (!liveOn()) return;
  const y = year || S.year;
  clearTimeout(LIVE_CFGTIMER[y]);
  LIVE_CFGTIMER[y] = setTimeout(() => {
    const yc = yearOf(FW, y);
    const items = FW.competencies.map(c => {
      const cf = cfgEdit(y, c.id);
      return {year: y, comp_id: c.id, is_active: !!cf.active, target_level: cf.target,
              exam_open: !!(cf.test && cf.test.open),
              exam_items: (cf.test && cf.test.n) || ITEMS_PER_COMP_DEF,
              exam_minutes: (cf.test && cf.test.min) || EXAM_MIN_DEF};
    });
    const on = items.filter(i => i.is_active).length;
    livePush('yearcfg.save',
      {items: items,
       year_meta: {year: y, label: yc.label, stage: yc.stage}},
      `บันทึกการตั้งค่า${yc.label}ลงฐานข้อมูลแล้ว · เปิดใช้ ${on} จาก ${items.length} สมรรถนะ`);
  }, delay === undefined ? 800 : delay);
}

/** บันทึกสมรรถนะหลักหนึ่งรายการ (ชื่อ รหัส หมวด PTRU) */
function saveComp(c) {
  if (!liveOn() || !c) return;
  clearTimeout(LIVE_COMPTIMER[c.id]);
  LIVE_COMPTIMER[c.id] = setTimeout(() => {

/** ตรวจสอบว่าติดต่อเซิร์ฟเวอร์ได้หรือไม่ พร้อมอธิบายสาเหตุเมื่อไม่สำเร็จ
    retry = true เมื่อผู้ใช้กดปุ่มทดสอบเอง จะล้างช่องทางที่จำไว้แล้วลองใหม่ทั้งสองแบบ */
async function liveConnect(retry) {
  if (retry) { API.transport = null; LIVE.note = ''; }
  LIVE.checking = true; LIVE.err = ''; LIVE.info = 'กำลังติดต่อเซิร์ฟเวอร์…';
  render();
  try {
    const h = await API.health();
    LIVE.on = true;
    LIVE.status = h || null;
    LIVE.version = (h && h.version) || '';
    LIVE.err = '';
    const d = (h && h.data) || {};
    LIVE.info = 'ติดต่อเซิร์ฟเวอร์ได้ ' + ((h && h.app) || '') + ' เวอร์ชัน ' + LIVE.version +
                ' · ชีต ' + ((h && h.sheets_found) !== undefined ? h.sheets_found + '/' + h.sheets_expected
                                                                 : ((h && h.sheets) || '-')) +
                ' · สมรรถนะ ' + (d.competencies !== undefined ? d.competencies : '-') +
                ' · ตัวชี้วัด ' + (d.indicators !== undefined ? d.indicators : '-');
    if (h && h.warnings && h.warnings.length) LIVE.err = h.warnings.join(' · ');
    if (h && h.next) LIVE.info += ' · ' + h.next;
  } catch (e) {
    LIVE.on = false;
    LIVE.err = 'เชื่อมต่อฐานข้อมูลไม่สำเร็จ: ' + ((e && e.message) || '');
    LIVE.info = isFileUrl()
      ? 'ระบบทำงานด้วยข้อมูลจำลองไปก่อน'
      : 'ตรวจสอบว่า WEB_APP_URL ลงท้ายด้วย /exec และ deploy โดยตั้ง Execute as: Me กับ Who has access: Anyone';
  } finally {
    LIVE.checking = false;
    render();
  }
  return LIVE.on;
}

const AI={open:false,tab:"chat",msgs:[],greeted:false,pos:null,dragging:false};

/* ตำแหน่งที่ผู้ใช้ลากไว้ จำไว้ข้ามการรีเฟรชหน้า
   ปุ่มลอยมุมล่างขวาบังปุ่ม "ถัดไป" ของหน้าทำแบบทดสอบ ผู้ใช้จึงต้องย้ายเองได้ */
function aiLoadPos(){
  try{ const v=localStorage.getItem("ptru_ai_pos"); if(v) AI.pos=JSON.parse(v); }catch(e){}
}
function aiSavePos(){
  try{ localStorage.setItem("ptru_ai_pos",JSON.stringify(AI.pos)); }catch(e){}
}
/** วางตำแหน่งจากค่าที่ลากไว้ พร้อมดึงกลับเข้าจอเสมอ
    กันกรณีย่อหน้าต่างหรือสลับอุปกรณ์แล้วตำแหน่งเดิมหลุดออกนอกจอ */
function aiApplyPos(el){
  if(!AI.pos){ el.style.left=""; el.style.top=""; el.style.right=""; el.style.bottom=""; return; }
  const w=el.offsetWidth||60, h=el.offsetHeight||60;
  const x=clamp(AI.pos.x,6,Math.max(6,window.innerWidth-w-6));
  const y=clamp(AI.pos.y,6,Math.max(6,window.innerHeight-h-6));
  el.style.left=x+"px"; el.style.top=y+"px";
  el.style.right="auto"; el.style.bottom="auto";
}
/** ลากย้ายด้วยเมาส์หรือนิ้ว ใช้ pointer event จึงรองรับทั้งสองแบบด้วยโค้ดชุดเดียว
    แยกการลากออกจากการคลิกด้วยระยะขยับขั้นต่ำ การกดปุ่มจึงยังเปิดหน้าต่างได้ตามปกติ */
function aiDraggable(el,isHandle){
  if(el.__drag) return; el.__drag=true;
  el.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse"&&e.button!==0) return;
    if(!isHandle(e.target)) return;
    const r=el.getBoundingClientRect();
    const ox=e.clientX-r.left, oy=e.clientY-r.top;
    const x0=e.clientX, y0=e.clientY;
    let moved=false;
    const move=ev=>{
      if(!moved&&Math.abs(ev.clientX-x0)+Math.abs(ev.clientY-y0)<5) return;
      if(!moved){ moved=true; AI.dragging=true; el.style.transition="none"; }
      AI.pos={x:ev.clientX-ox,y:ev.clientY-oy};
      aiApplyPos(el);
      ev.preventDefault();
    };
    const up=()=>{
      document.removeEventListener("pointermove",move);
      document.removeEventListener("pointerup",up);
      document.removeEventListener("pointercancel",up);
      el.style.transition="";
      if(moved){ aiSavePos(); setTimeout(()=>{AI.dragging=false;},0); }
    };
    document.addEventListener("pointermove",move);
    document.addEventListener("pointerup",up);
    document.addEventListener("pointercancel",up);
  });
}
window.addEventListener("resize",()=>{
  ["aiwrap","aipanel"].forEach(id=>{ const el=document.getElementById(id); if(el&&el.style.display!=="none") aiApplyPos(el); });
});

function aiAnswer(q){

  const s=t.toLowerCase();
