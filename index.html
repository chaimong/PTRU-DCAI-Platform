};

const STEM_TPL=[
  "ในสถานการณ์ที่ครูพบว่า%IND%ยังไม่เกิดผลตามที่คาดไว้ ข้อใดเป็นแนวปฏิบัติที่เหมาะสมที่สุด",
  "ข้อใดเป็นตัวอย่างของ%IND%ที่สอดคล้องกับหลักการทางการศึกษามากที่สุด",
  "หากต้องวางแผนเพื่อพัฒนา%IND%ในชั้นเรียน ควรเริ่มจากขั้นตอนใด",
  "ข้อใดสะท้อน%IND%ได้ชัดเจนที่สุดจากพฤติกรรมที่สังเกตได้",
  "เมื่อประเมิน%IND%ของนักเรียน ครูควรใช้หลักฐานประเภทใดเป็นหลัก",
  "ข้อใดไม่ใช่ลักษณะของ%IND%ตามกรอบสมรรถนะวิชาชีพครู",
];

function buildBank(){
  const rng=lcg(20260917), items=[];
  FW.competencies.forEach((c,ci)=>{
    const inds=FW.years.map(y=>indsOf(FW,y.year,c.id)).flat();
    for(let k=1;k<=ITEMS_PER_COMP;k++){
      const ind=inds.length?inds[(k-1)%inds.length]:null;
      const short=ind?String(ind.th).replace(/^(อธิบายหลักการและความสำคัญของ|สังเกตและบันทึกการปฏิบัติเกี่ยวกับ|วางแผนการปฏิบัติเกี่ยวกับ|ทดลองปฏิบัติเกี่ยวกับ|ปฏิบัติเกี่ยวกับ|ประเมินผลการปฏิบัติเกี่ยวกับ|พัฒนาปรับปรุง)/,"").replace(/(ได้|ได้อย่างเหมาะสม|ในสถานการณ์จำลองได้|ในชั้นเรียนจริงได้อย่างเหมาะสม|ภายใต้การชี้แนะได้|ของตนเองได้|จากผลการสะท้อนคิดและข้อมูลเชิงประจักษ์)$/,""):c.th;
      const nm=short||c.th;
      const keyTxt=OPT_TPL.key[(k-1)%OPT_TPL.key.length].replace(/%IND%/g,nm);
      const dis=[];
      for(let q=0;q<N_CHOICE-1;q++) dis.push(OPT_TPL.dis[(k*3+q)%OPT_TPL.dis.length]);
      const key=Math.floor(rng()*N_CHOICE);
      const choices=[]; let di=0;
      for(let j=0;j<N_CHOICE;j++) choices.push(j===key?keyTxt:dis[di++]);
      items.push({
        id:c.id+"-Q"+String(k).padStart(2,"0"), comp:c.id, no:k,
        stem:STEM_TPL[(k-1)%STEM_TPL.length].replace(/%IND%/g,nm),
        choices, key,
        tA:+(0.55+rng()*1.55).toFixed(2),      // อำนาจจำแนกจริง
        tB:+((rng()*4.2-2.1)).toFixed(2),      // ความยากจริง
        tC:+(0.12+rng()*0.14).toFixed(3),      // ขอบล่างจริง (โอกาสเดาถูก)
        tD:+(0.90+rng()*0.09).toFixed(3),      // ขอบบนจริง (เพดานความน่าจะเป็นตอบถูก)
      });
    }
  });
  return items;
}
let BANK=buildBank();
const bankOf=cid=>BANK.filter(i=>i.comp===cid);

/** จำลองการตอบของกลุ่มทดลองใช้ (pilot) ด้วยโมเดล M4PL จากค่าพารามิเตอร์จริงของข้อสอบ */
function buildPilot(){
  const rng=lcg(31415), K=FW.competencies.length;
  const theta=[], resp=[];
  for(let s=0;s<PILOT_N;s++){
    const g=nrm(rng);                       // องค์ประกอบร่วมของผู้สอบ
    const th=FW.competencies.map(()=>0.62*g+0.78*nrm(rng));   // สหสัมพันธ์ระหว่างมิติราว 0.39
    theta.push(th);
    const row=new Uint8Array(BANK.length);
    BANK.forEach((it,j)=>{
      const k=FW.competencies.findIndex(c=>c.id===it.comp);
      const cc=it.tC===undefined?GUESS_C:it.tC, dd=it.tD===undefined?1:it.tD;
      const p=cc+(dd-cc)*sig(1.7*it.tA*(th[k]-it.tB));   // 4PL: มีทั้งขอบล่างและขอบบน
      row[j]=rng()<p?1:0;
    });
    resp.push(row);
  }
  return {theta,resp};
}
function nrm(rng){ let u=0,v=0; while(u===0)u=rng(); while(v===0)v=rng();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

let PILOT=null;

/** เมทริกซ์การตอบจากการสอบจริงของนักศึกษา สร้างจาก item_results ที่ชีต ExamAnswers บันทึกไว้
    หนึ่งแถวคือผู้สอบหนึ่งคน หนึ่งคอลัมน์คือข้อสอบหนึ่งข้อตามลำดับใน BANK
    ข้อที่ผู้สอบคนนั้นไม่ได้ทำจะถูกทำเครื่องหมายไว้ใน mask เพื่อไม่ให้นับเป็นตอบผิด */
function realPilot(){
  const idx=new Map(BANK.map((it,j)=>[String(it.id),j]));
  const rows=[], masks=[];
  const seen={};
  EXAM_RESULTS.forEach(r=>{
    const items=Array.isArray(r.itemResults)?r.itemResults:[];
    if(!items.length) return;
    const key=r.sid+"|"+r.comp;
    if(seen[key]) return; seen[key]=1;          // ใช้ครั้งล่าสุดของแต่ละคนต่อสมรรถนะ
    const row=new Uint8Array(BANK.length), mask=new Uint8Array(BANK.length);
    let hit=0;
    items.forEach(x=>{
      const j=idx.get(String(x.item_id)); if(j===undefined) return;
      row[j]=x.is_correct?1:0; mask[j]=1; hit++;
    });
    if(hit){ rows.push(row); masks.push(mask); }
  });
  return {resp:rows, mask:masks, real:true, n:rows.length};
}
/** จำนวนผู้สอบจริงขั้นต่ำที่ยอมให้ใช้วิเคราะห์คุณภาพข้อสอบ
    ต่ำกว่านี้ค่าประมาณจะแกว่งจนสรุปไม่ได้ ระบบจึงถอยไปใช้ข้อมูลจำลองพร้อมระบุกำกับไว้ */
const REAL_ITEM_MIN_N=30;
let PILOT_SRC="sim";
function pilot(){
  if(PILOT) return PILOT;
  const real=realPilot();
  if(real.n>=REAL_ITEM_MIN_N){ PILOT_SRC="real"; return (PILOT=real); }
  PILOT_SRC="sim";
  return (PILOT=buildPilot());
}
/** ป้ายบอกที่มาของข้อมูลที่ใช้วิเคราะห์คุณภาพข้อสอบ แสดงบนทุกแท็บที่ใช้ข้อมูลชุดนี้ */
function itemDataNote(){
  const real=realPilot();
  if(PILOT_SRC==="real")
    return `<div class="notebox">วิเคราะห์จาก<b>ผลการสอบจริง</b> ${real.n} ชุดคำตอบ ที่บันทึกไว้ในชีต ExamAnswers</div>`;
  return `<div class="notebox">ขณะนี้มีผลการสอบจริงเพียง ${real.n} ชุด (ต้องมีอย่างน้อย ${REAL_ITEM_MIN_N} ชุด)
    ระบบจึงวิเคราะห์จาก<b>ข้อมูลจำลอง</b>ตามพารามิเตอร์ที่ตั้งไว้ของแต่ละข้อ
    ค่าที่ได้ใช้ตรวจสอบโครงสร้างของข้อสอบได้ แต่ยังไม่ใช่คุณภาพจริงของข้อสอบชุดนี้
    ผลจะเปลี่ยนเป็นข้อมูลจริงอัตโนมัติเมื่อมีผู้สอบครบตามจำนวน</div>`;
}

/** แถวคำตอบที่ใช้ได้กับชุดข้อสอบที่ระบุ
    ข้อมูลจริงคัดเฉพาะผู้ที่ทำครบทุกข้อในชุดนั้น (complete case) ค่าสถิติจึงเทียบกันได้
    ข้อมูลจำลองใช้ได้ทุกแถวอยู่แล้ว เพราะสร้างให้ตอบครบทุกข้อ */
function pilotRows(cols){
  const P=pilot();
  if(!P.mask) return P.resp;
  return P.resp.filter((r,i)=>cols.every(j=>P.mask[i][j]));
}

/* ---------- CTT: ทฤษฎีการทดสอบแบบดั้งเดิม ---------- */
function cttAnalyze(cid){
  const items=bankOf(cid);
  const cols=items.map(it=>BANK.indexOf(it));
  const P={resp:pilotRows(cols)};
  const n=P.resp.length;
  if(n<3) return {rows:[],n:0,kr20:null,mean:null,sd:null,insufficient:true};
  const total=P.resp.map(r=>cols.reduce((a,j)=>a+r[j],0));
  const mt=mean(total), st=sdev(total)||1;
  const rows=items.map((it,k)=>{
    const j=cols[k];
    const x=P.resp.map(r=>r[j]);
    const p=mean(x), q=1-p;
    const rest=P.resp.map((r,i)=>total[i]-r[j]);
    const mr=mean(rest), sr=sdev(rest)||1;
    const cov=mean(x.map((v,i)=>(v-p)*(rest[i]-mr)));
    const rpb=cov/((sdev(x)||1)*sr);         // สหสัมพันธ์พอยต์ไบซีเรียลแบบตัดข้อตนเองออก
    /* สัดส่วนการเลือกตัวลวง จำลองจากผู้ที่ตอบผิด */
    const nc=it.choices.length, dist=new Array(nc).fill(0);
    const r2=lcg(900+j);
    let rem=1-p;
    const others=[]; for(let c=0;c<nc;c++) if(c!==it.key) others.push(c);
    others.forEach((c,oi)=>{
      const left=others.length-oi;
      const share=oi===others.length-1?rem:rem*(0.6+r2()*0.8)/left;
      dist[c]=+Math.max(0,share).toFixed(3); rem-=dist[c];
    });
    dist[it.key]=+p.toFixed(3);
    return {it,p,rpb,dist,
      lvl: p<0.2?"ยากมาก":p<0.4?"ค่อนข้างยาก":p<0.8?"เหมาะสม":"ง่ายเกินไป",
      disc: rpb<0.1?"ต้องปรับปรุง":rpb<0.2?"พอใช้":rpb<0.4?"ดี":"ดีมาก"};
  });
  const k=items.length;
  const sumPQ=rows.reduce((a,r)=>a+r.p*(1-r.p),0);
  const kr20=k/(k-1)*(1-sumPQ/(st*st));
  return {rows,kr20,mean:mt,sd:st,n,k};
}

/* ---------- MIRT: สอบเทียบพารามิเตอร์รายมิติด้วยวิธี MMLE-EM ---------- */
const QN=21, QX=Array.from({length:QN},(_,i)=>-4+i*8/(QN-1));
const QW=QX.map(t=>Math.exp(-t*t/2));
/** โมเดลการตอบสนองข้อสอบพหุมิติ (MIRT) ที่ระบบใช้กับคลังข้อสอบวัดสมรรถนะ
    กรอบ PTRU กำหนดให้ข้อสอบแต่ละข้อวัดสมรรถนะเดียวตาม Q-matrix
    จึงเป็นโครงสร้าง between-item multidimensionality ที่มี 17 มิติเท่าจำนวนสมรรถนะ
    เวกเตอร์น้ำหนักองค์ประกอบ a ของแต่ละข้อมีสมาชิกไม่เป็นศูนย์เพียงตัวเดียว
    ทั้งสามโมเดลต่างกันที่ขอบล่าง (โอกาสเดาถูก) และขอบบน (เพดานความสำเร็จ) */
const MIRT_MODELS=[
  ["m2pl","M2PL","Multidimensional Two-Parameter Logistic Model",
   "ตรึงขอบล่างที่ 0 และขอบบนที่ 1 ใช้เฉพาะน้ำหนักองค์ประกอบและความยาก"],
  ["m3pl","M3PL","Multidimensional Three-Parameter Logistic Model",
   "เพิ่มขอบล่าง c คือโอกาสที่ผู้มีสมรรถนะต่ำจะเดาถูก"],
  ["m4pl","M4PL","Multidimensional Four-Parameter Logistic Model",
   "เพิ่มขอบบน d คือเพดานความสำเร็จของผู้มีสมรรถนะสูง"],
];
const MIRT_DEF="m4pl";
/** ทำให้ชื่อโมเดลเป็นมาตรฐานเดียว รองรับค่าเดิมที่เคยบันทึกไว้เป็น 2pl 3pl 4pl */
function mirtModel(m){
  const s=String(m||"").toLowerCase().replace(/^m/,"");
  return MIRT_MODELS.some(x=>x[0]==="m"+s) ? "m"+s : MIRT_DEF;
}
const mirtLabel=m=>(MIRT_MODELS.find(x=>x[0]===mirtModel(m))||MIRT_MODELS[2]);

/** สอบเทียบพารามิเตอร์รายมิติของโมเดล MIRT  model = "m2pl" | "m3pl" | "m4pl"
    เนื่องจากเป็นโครงสร้าง between-item ข้อสอบของสมรรถนะหนึ่งจึงประมาณค่าแยกจากมิติอื่นได้
    โดยไม่เสียความถูกต้อง ส่วนความสัมพันธ์ระหว่างมิติประมาณจากค่า θ ในขั้น mirtAnalyze */
function irtCalibrate(cid,iters,model){
  model=mirtModel(model);
  const freeC=(model!=="m2pl"), freeD=(model==="m4pl");
  const items=bankOf(cid), cols=items.map(it=>BANK.indexOf(it));
  const P={resp:pilotRows(cols)};          // ใช้เฉพาะผู้ที่ทำครบทุกข้อในชุดนี้
  const N=P.resp.length, J=items.length;
  let a=items.map(()=>1.0), b=items.map(()=>0.0),
      c=items.map(()=>freeC?GUESS_C:0), d=items.map(()=>freeD?0.97:1);
  const wsum=QW.reduce((x,y)=>x+y,0), prior=QW.map(w=>w/wsum);
  iters=iters||30;
  const pAt=(j,x)=>{ const ps=sig(1.7*a[j]*(x-b[j])); return clamp(c[j]+(d[j]-c[j])*ps,1e-6,1-1e-6); };
  let conv=[];
  for(let t=0;t<iters;t++){
    /* E-step: กระจายน้ำหนักผู้สอบไปยังจุดกำลังสอง */
    const nk=new Float64Array(QN), rjk=[];
    for(let j=0;j<J;j++) rjk.push(new Float64Array(QN));
    for(let i=0;i<N;i++){
      const post=new Float64Array(QN); let sum=0;
      for(let q=0;q<QN;q++){
        let L=prior[q];
        for(let j=0;j<J;j++){ const p=pAt(j,QX[q]); L*= P.resp[i][cols[j]]?p:(1-p); }
        post[q]=L; sum+=L;
      }
      if(!(sum>0)) continue;
      for(let q=0;q<QN;q++){
        const w=post[q]/sum; nk[q]+=w;
        for(let j=0;j<J;j++) if(P.resp[i][cols[j]]) rjk[j][q]+=w;
      }
    }
    const M=Math.max(1,nk.reduce((x,y)=>x+y,0));
    /* M-step: ไต่ระดับความชันแบบมีขอบเขตและมีความรู้เดิมกำกับ
       M4PL มีปัญหาการระบุพารามิเตอร์ต่ำ จึงต้องใช้ prior ตรึงขอบล่างและขอบบนไว้ */
    let maxMove=0;
    for(let j=0;j<J;j++){
      const a0=a[j],b0=b[j],c0=c[j],d0=d[j];
      for(let st=0;st<60;st++){
        let ga=0,gb=0,gc=0,gd=0;
        for(let q=0;q<QN;q++){
          if(nk[q]<1e-9) continue;
          const x=QX[q], ps=sig(1.7*a[j]*(x-b[j])), p=pAt(j,x);
          const w=rjk[j][q]/p-(nk[q]-rjk[j][q])/(1-p);
          const base=(d[j]-c[j])*ps*(1-ps);
          ga+=w*base*1.7*(x-b[j]);
          gb+=w*base*(-1.7*a[j]);
          gc+=w*(1-ps);
          gd+=w*ps;
        }
        ga=ga/M-0.06*Math.log(a[j]);        // a มีความรู้เดิมแบบลอกนอร์มัลรอบ 1
        gb=gb/M-0.02*b[j];                  // b มีความรู้เดิมรอบ 0
        gc=gc/M-6*(c[j]-GUESS_C);          // c ถูกตรึงใกล้ระดับการเดาสุ่ม
        gd=gd/M-6*(d[j]-0.97);             // d ถูกตรึงใกล้เพดาน 0.97
        a[j]=clamp(a[j]+0.8*ga*a[j],0.25,3.0);
        b[j]=clamp(b[j]+1.2*gb,-4,4);
        if(freeC) c[j]=clamp(c[j]+0.04*gc,0.02,0.40);
        if(freeD) d[j]=clamp(d[j]+0.04*gd,0.70,1.00);
      }
      maxMove=Math.max(maxMove,Math.abs(a[j]-a0),Math.abs(b[j]-b0),
                       Math.abs(c[j]-c0)*4,Math.abs(d[j]-d0)*4);
    }
    conv.push(maxMove);
    if(maxMove<1e-4) break;                 // ลู่เข้าแล้ว หยุดก่อนครบรอบ
  }
  /* ค่าความสามารถแบบ EAP สารสนเทศ และค่าความควรจะเป็นเชิงขอบ */
  const theta=[], se=[]; let logLik=0;
  for(let i=0;i<N;i++){
    let s0=0,s1=0,s2=0;
    for(let q=0;q<QN;q++){
      let L=prior[q];
      for(let j=0;j<J;j++){ const p=pAt(j,QX[q]); L*=P.resp[i][cols[j]]?p:(1-p); }
      s0+=L; s1+=L*QX[q]; s2+=L*QX[q]*QX[q];
    }
    const m=s1/s0; theta.push(m); se.push(Math.sqrt(Math.max(1e-6,s2/s0-m*m)));
    logLik+=Math.log(Math.max(1e-300,s0));
  }
  const nPar=J*(2+(freeC?1:0)+(freeD?1:0));
  const aic=-2*logLik+2*nPar, bic=-2*logLik+nPar*Math.log(N);
  const info=QX.map(x=>items.reduce((acc,it,j)=>{
    const ps=sig(1.7*a[j]*(x-b[j])), p=clamp(c[j]+(d[j]-c[j])*ps,1e-6,1-1e-6);
    const dpz=(d[j]-c[j])*ps*(1-ps);
    return acc+Math.pow(1.7*a[j],2)*dpz*dpz/(p*(1-p));},0));
  return {items,a,b,c,d,theta,se,info,conv,iters:conv.length,model,nPar,logLik,aic,bic,
    rel:1-mean(se.map(s=>s*s)),
    fit:items.map((it,j)=>({it,a:a[j],b:b[j],c:c[j],d:d[j],
      tA:it.tA,tB:it.tB,tC:it.tC,tD:it.tD}))};
}

/* ---------- MIRT: โครงสร้าง between-item ทั้ง 17 มิติ ---------- */
function mirtAnalyze(model){
  const md=mirtModel(model);
  const K=FW.competencies.length, dims=[];
  FW.competencies.forEach(c=>dims.push(irtCalibrate(c.id,12,md)));
  const N=dims[0].theta.length;
  const corr=[];
  for(let i=0;i<K;i++){
    corr.push([]);
    for(let j=0;j<K;j++){
      const x=dims[i].theta, y=dims[j].theta;
      const mx=mean(x), my=mean(y);
      const cv=mean(x.map((v,k)=>(v-mx)*(y[k]-my)));
      corr[i].push(cv/((sdev(x)||1)*(sdev(y)||1)));
    }
  }
  return {dims,corr,N,K,model:md};
}
/** ปริมาณเชิงพหุมิติของข้อสอบหนึ่งข้อ
    MDISC = ||a|| คือความยาวของเวกเตอร์น้ำหนักองค์ประกอบ บอกอำนาจจำแนกรวมทุกมิติ
    MDIFF = -d/||a|| เมื่อ d คือค่าตัดแกน ในการกำหนดพารามิเตอร์แบบ a(θ-b) จะได้ d = -a·b
    โครงสร้าง between-item ทำให้เวกเตอร์ a มีสมาชิกเดียว ค่าทั้งสองจึงลดรูปเหลือ a และ b
    คำนวณจาก Q-matrix จริงไว้ เพื่อให้ยังถูกต้องหากเปลี่ยนไปใช้โครงสร้าง within-item ในอนาคต */
function mirtItemStats(aVec,bScalar){
  const disc=Math.sqrt(aVec.reduce((s,x)=>s+x*x,0));
  return {mdisc:disc, mdiff:disc>1e-9?bScalar:0,
          dir:aVec.map(x=>disc>1e-9?x/disc:0)};
}

/* ============================================================
   โมเดลเชิงลึกสำหรับ EDM: DKT, Transformer, Neural IRT, Hybrid
   ฝึกจริงในเบราว์เซอร์ด้วยเครื่องมือหาอนุพันธ์อัตโนมัติข้างต้น
   ข้อมูลฝึกคือการตอบของกลุ่มทดลองใช้ข้อสอบ (pilot) ซึ่งเป็นข้อมูลจำลอง
   ============================================================ */
const DIM=12, SEQLEN=30;

/** สร้างลำดับการตอบ: ผู้สอบหนึ่งคนต่อหนึ่งสมรรถนะ = ลำดับ 30 ข้อ */
/* แบบจำลองลำดับการเรียนรู้ต้องการลำดับการตอบที่ยาวและครบทุกข้อ
   ผลการสอบจริงยังสั้นเกินไปและมีข้อที่ผู้สอบไม่ได้ทำ จึงใช้ชุดจำลองเฉพาะส่วนนี้
   ถ้าใช้เมทริกซ์จริงที่มีช่องว่าง ข้อที่ไม่ได้ทำจะถูกนับเป็นตอบผิดและทำให้ผลเพี้ยน */
let PILOT_SIM=null;
function seqData(limitTrain,limitTest){
  const P=PILOT_SIM||(PILOT_SIM=buildPilot()), all=[];
  const idxOf=new Map(BANK.map((it,j)=>[it.id,j]));
  P.resp.forEach((row,e)=>{
    FW.competencies.forEach((c,ci)=>{
      const its=bankOf(c.id).map(it=>idxOf.get(it.id));
      all.push({e,ci,items:its,y:its.map(j=>row[j])});
    });
  });
  const rng=lcg(555);
  for(let i=all.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=all[i]; all[i]=all[j]; all[j]=t; }
  const cutE=Math.floor(P.resp.length*0.8);
  const tr=all.filter(s=>s.e<cutE).slice(0,limitTrain||900);
  const te=all.filter(s=>s.e>=cutE).slice(0,limitTest||250);
  return {tr,te,V:BANK.length,N:P.resp.length};
}
function aucOf(y,p){
  const o=p.map((v,i)=>({v,t:y[i]})).sort((a,b)=>a.v-b.v);
  let sr=0,np=0,nn=0;
  o.forEach((x,i)=>{ if(x.t===1){sr+=i+1;np++;} else nn++; });
  return (np&&nn)?(sr-np*(np+1)/2)/(np*nn):0.5;
}
function evalScores(y,p){
  const acc=mean(y.map((t,i)=>((p[i]>=.5?1:0)===t)?1:0));
  const ll=-mean(y.map((t,i)=>t*Math.log(Math.max(p[i],1e-9))+(1-t)*Math.log(Math.max(1-p[i],1e-9))));
  return {acc,auc:aucOf(y,p),logloss:ll,n:y.length};
}

/* ---------- 1) Deep Knowledge Tracing: โครงข่ายเรียกซ้ำ ---------- */
function trainDKT(D,epochs,onEpoch){
  const rng=lcg(4242), V=D.V, d=DIM, B=48;
  const InE=tparam(2*V,d,0.12,rng), ItE=tparam(V,d,0.12,rng), Bi=tparam(V,1,0.02,rng);
  const Wx=tparam(d,d,0.2,rng), Wh=tparam(d,d,0.2,rng), bh=tparam(1,d,0.02,rng);
  const ps=[InE,ItE,Bi,Wx,Wh,bh];
  let step=0, hist=[];
  const runBatch=(batch,train)=>{
    tstart();
    const n=batch.length;
    let h=tnode(n,d);
    const yAll=[], pAll=[]; let loss=null;
    for(let t=0;t<SEQLEN-1;t++){
      const xIdx=batch.map(s=>s.items[t]*2+s.y[t]);
      const x=lookup(InE,xIdx);
      h=tanhT(addBias(addT(mm(x,Wx),mm(h,Wh)),bh));
      const nIdx=batch.map(s=>s.items[t+1]);
      const logit=addT(rowSum(mulT(h,lookup(ItE,nIdx))),lookup(Bi,nIdx));
      const tgt=batch.map(s=>s.y[t+1]);
      const l=bceLoss(logit,tgt,null);
      tgt.forEach((v,i)=>{ yAll.push(v); pAll.push(l.probs[i]); });
      loss=loss?addT(loss,l):l;
    }
    if(train){ zeroGrad(ps); backward(scaleT(loss,1/(SEQLEN-1))); adamStep(ps,0.02,++step); }
    return {y:yAll,p:pAll,byPos:batch.length?null:null};
  };
  for(let ep=0;ep<epochs;ep++){
    for(let i=0;i<D.tr.length;i+=B) runBatch(D.tr.slice(i,i+B),true);
    if(onEpoch){ const r=runBatch(D.te.slice(0,150),false); onEpoch(ep,evalScores(r.y,r.p)); }
  }
  const r=runBatch(D.te,false);
  /* เส้นโค้งการเรียนรู้: ค่าเฉลี่ยความน่าจะเป็นที่ทำนายและผลจริง แยกตามลำดับข้อ */
  const nT=D.te.length, curve=[];
  for(let t=0;t<SEQLEN-1;t++){
    const idx=[]; for(let i=0;i<nT;i++) idx.push(t*nT+i);
    curve.push({t:t+2,pred:mean(idx.map(k=>r.p[k])),act:mean(idx.map(k=>r.y[k]))});
  }
  return {name:"dkt",metrics:evalScores(r.y,r.p),curve,params:ps.reduce((a,p)=>a+p.d.length,0)};
}

/* ---------- 2) Transformer: self-attention หนึ่งชั้น หนึ่งหัว ---------- */
function makeTransformer(D,extraDim,rng){
  const V=D.V, d=DIM, dh=d+extraDim;
  const InE=tparam(2*V,d,0.12,rng), Pos=tparam(SEQLEN,d,0.05,rng);
  const Wq=tparam(dh,dh,0.2,rng), Wk=tparam(dh,dh,0.2,rng), Wv=tparam(dh,dh,0.2,rng);
  const W1=tparam(dh,dh*2,0.2,rng), b1=tparam(1,dh*2,0.02,rng);
  const W2=tparam(dh*2,d,0.2,rng), b2=tparam(1,d,0.02,rng);
  const ItE=tparam(V,d,0.12,rng), Bi=tparam(V,1,0.02,rng);
  const Wt=extraDim?tparam(d,extraDim,0.2,rng):null;
  return {InE,Pos,Wq,Wk,Wv,W1,b1,W2,b2,ItE,Bi,Wt,dh,
    ps:[InE,Pos,Wq,Wk,Wv,W1,b1,W2,b2,ItE,Bi].concat(Wt?[Wt]:[])};
}
function trFwd(M,s,useTheta){
  const L=SEQLEN-1;
  const xIdx=s.items.slice(0,L).map((it,t)=>it*2+s.y[t]);
  let x=addT(lookup(M.InE,xIdx),sliceRows(M.Pos,0,L));
  if(useTheta){
    /* เวกเตอร์ความสามารถสรุปจากช่วงต้นของลำดับผู้สอบเอง ทำให้ใช้กับผู้สอบใหม่ได้ */
    const warm=Math.min(10,L);
    const th=tanhT(mm(colMean(sliceRows(x,0,warm)),M.Wt));
    x=concatCols(x,repeatRow(th,L));
  }
  const Q=mm(x,M.Wq), K=mm(x,M.Wk), Vv=mm(x,M.Wv);
  const A=causalSoftmax(scaleT(mmT(Q,K),1/Math.sqrt(M.dh)));
  const O=addT(mm(A,Vv),x);
  const H=addBias(mm(reluT(addBias(mm(O,M.W1),M.b1)),M.W2),M.b2);
  const nIdx=s.items.slice(1);
  const logit=addT(rowSum(mulT(H,lookup(M.ItE,nIdx))),lookup(M.Bi,nIdx));
  return {logit,tgt:s.y.slice(1)};
}
function trainTransformer(D,epochs,useTheta,onEpoch){
  const rng=lcg(9090);
  const M=makeTransformer(D,useTheta?DIM:0,rng);
  const ps=M.ps;
  let step=0;
  const one=(s,train)=>{
    tstart();
    const f=trFwd(M,s,useTheta);
    const l=bceLoss(f.logit,f.tgt,null);
    if(train){ zeroGrad(ps); backward(l); adamStep(ps,0.01,++step); }
    return {y:f.tgt,p:Array.from(l.probs)};
  };
  for(let ep=0;ep<epochs;ep++){
    D.tr.forEach(s=>one(s,true));
    if(onEpoch){
      const y=[],p=[]; D.te.slice(0,80).forEach(s=>{const r=one(s,false);y.push(...r.y);p.push(...r.p);});
      onEpoch(ep,evalScores(y,p));
    }
  }
  const y=[],p=[], accP=new Array(SEQLEN-1).fill(0), accY=new Array(SEQLEN-1).fill(0);
  D.te.forEach(s=>{ const r=one(s,false); y.push(...r.y); p.push(...r.p);
    r.p.forEach((v,t)=>{ accP[t]+=v; accY[t]+=r.y[t]; }); });
  const curve=accP.map((v,t)=>({t:t+2,pred:v/D.te.length,act:accY[t]/D.te.length}));
  return {name:useTheta?"hybrid":"trans",metrics:evalScores(y,p),curve,params:ps.reduce((a,q)=>a+q.d.length,0)};
}

/* ---------- 3) Neural IRT: ฝังความสามารถผู้สอบและข้อสอบผ่านโครงข่าย ---------- */
function trainNeuralIRT(D,epochs,onEpoch){
  const rng=lcg(1717), d=DIM, H=16, B=512;
  const ThE=tparam(D.N,d,0.15,rng), ItE=tparam(D.V,d,0.15,rng);
  const W1=tparam(2*d,H,0.25,rng), b1=tparam(1,H,0.02,rng);
  const W2=tparam(H,1,0.25,rng), b2=tparam(1,1,0.02,rng);
  const ps=[ThE,ItE,W1,b1,W2,b2];
  /* โมเดลนี้ใช้เวกเตอร์ความสามารถรายบุคคล จึงประเมินด้วยการกันคำตอบบางส่วนของผู้สอบที่โมเดลรู้จัก
     (การกันผู้สอบทั้งคนจะทำให้เวกเตอร์ความสามารถของผู้สอบใหม่ไม่เคยถูกฝึก) */
  const flat=t=>{ const o=[]; t.forEach(s=>s.items.forEach((it,k)=>o.push({e:s.e,it,y:s.y[k]}))); return o; };
  const allRows=flat(D.tr.concat(D.te));
  const rs=lcg(6161), tr=[], te=[];
  allRows.forEach(r=>(rs()<0.8?tr:te).push(r));
  let step=0;
  const run=(rows,train)=>{
    const y=[],p=[];
    for(let i=0;i<rows.length;i+=B){
      const bt=rows.slice(i,i+B);
      tstart();
      const th=lookup(ThE,bt.map(r=>r.e)), im=lookup(ItE,bt.map(r=>r.it));
      const h=tanhT(addBias(mm(concatCols(th,im),W1),b1));
      const logit=addBias(mm(h,W2),b2);
      const tgt=bt.map(r=>r.y);
      const l=bceLoss(logit,tgt,null);
      if(train){ zeroGrad(ps); backward(l); adamStep(ps,0.02,++step); }
      tgt.forEach((v,k)=>{ y.push(v); p.push(l.probs[k]); });
    }
    return {y,p};
  };
  for(let ep=0;ep<epochs;ep++){
    run(tr,true);
    if(onEpoch){ const r=run(te.slice(0,4000),false); onEpoch(ep,evalScores(r.y,r.p)); }
  }
  const r=run(te,false);
  return {name:"nirt",metrics:evalScores(r.y,r.p),curve:null,params:ps.reduce((a,q)=>a+q.d.length,0)};
}

function twoLineSVG(xs,a,b,la,lb,ymax){
  const W=470,H=210,padL=34,padB=28,padT=14;
  const X=i=>padL+(xs.length<2?.5:i/(xs.length-1))*(W-padL-16);
  const Y=v=>H-padB-clamp(v/ymax,0,1)*(H-padB-padT);
  let grid="";
  [0,.25,.5,.75,1].forEach(p=>{const v=p*ymax;
    grid+=`<line x1="${padL}" y1="${Y(v).toFixed(1)}" x2="${W-16}" y2="${Y(v).toFixed(1)}" stroke="var(--line-soft)"/>
      <text x="${padL-5}" y="${(Y(v)+3).toFixed(1)}" font-size="10" fill="var(--muted)" text-anchor="end">${(p*100).toFixed(0)}%</text>`;});
  const path=arr=>arr.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
  const xt=xs.map((l,i)=>(i%5===0)?`<text x="${X(i).toFixed(1)}" y="${H-10}" font-size="10" fill="var(--muted)" text-anchor="middle">${l}</text>`:"").join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="เส้นโค้งการเรียนรู้">
    ${grid}<path d="${path(b)}" fill="none" stroke="var(--l2)" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="${path(a)}" fill="none" stroke="var(--l5)" stroke-width="2.5"/>${xt}</svg>
    <div class="legend"><span><i style="background:var(--l5)"></i>${esc(la)}</span><span><i style="background:var(--l2)"></i>${esc(lb)}</span></div>`;
}
function iccSVG(a,b){
  const W=460,H=200,padL=34,padB=26,padT=12;
  const X=t=>padL+((t+4)/8)*(W-padL-14);
  const Y=p=>H-padB-p*(H-padB-padT);
  let d="";
  for(let k=0;k<=80;k++){ const t=-4+8*k/80; const p=sig(1.7*a*(t-b)); d+=(k?"L":"M")+X(t).toFixed(1)+","+Y(p).toFixed(1)+" "; }
  let ax="";
  [-3,-2,-1,0,1,2,3].forEach(v=>ax+=`<text x="${X(v).toFixed(1)}" y="${H-8}" font-size="10" fill="var(--muted)" text-anchor="middle">${v}</text>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="เส้นโค้งลักษณะข้อสอบ">
    <line x1="${padL}" y1="${Y(.5).toFixed(1)}" x2="${W-14}" y2="${Y(.5).toFixed(1)}" stroke="var(--line-soft)"/>
    <line x1="${X(b).toFixed(1)}" y1="${padT}" x2="${X(b).toFixed(1)}" y2="${H-padB}" stroke="var(--accent)" stroke-dasharray="4 3"/>
    <path d="${d}" fill="none" stroke="var(--ai-blue)" stroke-width="3"/>${ax}
    <text x="${(W/2)}" y="${H-1}" font-size="10" fill="var(--muted)" text-anchor="middle">ค่าความสามารถ θ</text></svg>`;
}
function infoSVG(info){
  const W=460,H=180,padL=34,padB=26,padT=12, mx=Math.max(...info)||1;
  const X=i=>padL+(i/(info.length-1))*(W-padL-14);
  const Y=v=>H-padB-(v/mx)*(H-padB-padT);
  const d=info.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");

  [-3,-2,-1,0,1,2,3].forEach(v=>{const i=(v+4)/8*(info.length-1);
    ax+=`<text x="${X(i).toFixed(1)}" y="${H-8}" font-size="10" fill="var(--muted)" text-anchor="middle">${v}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="เส้นโค้งสารสนเทศของแบบทดสอบ">
    <path d="${d}" fill="none" stroke="var(--l4)" stroke-width="2.5"/>${ax}
    <text x="${(W/2)}" y="${H-1}" font-size="10" fill="var(--muted)" text-anchor="middle">ค่าความสามารถ θ · ค่าสารสนเทศสูงสุด ${mx.toFixed(1)}</text></svg>`;
}

      "MDISC = ‖a‖ อำนาจจำแนกพหุมิติ · MDIFF = −d∕‖a‖ ความยากพหุมิติ · คอลัมน์สีจางคือค่าที่ใช้จำลองการตอบ ไว้ตรวจความถูกต้องของการสอบเทียบ",

        <th class="num">a จริง</th><th class="num">b จริง</th>

       <div class="notebox" style="margin-top:.8rem">การกู้คืนค่าที่ใช้จำลอง: a = ${ra.toFixed(3)} · b = ${rb.toFixed(3)}

/** อ่านไฟล์รูป ครอบกลางภาพ แล้วย่อเป็น 256 พิกเซล เพื่อไม่ให้กินหน่วยความจำมาก */
function readAvatar(file,cb){
  if(!file){ cb(null,"ไม่พบไฟล์"); return; }
  if(!/^image\//.test(file.type)){ cb(null,"รองรับเฉพาะไฟล์รูปภาพ เช่น JPG PNG หรือ WebP"); return; }
  if(file.size>5*1024*1024){ cb(null,"ไฟล์ใหญ่เกิน 5 MB กรุณาย่อขนาดก่อนอัปโหลด"); return; }
  const fr=new FileReader();
  fr.onerror=()=>cb(null,"อ่านไฟล์ไม่สำเร็จ");
  fr.onload=()=>{
    const img=new Image();
    img.onerror=()=>cb(null,"ไฟล์รูปเสียหายหรือไม่รองรับ");
    img.onload=()=>{
      try{
        const S2=256, cv=document.createElement("canvas");
        cv.width=S2; cv.height=S2;
        const g=cv.getContext("2d");
        const side=Math.min(img.width,img.height);
        g.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S2,S2);
        cb(cv.toDataURL("image/jpeg",0.85),null);
      }catch(e){ cb(null,"ประมวลผลรูปไม่สำเร็จ"); }
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
/** แสดงความน่าจะเป็นตอบถูกที่ระดับความสามารถต่าง ๆ เพื่อให้เห็นผลของพารามิเตอร์ทันที */
function prmPreview(it){
  const c=it.tC===undefined?GUESS_C:it.tC, d=it.tD===undefined?1:it.tD;
  const at=x=>(c+(d-c)*sig(1.7*it.tA*(x-it.tB)));
  const bad=(c>=d);
  return `<span class="${bad?"tag tag-risk":"sub"}">${bad?"ค่า c ต้องน้อยกว่า d":
    `P(θ=−2)=${(at(-2)*100).toFixed(0)}% · P(θ=0)=${(at(0)*100).toFixed(0)}% · P(θ=+2)=${(at(2)*100).toFixed(0)}%`}</span>`;
}

let EXAM_RESULTS=[];
function examItemsFor(sid,cid,nItems){
  /* ใช้ชุดข้อสอบที่ Server เปิดให้สอบเป็นแหล่งจริงของ attempt นี้
     และไม่สุ่มใหม่ทุกครั้งที่ render เพราะจะทำให้ item_id เปลี่ยนระหว่างข้อสอบ */
  if (S.examItems && S.examItems.length && S.examComp===cid) return S.examItems.slice();
  const all=bankOf(cid);

}

      id:String(it.item_id), comp:cid, no:Number(it.seq||idx+1), stem:String(it.stem||''),

    S.examItems=rows; S.examAttemptId=r.attempt_id||null; S.examQ=0; S.examBusy=false; S.err=""; LIVE.info=`เชื่อมต่อฐานข้อมูลแล้ว · พบข้อสอบ ${rows.length} ข้อ`; render();

}

async function examSubmit(){
  const me=myUser(),y=me.year,cid=S.examComp,cfg=cfgOf(FW,y,cid).test||{n:30},items=examItemsFor(me.id,cid,cfg.n);
  if(!items.length)return;
  const unanswered=items.filter(it=>S.examAns[it.id]===undefined); if(unanswered.length){S.examQ=items.findIndex(it=>S.examAns[it.id]===undefined);S.err=`กรุณาตอบให้ครบทุกข้อ ยังเหลือ ${unanswered.length} ข้อ`;render();return;}
  /* คะแนนที่แสดงระหว่างรอผลเป็นเพียง preview; คะแนนจริงให้ Server ตรวจจาก ItemBank */
  const localItems=items.map(it=>{const b=bankOf(cid).find(x=>String(x.id)===String(it.id));return b||it;});
  const R=iqIRT(cid);let correct=0,used=[];localItems.forEach(it=>{const j=R.items.findIndex(x=>x.id===it.id),ok=S.examAns[it.id]===it.key;if(ok)correct++;if(j>=0)used.push({a:R.a[j],b:R.b[j],y:ok?1:0});});
  let s0=0,s1=0,s2=0;for(let q=0;q<QN;q++){let L=Math.exp(-QX[q]*QX[q]/2);used.forEach(u=>{const pp=sig(1.7*u.a*(QX[q]-u.b));L*=u.y?pp:(1-pp);});s0+=L;s1+=L*QX[q];s2+=L*QX[q]*QX[q];}
  const th=s0?s1/s0:0,se=Math.sqrt(Math.max(1e-6,(s0?s2/s0:0)-th*th));const cut=[-1.5,-0.5,0.5,1.5];let lvl=1;cut.forEach(c=>{if(th>=c)lvl++;});lvl=clamp(lvl,1,FW.levels.length);
  const result={sid:me.id,comp:cid,year:y,correct,n:items.length,theta:th,se,level:lvl,ans:Object.assign({},S.examAns),at:new Date().toISOString(),dbSaved:false};
  S.examBusy=true;S.err="";render();
  try{if(!liveOn())throw new Error("ยังไม่ได้เชื่อมต่อฐานข้อมูล จึงยังบันทึกผลการสอบไม่ได้");
    const payload={attempt_id:S.examAttemptId||'',student_id:me.id,comp_id:cid,year:y,term_id:LIVE_CFG.term,responses:items.map(it=>({item_id:String(it.id),answer:S.examAns[it.id]})),exam_items:items.map((it,idx)=>({item_id:String(it.id),item_no:it.no,answer:S.examAns[it.id],order:idx+1}))}; const saved=await API.call('exam.submit',payload);
    result.dbSaved=true;
    result.attempt_id=saved.attempt_id||S.examAttemptId;
    result.correct=Number(saved.n_correct!=null?saved.n_correct:correct);
    result.n=Number(saved.n_items!=null?saved.n_items:items.length);
    result.theta=Number(saved.theta!=null?saved.theta:th);
    result.se=Number(saved.se!=null?saved.se:se);
    result.level=Number(saved.level!=null?saved.level:lvl);
    EXAM_RESULTS=EXAM_RESULTS.filter(r=>!(r.sid===me.id&&r.comp===cid)).concat([result]);
    S.examAttemptId=saved.attempt_id||S.examAttemptId; S.examDone=true; S.examBusy=false; S.examDbSaved=true;
    LIVE.info="ส่งคำตอบ ตรวจข้อสอบ และบันทึกผลลงฐานข้อมูลเรียบร้อยแล้ว";
    try{ await liveStudent(me.id,true); }catch(x){}
    try{ await liveExamResults(me.id); }catch(x){}
    render();
  }catch(e){S.examBusy=false;S.err=(e&&e.message)||"บันทึกผลการสอบลงฐานข้อมูลไม่สำเร็จ";LIVE.err=S.err;EXAM_RESULTS=EXAM_RESULTS.filter(r=>!(r.sid===me.id&&r.comp===cid)).concat([result]);S.examDone=false;}
}

/** ชุดข้อมูล: ใช้ข้อมูลถึงกลางภาคทำนายผลปลายภาค เพื่อเลี่ยงการรั่วไหลของตัวแปรเป้าหมาย */
/** ความครบถ้วนของแฟ้มสะสมงานจากข้อมูลจริง = สัดส่วนหลักฐานที่ผ่านการตรวจสอบแล้ว
    คืนค่า null เมื่อยังไม่มีหลักฐานของผู้เรียนรายนั้นในระบบ เพื่อให้แยกออกจากค่าศูนย์จริง */
function evidenceRate(sid){
  const list=EVIDENCE.filter(e=>e.student===sid);
  if(!list.length) return null;
  return list.filter(e=>e.status==="verified").length/list.length;
}
/** ชุดข้อมูลสำหรับแบบจำลองทำนายความเสี่ยง สร้างจากผลการประเมินจริงทุกรอบที่บันทึกไว้
    ใช้รอบแรก รอบรองสุดท้าย และรอบสุดท้ายเป็นตัวแปร จึงรองรับผู้เรียนที่มีจำนวนรอบไม่เท่ากัน
    เดิมบังคับต้องมีครบ 3 รอบพอดี ผู้เรียนที่มี 2 หรือ 4 รอบจะถูกตัดออกจากการวิเคราะห์ทั้งหมด */
function edmDataset(){
  const rows=[];
  filteredStudents().forEach(s=>{
    const y=s.year, comps=activeComps(FW,y), h=HIST[s.id];
    if(!h||h.length<2||!comps.length) return;
    const at=r=>comps.map(c=>scoreFromResp(r.resp,c,y)).filter(v=>v!==null);
    const last=h[h.length-1], prev=h[h.length-2], first=h[0];
    const a1=at(first), a2=at(prev), a3=at(last);
    if(!a1.length||!a2.length||!a3.length) return;
    const tg=mean(comps.map(c=>cfgOf(FW,y,c.id).target));
    const below2=comps.filter(c=>{const v=scoreFromResp(prev.resp,c,y);
      return v!==null&&v<cfgOf(FW,y,c.id).target;}).length/comps.length;
    /* ตัวแปรพฤติกรรมใช้ข้อมูลจริงเมื่อมี มิฉะนั้นใช้ค่ากลาง 0.5 และระบุกำกับไว้บนหน้าจอ */
    const ev=evidenceRate(s.id);
    rows.push({id:s.id,name:s.name,code:s.code,program:s.program,year:y,photo:s.photo,
      rounds:h.length, evReal:ev!==null,
      x:[mean(a1),mean(a2),mean(a2)-mean(a1),Math.min(...a2),below2,
         ev!==null?ev:featOr(s.evidence),featOr(s.ontime)],
      y: mean(a3)<tg?1:0, m1:mean(a1), m2:mean(a2), m3:mean(a3), tg, below2});
  });
  return rows;
}

/* ---------- เครื่องมือทางสถิติ ---------- */
function zstats(X){const d=X[0].length,mu=[],sg=[];
  for(let j=0;j<d;j++){const c=X.map(r=>r[j]);mu.push(mean(c));sg.push(sdev(c)||1);}return {mu,sg};}
const zrow=(r,st)=>r.map((v,j)=>(v-st.mu[j])/st.sg[j]);

function fitLogReg(X,y){
  const d=X[0].length; let w=new Array(d).fill(0), b=0;
  const lr=0.5, l2=0.03, iter=600;
  for(let t=0;t<iter;t++){
    const gw=new Array(d).fill(0); let gb=0;
    for(let i=0;i<X.length;i++){
      const z=X[i].reduce((a,v,j)=>a+v*w[j],0)+b, p=sig(z), e=p-y[i];
      for(let j=0;j<d;j++) gw[j]+=e*X[i][j];
      gb+=e;
    }
    for(let j=0;j<d;j++) w[j]-=lr*(gw[j]/X.length+l2*w[j]);
    b-=lr*gb/X.length;
  }
  return {w,b,predict:x=>sig(x.reduce((a,v,j)=>a+v*w[j],0)+b)};
}
const gini=y=>{if(!y.length)return 0;const p=mean(y);return 2*p*(1-p);};
function buildTree(X,y,depth,maxDepth,minLeaf,feats){
  const nPos=y.reduce((a,b)=>a+b,0);
  const leaf={leaf:true,p:(nPos+0.5)/(y.length+1),n:y.length,pos:nPos};
  if(depth>=maxDepth||y.length<2*minLeaf||nPos===0||nPos===y.length) return leaf;
  let best=null;
  (feats||X[0].map((_,j)=>j)).forEach(j=>{
    const vals=Array.from(new Set(X.map(r=>r[j]))).sort((a,b)=>a-b);
    for(let k=0;k<vals.length-1;k++){
      const thr=(vals[k]+vals[k+1])/2, li=[], ri=[];
      X.forEach((r,i)=>(r[j]<=thr?li:ri).push(i));
      if(li.length<minLeaf||ri.length<minLeaf) continue;
      const g=(li.length*gini(li.map(i=>y[i]))+ri.length*gini(ri.map(i=>y[i])))/y.length;
      if(!best||g<best.g) best={g,j,thr,li,ri};
    }
  });
  if(!best) return leaf;
  return {leaf:false,j:best.j,thr:best.thr,n:y.length,
    L:buildTree(best.li.map(i=>X[i]),best.li.map(i=>y[i]),depth+1,maxDepth,minLeaf,feats),
    R:buildTree(best.ri.map(i=>X[i]),best.ri.map(i=>y[i]),depth+1,maxDepth,minLeaf,feats)};
}
function treePred(t,x){while(!t.leaf) t=(x[t.j]<=t.thr)?t.L:t.R; return t.p;}
function fitTree(X,y){const t=buildTree(X,y,0,3,3,null); return {tree:t,predict:x=>treePred(t,x)};}
function fitForest(X,y){
  const rng=lcg(20260904), d=X[0].length, m=Math.max(2,Math.round(Math.sqrt(d))), trees=[];
  for(let k=0;k<40;k++){
    const bi=[]; for(let i=0;i<X.length;i++) bi.push(Math.floor(rng()*X.length));
    const fs=[]; while(fs.length<m){const j=Math.floor(rng()*d); if(fs.indexOf(j)<0) fs.push(j);}
    trees.push(buildTree(bi.map(i=>X[i]),bi.map(i=>y[i]),0,4,2,fs));
  }
  return {trees,predict:x=>mean(trees.map(t=>treePred(t,x)))};
}

/* ---------- Bayesian Knowledge Tracing ---------- */
function bktSeqs(){
  const out=[];
  students().forEach(s=>{
    const y=s.year, comps=activeComps(FW,y), h=HIST[s.id]; if(!h) return;
    comps.forEach(c=>{
      const tg=cfgOf(FW,y,c.id).target, seq=[];
      h.forEach(r=>{const v=scoreFromResp(r.resp,c,y); if(v!==null) seq.push(v>=tg?1:0);});
      if(seq.length) out.push({sid:s.id,seq});
    });
  });
  return out;
}
function bktRun(seq,P){
  let L=P.L0, ll=0;
  seq.forEach(o=>{
    const pc=clamp(L*(1-P.S)+(1-L)*P.G,1e-6,1-1e-6);
    ll+=Math.log(o?pc:1-pc);
    const post=o?(L*(1-P.S))/pc:(L*P.S)/(1-pc);
    L=post+(1-post)*P.T;
  });
  return {ll,L};
}
function fitBKT(seqs){
  let best=null;
  const L0s=[.1,.2,.3,.4,.5,.6,.7], Ts=[.05,.1,.15,.2,.3], Gs=[.05,.1,.15,.2,.25,.3], Ss=[.05,.1,.15,.2,.25,.3];
  for(const L0 of L0s) for(const T of Ts) for(const G of Gs) for(const Sl of Ss){
    if(G+Sl>=1) continue;
    const P={L0,T,G,S:Sl}; let ll=0;
    for(const s of seqs) ll+=bktRun(s.seq,P).ll;
    if(!best||ll>best.ll) best={ll,P};
  }
  return best;
}

/* ---------- ตัวชี้วัดประสิทธิภาพ ---------- */
function edmMetrics(yTrue,prob,thr){
  thr=thr===undefined?0.5:thr;
  let tp=0,fp=0,fn=0,tn=0;
  yTrue.forEach((t,i)=>{const p=prob[i]>=thr?1:0;
    if(t===1&&p===1)tp++;else if(t===0&&p===1)fp++;else if(t===1&&p===0)fn++;else tn++;});
  const nn=yTrue.length;
  const prec=(tp+fp)?tp/(tp+fp):0, rec=(tp+fn)?tp/(tp+fn):0;
  const sorted=prob.map((p,i)=>({p,t:yTrue[i]})).sort((a,b)=>a.p-b.p);
  let sumR=0,nPos=0,nNeg=0;
  sorted.forEach((o,i)=>{if(o.t===1){sumR+=i+1;nPos++;}else nNeg++;});
  return {tp,fp,fn,tn,n:nn,acc:(tp+tn)/nn,prec,rec,
    f1:(prec+rec)?2*prec*rec/(prec+rec):0,
    auc:(nPos&&nNeg)?(sumR-nPos*(nPos+1)/2)/(nPos*nNeg):0.5};
}
/** ตรวจสอบแบบ leave-one-out เพื่อไม่ให้รายงานความแม่นยำบนข้อมูลที่ใช้ฝึก */
function loocv(rows,fit){
  const X=rows.map(r=>r.x), Y=rows.map(r=>r.y), out=[];
  for(let i=0;i<rows.length;i++){
    const Xt=X.filter((_,k)=>k!==i), Yt=Y.filter((_,k)=>k!==i);
    const st=zstats(Xt), m=fit(Xt.map(r=>zrow(r,st)),Yt);
    out.push(m.predict(zrow(X[i],st)));
  }
  return out;
}

/* ---------- ตัวควบคุมการคำนวณและแคช ---------- */
let EDM_CACHE=null;
function edmCompute(){
  if(EDM_CACHE) return EDM_CACHE;
  const rows=edmDataset();
  if(rows.length<6) return (EDM_CACHE={rows,error:"ข้อมูลน้อยเกินกว่าจะฝึกแบบจำลองได้"});
  const X=rows.map(r=>r.x), Y=rows.map(r=>r.y);
  const st=zstats(X), Xz=X.map(r=>zrow(r,st));
  const res={};
  res.logreg={model:fitLogReg(Xz,Y), prob:loocv(rows,fitLogReg), st};
  const dt=fitTree(Xz,Y);
  res.dtree={model:dt, prob:loocv(rows,fitTree), st};
  const rf=fitForest(Xz,Y);
  res.rforest={model:rf, prob:loocv(rows,fitForest), st};
  /* BKT: ประมาณพารามิเตอร์จากลำดับการรอบรู้ แล้วใช้ 1 ลบความน่าจะเป็นรอบรู้เป็นคะแนนความเสี่ยง */
  const seqs=bktSeqs(), bf=fitBKT(seqs), mastery={};
  seqs.forEach(s=>{(mastery[s.sid]=mastery[s.sid]||[]).push(bktRun(s.seq,bf.P).L);});
  res.bkt={params:bf.P, ll:bf.ll, nSeq:seqs.length,
    prob:rows.map(r=>1-(mastery[r.id]?mean(mastery[r.id]):0.5))};
  Object.keys(res).forEach(k=>{ res[k].metrics=edmMetrics(Y,res[k].prob); });
  return (EDM_CACHE={rows,X,Y,st,res});
}

/* ---------- การจำแนกพฤติกรรมการเรียนรู้ ---------- */
function behaviorOf(r){
  const tags=[];
  if(r.x[6]<0.6) tags.push({t:"ส่งงานล่าช้าเป็นประจำ",c:"tag-risk"});
  if(r.x[5]<0.7) tags.push({t:"หลักฐานไม่ครบถ้วน",c:"tag-risk"});
  if(r.x[2]<0.02) tags.push({t:"พัฒนาการหยุดนิ่ง",c:"tag-warn"});
  if(r.x[2]>=0.25) tags.push({t:"พัฒนาการต่อเนื่อง",c:"tag-ok"});
  if(r.x[4]>0.5) tags.push({t:"ต่ำกว่าเป้าหมายหลายด้าน",c:"tag-warn"});
  if(r.x[6]>=0.85&&r.x[5]>=0.85) tags.push({t:"มีวินัยในการส่งงาน",c:"tag-ok"});
  if(!tags.length) tags.push({t:"อยู่ในเกณฑ์ปกติ",c:"tag-n"});
  return tags;
}
function behaviorGroup(r){
  if(r.x[6]<0.55&&r.x[5]<0.65) return "กลุ่มขาดการมีส่วนร่วม";
  if(r.x[2]<0.02&&r.x[4]>0.4) return "กลุ่มพัฒนาการหยุดนิ่ง";
  if(r.x[4]>0.6) return "กลุ่มต้องเร่งพัฒนาสมรรถนะ";
  if(r.x[2]>=0.25) return "กลุ่มกำลังพัฒนาได้ดี";
  return "กลุ่มคงที่ตามเกณฑ์";
}

/* ---------- แผนภาพ ---------- */
function predCurveSVG(cache){
  const r=cache.res.logreg, rows=cache.rows, fi=1;
  const xs=rows.map(o=>o.x[fi]);
  const lo=Math.min(...xs)-0.25, hi=Math.max(...xs)+0.25;
  const W=470,H=250,padL=42,padB=34,padT=14;
  const X=v=>padL+((v-lo)/(hi-lo))*(W-padL-16);
  const Y=p=>H-padB-p*(H-padB-padT);
  const base=cache.st;
  const meanZ=cache.X[0].map((_,j)=>mean(cache.X.map(row=>row[j])));
  let d="";
  for(let k=0;k<=60;k++){
    const v=lo+(hi-lo)*k/60;
    const xr=meanZ.slice(); xr[fi]=v;
    const p=r.model.predict(zrow(xr,base));
    d+=(k?"L":"M")+X(v).toFixed(1)+","+Y(p).toFixed(1)+" ";
  }
  let grid="";
  [0,.25,.5,.75,1].forEach(p=>{grid+=`<line x1="${padL}" y1="${Y(p).toFixed(1)}" x2="${W-16}" y2="${Y(p).toFixed(1)}" stroke="var(--line-soft)"/>
    <text x="${padL-6}" y="${(Y(p)+3).toFixed(1)}" font-size="10" fill="var(--muted)" text-anchor="end">${(p*100).toFixed(0)}%</text>`;});
  let xt="";
  for(let v=Math.ceil(lo*2)/2; v<=hi; v+=0.5){
    xt+=`<text x="${X(v).toFixed(1)}" y="${H-14}" font-size="10" fill="var(--muted)" text-anchor="middle">${v.toFixed(1)}</text>`;
  }
  const dots=rows.map((o,i)=>{
    const p=r.prob[i];
    return `<circle cx="${X(o.x[fi]).toFixed(1)}" cy="${Y(p).toFixed(1)}" r="4"
      fill="${o.y===1?"var(--c2)":"var(--c1)"}" fill-opacity=".85"><title>${esc(o.name)} · ทำนาย ${(p*100).toFixed(0)}% · ผลจริง ${o.y===1?"ไม่ผ่าน":"ผ่าน"}</title></circle>`;}).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="เส้นโค้งการทำนายของ Logistic Regression">
    ${grid}<line x1="${padL}" y1="${Y(0.5).toFixed(1)}" x2="${W-16}" y2="${Y(0.5).toFixed(1)}" stroke="var(--accent)" stroke-dasharray="5 3"/>
    <text x="${W-18}" y="${(Y(0.5)-5).toFixed(1)}" font-size="10" fill="var(--accent)" text-anchor="end">เกณฑ์ตัดสิน 50%</text>
    <path d="${d}" fill="none" stroke="var(--ai-blue)" stroke-width="3"/>${dots}${xt}
    <text x="${(W/2).toFixed(0)}" y="${H-2}" font-size="10" fill="var(--muted)" text-anchor="middle">คะแนนเฉลี่ยรอบที่ 2 (กลางภาค)</text></svg>`;
}

        <tr><td style="color:var(--muted)">ข้อมูลส่งกลับ</td><td>risk (0–1), class, confidence, feature_attribution[], model_version, trained_at, cv_metrics</td></tr>
        <tr><td style="color:var(--muted)">ขนาดข้อมูลขั้นต่ำ</td><td>โดยทั่วไปต้องมีลำดับการตอบระดับหลักพันถึงหลักหมื่นรายการจึงจะฝึกได้</td></tr>
        <tr><td style="color:var(--muted)">เงื่อนไขก่อนใช้งาน</td><td>เปรียบเทียบกับ Logistic Regression เป็นเส้นฐาน และตรวจความเป็นธรรมระหว่างสาขาวิชาและชั้นปี</td></tr>
      </tbody></table>`,"",false)}</div>`;
}

function edmCompare(cache){
  const rows=EDM_MODELS.filter(m=>!m.deep).map(m=>{
    const r=cache.res[m.id], k=r.metrics;
    return `<tr><td>${m.name}<div class="sub">${m.grp}</div></td>
      <td class="num">${(k.acc*100).toFixed(1)}%</td><td class="num">${(k.prec*100).toFixed(1)}%</td>
      <td class="num">${(k.rec*100).toFixed(1)}%</td><td class="num">${(k.f1*100).toFixed(1)}%</td>
      <td class="num">${k.auc.toFixed(3)}</td>
      <td class="num"><span class="tag ${k.auc>=.85?"tag-ok":k.auc>=.7?"tag-warn":"tag-risk"}">${k.auc>=.85?"ดี":k.auc>=.7?"พอใช้":"ต่ำ"}</span></td></tr>`;
  }).join("");
  const ready=EDM_MODELS.filter(m=>m.ready&&!m.deep);
  const best=ready.map(m=>({m,k:cache.res[m.id].metrics})).sort((a,b)=>b.k.auc-a.k.auc)[0];
  const bars=ready.map(m=>({name:m.name,v:cache.res[m.id].metrics.auc,
    color:m.id===best.m.id?"var(--c1)":"var(--c6)"}));
  return `<div class="stack">
    ${card("เปรียบเทียบประสิทธิภาพทุกโมเดล",`ตรวจสอบไขว้แบบ leave-one-out บนผู้เรียน ${cache.rows.length} คน`,
      `<div class="scroll-x"><table class="tight" style="min-width:700px"><thead><tr><th>โมเดล</th>
        <th class="num">Accuracy</th><th class="num">Precision</th><th class="num">Recall</th>
        <th class="num">F1</th><th class="num">AUC</th><th class="num">ระดับ</th></tr></thead><tbody>${rows}</tbody></table></div>`,"",false)}
    ${card("เปรียบเทียบค่า AUC","ค่ายิ่งสูงยิ่งแยกกลุ่มเสี่ยงกับกลุ่มไม่เสี่ยงได้ดี ค่า 0.5 เท่ากับการเดาสุ่ม",
      hbars(bars,1)+`<div class="legend"><span><i style="background:var(--c1)"></i>โมเดลที่ทำได้ดีที่สุดในชุดข้อมูลนี้</span></div>`)}
    ${card("โมเดลเชิงลึก: ทำนายการตอบรายข้อ","คนละเป้าหมายกับตารางด้านบน จึงแสดงแยกและห้ามนำค่ามาเทียบข้ามกลุ่มโดยตรง",
      `<table class="tight"><thead><tr><th>โมเดล</th><th class="num">AUC</th><th class="num">Accuracy</th>
        <th class="num">Log Loss</th><th class="num">พารามิเตอร์</th><th class="num">เวลาฝึก</th></tr></thead><tbody>
      ${EDM_MODELS.filter(m=>m.deep).map(m=>{ const r=DEEP[m.id];
        return r?`<tr><td>${m.name}<div class="sub">${m.grp}</div></td>
          <td class="num">${r.metrics.auc.toFixed(3)}</td><td class="num">${(r.metrics.acc*100).toFixed(1)}%</td>
          <td class="num">${r.metrics.logloss.toFixed(3)}</td><td class="num">${r.nParam.toLocaleString()}</td>
          <td class="num">${(r.ms/1000).toFixed(1)} วิ</td></tr>`
        :`<tr style="opacity:.6"><td>${m.name}<div class="sub">${m.grp}</div></td>
          <td colspan="5" style="font-size:.83rem;color:var(--muted)">ยังไม่ได้ฝึก กดปุ่มด้านล่างเพื่อฝึกทั้งสี่โมเดล</td></tr>`;}).join("")}
      </tbody></table>
      <div class="row" style="margin-top:.8rem"><button class="btn btn-ghost btn-sm" data-act="deeptrainall">ฝึกโมเดลเชิงลึกทั้งสี่</button></div>`)}
    ${card("ข้อสังเกตต่อผลการเปรียบเทียบ","",
      `<ul style="margin:0;padding-left:1.1rem;font-size:.88rem">
        <li>ในชุดข้อมูลนี้ <b>${esc(best.m.name)}</b> ให้ค่า AUC สูงสุดที่ ${best.k.auc.toFixed(3)} แต่ส่วนต่างระหว่างโมเดลยังอยู่ในช่วงความผันแปรของกลุ่มตัวอย่างขนาดเล็ก</li>
        <li>ด้วยผู้เรียนเพียง ${cache.rows.length} คน การสลับอันดับระหว่างโมเดลอาจเกิดจากความบังเอิญ ไม่ควรสรุปว่าโมเดลใดดีกว่าอย่างถาวร</li>
        <li>ควรให้น้ำหนักกับค่า Recall มากกว่า Accuracy เพราะการพลาดกลุ่มเสี่ยง (FN) มีต้นทุนสูงกว่าการเตือนเกินจริง (FP)</li>
        <li>ก่อนใช้งานจริงต้องตรวจความเป็นธรรมของแบบจำลองระหว่างสาขาวิชาและชั้นปี เพื่อไม่ให้กลุ่มใดถูกทำนายว่าเสี่ยงเกินจริงอย่างเป็นระบบ</li>
      </ul>`)}</div>`;
}

function edmResult(cache,m){
  const r=cache.res[m.id], k=r.metrics, rows=cache.rows;
  const order=rows.map((o,i)=>({o,p:r.prob[i]})).sort((a,b)=>b.p-a.p);

  const metricCards=`<div class="grid g5">
    ${stat("Accuracy",(k.acc*100).toFixed(1)+"%","ทำนายถูกโดยรวม")}
    ${stat("Precision",(k.prec*100).toFixed(1)+"%","ในกลุ่มที่เตือน ถูกจริงเท่าใด")}
    ${stat("Recall",(k.rec*100).toFixed(1)+"%","จับกลุ่มเสี่ยงได้ครบเท่าใด")}
    ${stat("F1-score",(k.f1*100).toFixed(1)+"%","ค่าเฉลี่ยฮาร์มอนิก")}
    ${stat("AUC",k.auc.toFixed(3),"ความสามารถในการแยกกลุ่ม")}</div>`;

  let detail="";
  if(m.id==="logreg"){
    const w=r.model.w.map((v,j)=>({name:EDM_FEATNAMES[j],c:v})).sort((a,b)=>Math.abs(b.c)-Math.abs(a.c));
    detail=card("Prediction Curve (Logistic Regression)",
      "เส้นโค้งคือความน่าจะเป็นที่โมเดลทำนาย เมื่อคะแนนกลางภาคเปลี่ยนไปโดยตรึงคุณลักษณะอื่นไว้ที่ค่าเฉลี่ย · จุดคือผู้เรียนแต่ละคน สีแดงคือผู้ที่ไม่ผ่านเกณฑ์จริง",
      predCurveSVG(cache))
      +card("น้ำหนักของคุณลักษณะ","ค่าบวกเพิ่มความเสี่ยง ค่าลบลดความเสี่ยง (บนสเกลมาตรฐาน)",divergeBars(w));
  } else if(m.id==="dtree"){
    const render=(t,d)=>t.leaf
      ? `<div style="padding-left:${d*16}px;font-size:.83rem">ใบ: ทำนายเสี่ยง ${(t.p*100).toFixed(0)}% (ตัวอย่าง ${t.n} คน)</div>`
      : `<div style="padding-left:${d*16}px;font-size:.83rem"><b>${esc(EDM_FEATNAMES[t.j])}</b> ≤ ${t.thr.toFixed(2)} (มาตรฐาน)</div>`
        +render(t.L,d+1)+`<div style="padding-left:${d*16}px;font-size:.83rem;color:var(--muted)">มิฉะนั้น</div>`+render(t.R,d+1);
    detail=card("กฎการตัดสินของต้นไม้","ฝึกบนข้อมูลทั้งหมดเพื่อแสดงโครงสร้าง ส่วนค่าประสิทธิภาพด้านบนมาจากการตรวจสอบไขว้",
      `<div class="stack" style="gap:.15rem">${render(r.model.tree,0)}</div>`);
  } else if(m.id==="rforest"){
    const cnt=new Array(EDM_FEATNAMES.length).fill(0);
    const walk=t=>{ if(t.leaf) return; cnt[t.j]+=t.n; walk(t.L); walk(t.R); };
    r.model.trees.forEach(walk);
    const tot=cnt.reduce((a,b)=>a+b,0)||1;
    detail=card("ความสำคัญของคุณลักษณะ","วัดจากจำนวนตัวอย่างที่ผ่านจุดแบ่งของแต่ละคุณลักษณะ รวมทุกต้นในป่า",
      hbars(cnt.map((v,j)=>({name:EDM_FEATNAMES[j],v:v/tot})),Math.max(...cnt)/tot||1));
  } else if(m.id==="bkt"){
    const P=r.params;
    detail=card("พารามิเตอร์ที่ประมาณได้","ประมาณด้วยการค้นหาแบบกริดให้ค่าความควรจะเป็นสูงสุดจากลำดับการรอบรู้ "+r.nSeq+" ลำดับ",
      `<table class="tight"><tbody>
        <tr><td style="color:var(--muted);width:220px">P(L0) ความรู้ตั้งต้น</td><td class="num">${P.L0.toFixed(2)}</td></tr>
        <tr><td style="color:var(--muted)">P(T) โอกาสเรียนรู้ต่อรอบ</td><td class="num">${P.T.toFixed(2)}</td></tr>
        <tr><td style="color:var(--muted)">P(G) เดาถูกทั้งที่ยังไม่รอบรู้</td><td class="num">${P.G.toFixed(2)}</td></tr>
        <tr><td style="color:var(--muted)">P(S) พลาดทั้งที่รอบรู้แล้ว</td><td class="num">${P.S.toFixed(2)}</td></tr>
        <tr><td style="color:var(--muted)">ค่าลอการิทึมความควรจะเป็น</td><td class="num">${r.ll.toFixed(1)}</td></tr>
      </tbody></table>
      <div class="notebox" style="margin-top:.8rem">BKT ประมาณพารามิเตอร์จากลำดับการรอบรู้โดยไม่ใช้ตัวแปรเป้าหมาย
        จึงไม่ได้ผ่านการตรวจสอบไขว้แบบเดียวกับโมเดลอื่น ค่าประสิทธิภาพด้านบนคำนวณจากการใช้ 1 ลบความน่าจะเป็นรอบรู้เป็นคะแนนความเสี่ยง</div>`);
  }

  const predRows=order.map(({o,p})=>{
    const pred=p>=.5?1:0, ok=pred===o.y;
    return `<tr><td>${esc(o.name)}<div class="sub">${esc(o.code)} · ${o.program} ปี ${o.year}</div></td>
      <td style="width:120px">${meter(p,p>=.5?"var(--c2)":"var(--c1)")}</td>
      <td class="num">${(p*100).toFixed(1)}%</td>
      <td><span class="tag ${pred?"tag-risk":"tag-ok"}">${pred?"เสี่ยงไม่ผ่าน":"ไม่เสี่ยง"}</span></td>
      <td><span class="tag ${o.y?"tag-risk":"tag-ok"}">${o.y?"ไม่ผ่านจริง":"ผ่านจริง"}</span></td>
      <td><span class="tag ${ok?"tag-ok":"tag-warn"}">${ok?"ตรง":"คลาดเคลื่อน"}</span></td></tr>`;}).join("");

  const groups={};
  rows.forEach(o=>{const g=behaviorGroup(o); groups[g]=(groups[g]||0)+1;});
  const grpRows=Object.entries(groups).sort((a,b)=>b[1]-a[1])
    .map(([g,c])=>`<tr><td>${g}</td><td style="width:130px">${meter(c/rows.length)}</td><td class="num">${c} คน</td></tr>`).join("");
  const behRows=order.slice(0,8).map(({o,p})=>`<tr><td>${esc(o.name)}<div class="sub">${o.program} ปี ${o.year}</div></td>
    <td style="font-size:.82rem">${behaviorGroup(o)}</td>
    <td>${behaviorOf(o).map(t=>`<span class="tag ${t.c}" style="margin-right:.2rem">${t.t}</span>`).join("")}</td>
    <td class="num">${(p*100).toFixed(0)}%</td></tr>`).join("");

  if(!S.edmSid||!rows.some(o=>o.id===S.edmSid)) S.edmSid=order[0].o.id;
  const sel=rows.find(o=>o.id===S.edmSid);
  const selRisk=r.prob[rows.indexOf(sel)];
  const lp=learningPath(sel,selRisk);
  const pathHtml=lp.phases.map((ph,i)=>`<div style="display:flex;gap:.7rem;padding:.5rem 0;border-bottom:1px solid var(--line-soft)">
    <div class="stepnum">${i+1}</div><div style="min-width:0">
      <div style="font-weight:600;font-size:.88rem">${ph.head}</div>
      <div class="sub">${ph.n}</div>
      <ul style="margin:.35rem 0 0;padding-left:1.05rem;font-size:.85rem">${ph.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    </div></div>`).join("");

  return `<div class="stack">
    ${card(m.name,m.grp,`<p style="font-size:.87rem">${esc(m.note)}</p>`)}
    ${card("Performance Metrics",`ตรวจสอบไขว้แบบ leave-one-out · เกณฑ์ตัดสินที่ความน่าจะเป็น 50%`,metricCards)}
    ${card("Confusion Matrix","คำนวณจากผลทำนายจริงของผู้เรียนทั้ง "+rows.length+" คน",confusionHTML(k))}
    ${detail}
    ${card("Prediction Results","เรียงจากความเสี่ยงสูงไปต่ำ",
      `<div class="scroll-y"><table class="tight"><thead><tr><th>ผู้เรียน</th><th>ความเสี่ยง</th><th class="num">ค่า</th><th>ผลทำนาย</th><th>ผลจริง</th><th>ตรงกัน</th></tr></thead><tbody>${predRows}</tbody></table></div>`,"",false)}
    ${card("ทำนายพฤติกรรมการเรียนรู้","จัดกลุ่มจากพฤติกรรมการส่งงาน ความครบถ้วนของหลักฐาน และอัตราการเปลี่ยนแปลงของคะแนน",
      `<table class="tight"><thead><tr><th>กลุ่มพฤติกรรม</th><th>สัดส่วน</th><th class="num">จำนวน</th></tr></thead><tbody>${grpRows}</tbody></table>
       <h3 style="margin-top:1.1rem;font-size:.92rem">ผู้เรียนที่ควรติดตามก่อน</h3>
       <div class="scroll-x"><table class="tight" style="min-width:640px"><thead><tr><th>ผู้เรียน</th><th>กลุ่ม</th><th>สัญญาณที่พบ</th><th class="num">ความเสี่ยง</th></tr></thead><tbody>${behRows}</tbody></table></div>`)}
    ${card("แนะนำแผนการเรียน (Learning Path)",`${esc(sel.name)} · ${sel.program} ชั้นปีที่ ${sel.year} · ${lp.grp} · ความเสี่ยง ${(selRisk*100).toFixed(0)}%`,
      `<div class="field" style="margin-top:0"><label>เลือกผู้เรียน</label>
        <select class="inp" data-act="edmsid">${order.map(({o,p})=>`<option value="${o.id}" ${o.id===S.edmSid?"selected":""}>${(p*100).toFixed(0)}% · ${esc(o.name)} · ${o.program} ปี ${o.year}</option>`).join("")}</select></div>
       <div style="margin-top:.8rem">${pathHtml}</div>
       <div class="notebox" style="margin-top:.8rem">แผนนี้สร้างจากกฎที่กำหนดไว้ในระบบโดยอ้างอิงสมรรถนะที่อ่อนที่สุดและพฤติกรรมการส่งงานของผู้เรียน
         ไม่ใช่ผลจากแบบจำลองเชิงสาเหตุ จึงควรใช้เป็นข้อเสนอตั้งต้นให้อาจารย์ที่ปรึกษาปรับร่วมกับผู้เรียน</div>`)}
  </div>`;
}


/* ============================================================
   ตัวกรองรายชั้นปีและรายสาขาวิชา ใช้ร่วมกันหลายหน้า
   ============================================================ */
function filterBar(note){
  const pg=scopeProgram();
  const progs=pg?PROGRAMS.filter(p=>p.id===pg):PROGRAMS;
  const yOpt=`<option value="all" ${S.fy==="all"?"selected":""}>ทุกชั้นปี</option>`+
    FW.years.map(y=>`<option value="${y.year}" ${String(S.fy)===String(y.year)?"selected":""}>${esc(y.label)}</option>`).join("");
  const pOpt=(pg?"":`<option value="all" ${S.fp==="all"?"selected":""}>ทุกสาขาวิชา</option>`)+
    progs.map(p=>`<option value="${p.id}" ${S.fp===p.id?"selected":""}>${p.id} · ${esc(p.th)}</option>`).join("");
  return `<div class="bar-strip">
    <span class="lb">ขอบเขตรายงาน</span>
    <select class="inp" style="width:auto" data-act="setfy">${yOpt}</select>
    <select class="inp" style="width:auto" data-act="setfp">${pOpt}</select>
    <button class="btn btn-ghost btn-sm" data-act="clearf">ล้างตัวกรอง</button>
    <span class="far">${note||scopeLabel()}</span></div>`;
}
function scopeLabel(){
  const n=filteredStudents().length;
  const y=S.fy==="all"?"ทุกชั้นปี":("ชั้นปีที่ "+S.fy);
  const p=(S.fp==="all"||!S.fp)?"ทุกสาขาวิชา":(S.fp+" "+progName(S.fp));
  return `${y} · ${p} · ${n} คน`;
}
/** นักศึกษาที่อยู่ในสิทธิ์ของผู้ใช้ และผ่านตัวกรองชั้นปีกับสาขาวิชา */
function filteredStudents(){
  return visStudents().filter(s=>
    (S.fy==="all"||String(s.year)===String(S.fy)) &&
    (S.fp==="all"||!S.fp||s.program===S.fp));
}

  {id:"cohort", name:"รายงานสรุปรายชั้นปีและสาขาวิชา",
   desc:"คะแนนเฉลี่ยรายสมรรถนะ สัดส่วนผู้ถึงเป้าหมาย และผู้ที่ต้องเฝ้าระวัง"},
  {id:"gap", name:"รายงานช่องว่างสมรรถนะ",
   desc:"ส่วนต่างระหว่างคะแนนเฉลี่ยกับระดับเป้าหมายของแต่ละสมรรถนะ"},
  {id:"progress", name:"รายงานความก้าวหน้ารายรอบ",
   desc:"เปรียบเทียบผลการประเมินทั้งสามรอบของผู้เรียนแต่ละคน"},

    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=name; a.style.display="none";

/* ---------- 19. โครงแอปและตัวจัดเส้นทาง ---------- */

/* ============================================================
   XAI & Fairness — ความโปร่งใสและความเป็นธรรมของแบบจำลอง
   ทุกค่าคำนวณจากข้อมูลในระบบจริง ไม่มีการกำหนดผลไว้ล่วงหน้า
   ============================================================ */
const XAI_MIN_N=5;   // ขนาดกลุ่มขั้นต่ำที่ยอมให้สรุปผลความเป็นธรรม

/** ฟังก์ชันทำนายของโมเดลที่รับค่าดิบ แล้วแปลงเป็นสเกลมาตรฐานให้เอง */
function xaiPredictor(cache,id){
  const r=cache.res[id]; if(!r||!r.model) return null;
  const st=cache.st;
  return x=>r.model.predict(zrow(x,st));
}
/** ความสำคัญของคุณลักษณะด้วยวิธีสับเปลี่ยนค่า วัดจากค่า AUC ที่ลดลง */
function permImportance(cache,id,nRep){
  const f=xaiPredictor(cache,id); if(!f) return null;
  nRep=nRep||12;
  const X=cache.X, Y=cache.Y, D=X[0].length;
  const base=aucOf(Y,X.map(f));
  const rng=lcg(31337);
  const out=[];
  for(let j=0;j<D;j++){
    let drop=0;
    for(let t=0;t<nRep;t++){
      const idx=X.map((_,i)=>i);
      for(let i=idx.length-1;i>0;i--){ const k=Math.floor(rng()*(i+1)); const tmp=idx[i]; idx[i]=idx[k]; idx[k]=tmp; }
      const Xp=X.map((row,i)=>{ const c=row.slice(); c[j]=X[idx[i]][j]; return c; });
      drop+=base-aucOf(Y,Xp.map(f));
    }
    out.push({name:EDM_FEATNAMES[j], v:drop/nRep});
  }
  return {base, items:out.slice().sort((a,b)=>b.v-a.v)};
}
/** ค่า Shapley แบบคำนวณครบทุกเซตย่อย (7 คุณลักษณะ = 128 เซต) จึงเป็นค่าที่แน่นอน ไม่ใช่ค่าประมาณ */
function shapleyExact(cache,id,rowIdx){
  const f=xaiPredictor(cache,id); if(!f) return null;
  const X=cache.X, D=X[0].length, x=X[rowIdx];
  const bg=X;                          // ใช้ผู้เรียนทั้งหมดเป็นฐานอ้างอิง
  const NS=1<<D, v=new Float64Array(NS);
  for(let mask=0;mask<NS;mask++){
    let acc=0;
    for(let k=0;k<bg.length;k++){
      const z=new Array(D);
      for(let j=0;j<D;j++) z[j]=(mask>>j)&1 ? x[j] : bg[k][j];
      acc+=f(z);
    }
    v[mask]=acc/bg.length;
  }
  const fact=[1]; for(let i=1;i<=D;i++) fact.push(fact[i-1]*i);
  const phi=new Array(D).fill(0);
  for(let j=0;j<D;j++){
    for(let mask=0;mask<NS;mask++){
      if((mask>>j)&1) continue;
      let sz=0; for(let q=0;q<D;q++) if((mask>>q)&1) sz++;
      const w=fact[sz]*fact[D-sz-1]/fact[D];
      phi[j]+=w*(v[mask|(1<<j)]-v[mask]);
    }
  }
  return {phi, base:v[0], out:v[NS-1],
    items:phi.map((c,j)=>({name:EDM_FEATNAMES[j],c,x:x[j]})).sort((a,b)=>Math.abs(b.c)-Math.abs(a.c))};
}
/** ตัวชี้วัดความเป็นธรรมของกลุ่มหนึ่ง */
function groupMetrics(rows,prob,idxs){
  const y=idxs.map(i=>rows[i].y), p=idxs.map(i=>prob[i]);
  const n=idxs.length;
  let tp=0,fp=0,fn=0,tn=0;
  y.forEach((t,i)=>{ const d=p[i]>=.5?1:0;
    if(t===1&&d===1)tp++; else if(t===0&&d===1)fp++; else if(t===1&&d===0)fn++; else tn++; });
  return {n, base:mean(y), sel:(tp+fp)/n, meanP:mean(p),
    tpr:(tp+fn)?tp/(tp+fn):null, fpr:(fp+tn)?fp/(fp+tn):null,
    prec:(tp+fp)?tp/(tp+fp):null, acc:(tp+tn)/n,
    auc:(y.some(v=>v===1)&&y.some(v=>v===0))?aucOf(y,p):null};
}
function fairnessBy(cache,id,keyFn,labelFn){
  const rows=cache.rows, prob=cache.res[id].prob;
  const map={};
  rows.forEach((r,i)=>{ const k=keyFn(r); (map[k]=map[k]||[]).push(i); });
  const groups=Object.keys(map).sort().map(k=>({key:k,label:labelFn(k),m:groupMetrics(rows,prob,map[k])}));
  const big=groups.filter(g=>g.m.n>=XAI_MIN_N);
  const gap=(f)=>{ const v=big.map(g=>g.m[f]).filter(x=>x!==null&&x!==undefined);
    return v.length>1?Math.max(...v)-Math.min(...v):null; };
  const sels=big.map(g=>g.m.sel).filter(x=>x>0);
  return {groups, big,
    dp:gap("sel"), eo:gap("tpr"), fprGap:gap("fpr"), precGap:gap("prec"), aucGap:gap("auc"),
    di: sels.length>1?Math.min(...sels)/Math.max(...sels):null};
}
/** Mantel-Haenszel DIF รายข้อ พร้อมการจัดระดับตามเกณฑ์ ETS */
function difAnalysis(cid){
  const items=bankOf(cid), cols=items.map(it=>BANK.indexOf(it));
  const P={resp:pilotRows(cols)};          // ใช้เฉพาะผู้ที่ทำครบทุกข้อในชุดนี้
  const N=P.resp.length;
  /* กลุ่มอ้างอิงและกลุ่มเปรียบเทียบกำหนดแบบสุ่มโดยไม่มีความแตกต่างจริง
     ใช้เพื่อยืนยันว่ากลไกตรวจ DIF ไม่แจ้งผลบวกลวงเกินสมควร */
  const rng=lcg(515151), grp=[];
  for(let i=0;i<N;i++) grp.push(rng()<0.5?0:1);
  const tot=[]; for(let i=0;i<N;i++){ let t=0; cols.forEach(c=>t+=P.resp[i][c]); tot.push(t); }
  const J=items.length, K=6;
  const lo=Math.min(...tot), hi=Math.max(...tot), w=Math.max(1,(hi-lo+1)/K);
  const strat=tot.map(t=>clamp(Math.floor((t-lo)/w),0,K-1));
  return items.map((it,j)=>{
    let num=0, den=0, nR=0, nF=0, pR=0, pF=0;
    for(let k=0;k<K;k++){
      let a=0,b=0,c=0,d=0;
      for(let i=0;i<N;i++){
        if(strat[i]!==k) continue;
        const ok=P.resp[i][cols[j]];
        if(grp[i]===0){ if(ok)a++; else b++; } else { if(ok)c++; else d++; }
      }
      const t=a+b+c+d; if(t<2) continue;
      num+=a*d/t; den+=b*c/t;
      nR+=a+b; nF+=c+d; pR+=a; pF+=c;
    }
    const alpha=den>0?num/den:null;
    const dd=alpha&&alpha>0?-2.35*Math.log(alpha):null;
    const ad=Math.abs(dd||0);
    return {it, alpha, dd, nR, nF,
      pR:nR?pR/nR:null, pF:nF?pF/nF:null,
      lvl: dd===null?"คำนวณไม่ได้": ad<1.0?"A · ไม่พบ DIF": ad<1.5?"B · DIF ปานกลาง":"C · DIF สูง",
      cls: dd===null?"tag-n": ad<1.0?"tag-ok": ad<1.5?"tag-warn":"tag-risk"};
  });
}

/* ============================================================
   ความสอดคล้องระหว่างผู้ประเมิน (Inter-rater reliability)
   คำนวณจากผลการประเมินจริงในระบบ ไม่มีค่ากำหนดไว้ล่วงหน้า
   ============================================================ */
const IRR_MIN_N=20;   // จำนวนคู่คะแนนขั้นต่ำที่ยอมให้สรุปผลรายบุคคล

/** ผู้ประเมินจริงของนักศึกษาคนหนึ่งในช่องทางหนึ่ง อ่านจากระเบียน ASSESS_LOG
    เดิมฟังก์ชันนี้เดาโดยหยิบผู้ที่มีบทบาทนั้นคนแรกในสาขา ทำให้สถิติรายผู้ประเมินผิดคน
    ตอนนี้ใช้ assessor_id ที่บันทึกไว้จริง และถอยไปใช้การเดาเฉพาะเมื่อไม่มีระเบียน */
function raterOf(st,kind){
  const types=kind==="lec"?["lecturer","major"]:["mentor"];
  const log=(ASSESS_LOG[st.id]||[]).filter(a=>types.includes(a.type)&&a.assessor_id);
  if(log.length){
    /* ผู้ที่ประเมินนักศึกษารายนี้บ่อยที่สุดในช่องทางนั้น ถือเป็นผู้ประเมินหลัก */
    const cnt={};
    log.forEach(a=>{ cnt[a.assessor_id]=(cnt[a.assessor_id]||0)+1; });
    const id=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
    const u=userById(id);
    if(u) return u;
    const nm=(log.find(a=>a.assessor_id===id)||{}).assessor_name;
    return {id,name:nm||(kind==="lec"?"อาจารย์นิเทศก์":"ครูพี่เลี้ยง")};
  }
  const role=kind==="lec"?"Lecturer":"Mentor";
  return USERS.find(u=>!u.linkTo&&u.roles.includes(role)&&u.program===st.program)
      || USERS.find(u=>!u.linkTo&&u.roles.includes(role))
      || {id:"unknown-"+kind,name:kind==="lec"?"อาจารย์นิเทศก์":"ครูพี่เลี้ยง"};
}
/** สัดส่วนคู่คะแนนที่ระบุตัวผู้ประเมินได้จากระเบียนจริง ใช้แจ้งความน่าเชื่อถือของสถิติรายผู้ประเมิน */
function irrTraceable(){
  const list=filteredStudents();
  if(!list.length) return {n:0,traced:0};
  const traced=list.filter(st=>(ASSESS_LOG[st.id]||[]).some(a=>a.assessor_id)).length;
  return {n:list.length,traced};
}
/** คู่คะแนนระดับตัวชี้วัดของฝ่ายอาจารย์นิเทศก์กับฝ่ายครูพี่เลี้ยง ใช้เป็นฐานของสถิติทั้งหมด
    ฝ่ายอาจารย์นิเทศก์คิดจากค่าเฉลี่ยของวิชาชีพครูกับวิชาเอก ให้ตรงกับกติกาคะแนนรวม
    เก็บคะแนนประเมินตนเองไว้ด้วย เพื่อดูแนวโน้มการประเมินตนเองสูงหรือต่ำกว่าผู้ประเมินภายนอก */
function irrPairs(){
  const rows=[];
  filteredStudents().forEach(st=>{
    const y=st.year, L=RESP_L[st.id], J=RESP_A[st.id], M=RESP_M[st.id], F=RESP_S[st.id];
    if(!M||(!L&&!J)) return;
    const rl=raterOf(st,"lec"), rm=raterOf(st,"men");
    activeComps(FW,y).forEach(c=>indsOf(FW,y,c.id).forEach(i=>{
      const adv=[L&&L[i.id],J&&J[i.id]].filter(x=>x!==undefined&&x!==null&&x!==false);
      if(!adv.length||!M||M[i.id]===undefined) return;
      rows.push({sid:st.id,student:st.name,program:st.program,year:y,comp:c,ind:i,
        lec:mean(adv),men:M[i.id],slf:(F&&F[i.id]!==undefined)?F[i.id]:null,
        lecId:rl.id,lecName:rl.name,menId:rm.id,menName:rm.name});
    }));
  });
  return rows;
}
/** สหสัมพันธ์เพียร์สัน */
function pearson(x,yv){
  if(x.length<3) return null;
  const mx=mean(x),my=mean(yv);
  let n=0,dx=0,dy=0;
  x.forEach((v,i)=>{n+=(v-mx)*(yv[i]-my);dx+=(v-mx)**2;dy+=(yv[i]-my)**2;});
  return (dx>0&&dy>0)?n/Math.sqrt(dx*dy):null;
}
/** แคปปาถ่วงน้ำหนักกำลังสองของโคเฮน สำหรับมาตรจัดอันดับ */
function weightedKappa(a,b,K){
  const n=a.length; if(!n) return null;
  const O=Array.from({length:K},()=>new Array(K).fill(0));
  const ra=new Array(K).fill(0), rb=new Array(K).fill(0);
  a.forEach((v,i)=>{ const x=clamp(Math.round(v),1,K)-1, z=clamp(Math.round(b[i]),1,K)-1;
    O[x][z]++; ra[x]++; rb[z]++; });
  let num=0,den=0;
  for(let i=0;i<K;i++) for(let j=0;j<K;j++){
    const w=Math.pow(i-j,2)/Math.pow(K-1,2);
    const e=ra[i]*rb[j]/n;
    num+=w*O[i][j]; den+=w*e;
  }
  return den>0?1-num/den:null;
}
/** ICC แบบสองทางสุ่ม สำหรับเป้าหมาย n ราย ผู้ประเมิน k คน */
function iccTwoWay(mat){
  const n=mat.length; if(!n) return null;
  const k=mat[0].length;
  const grand=mean(mat.flat());
  const rowM=mat.map(r=>mean(r));
  const colM=Array.from({length:k},(_,j)=>mean(mat.map(r=>r[j])));
  let SSR=0,SSC=0,SSE=0;
  rowM.forEach(m=>SSR+=k*Math.pow(m-grand,2));
  colM.forEach(m=>SSC+=n*Math.pow(m-grand,2));
  mat.forEach((r,i)=>r.forEach((v,j)=>SSE+=Math.pow(v-rowM[i]-colM[j]+grand,2)));
  const MSR=SSR/(n-1), MSC=SSC/(k-1), MSE=SSE/((n-1)*(k-1));
  if(!(MSR>0)) return null;
  const icc1=(MSR-MSE)/(MSR+(k-1)*MSE+k*(MSC-MSE)/n);
  const iccK=(MSR-MSE)/(MSR+(MSC-MSE)/n);
  return {n,k,MSR,MSC,MSE,icc1,iccK};
}
/** ค่าความน่าจะเป็นสองด้านโดยประมาณจากการแจกแจงปกติ */
const pTwoSided=z=>2*(1-0.5*(1+erf(Math.abs(z)/Math.SQRT2)));

function irrAnalyze(){
  const P=irrPairs();
  if(P.length<IRR_MIN_N) return {pairs:P,error:"ข้อมูลคู่คะแนนน้อยเกินกว่าจะคำนวณได้"};
  const K=FW.levels.length;
  const lec=P.map(p=>p.lec), men=P.map(p=>p.men);
  const diff=P.map(p=>p.lec-p.men);
  const exact=P.filter(p=>p.lec===p.men).length/P.length;
  const within1=P.filter(p=>Math.abs(p.lec-p.men)<=1).length/P.length;

  /* ICC ที่ระดับคะแนนรวมของนักศึกษาแต่ละคน */
  const bySt={};
  P.forEach(p=>{ (bySt[p.sid]=bySt[p.sid]||{l:[],m:[]}); bySt[p.sid].l.push(p.lec); bySt[p.sid].m.push(p.men); });
  const mat=Object.values(bySt).map(o=>[mean(o.l),mean(o.m)]);
  const iccStudent=iccTwoWay(mat);
  /* ICC ที่ระดับสมรรถนะรายคน ให้กำลังการประมาณสูงขึ้น */
  const byCell={};
  P.forEach(p=>{ const k=p.sid+"|"+p.comp.id;
    (byCell[k]=byCell[k]||{l:[],m:[]}); byCell[k].l.push(p.lec); byCell[k].m.push(p.men); });
  const matC=Object.values(byCell).map(o=>[mean(o.l),mean(o.m)]);
  const iccCell=iccTwoWay(matC);

  /* สรุปรายผู้ประเมิน */
  const raters={};
  const add=(id,name,role,prog,own,other)=>{
    const r=raters[id]=raters[id]||{id,name,role,progs:new Set(),v:[],d:[],students:new Set()};
    r.progs.add(prog); r.v.push(own); r.d.push(own-other);
  };
  P.forEach(p=>{
    add(p.lecId,p.lecName,"อาจารย์นิเทศก์",p.program,p.lec,p.men);
    add(p.menId,p.menName,"ครูพี่เลี้ยง",p.program,p.men,p.lec);
    raters[p.lecId].students.add(p.sid); raters[p.menId].students.add(p.sid);
  });
  const grand=mean(P.flatMap(p=>[p.lec,p.men]));
  const list=Object.values(raters).map(r=>{
    const m=mean(r.v), sd=sdev(r.v)||0;
    const d=mean(r.d), sdd=sdev(r.d)||1e-9, n=r.d.length;
    const z=d/(sdd/Math.sqrt(n)), p=pTwoSided(z);
    return {...r, progs:Array.from(r.progs).join(", "), nStu:r.students.size, n,
      mean:m, sd, vsGrand:m-grand, dPair:d, z, p,
      verdict: p>=0.05?"ไม่ต่างอย่างมีนัยสำคัญ":(d>0?"ให้คะแนนสูงกว่าคู่ประเมิน":"ให้คะแนนต่ำกว่าคู่ประเมิน"),
      cls: p>=0.05?"tag-ok":(Math.abs(d)>=0.3?"tag-risk":"tag-warn")};
  }).sort((a,b)=>b.dPair-a.dPair);

  /* สรุปรายสมรรถนะ */
  const byComp=activeComps(FW,4).concat([]).length?null:null;
  const compMap={};
  P.forEach(p=>{ const k=p.comp.id;
    (compMap[k]=compMap[k]||{comp:p.comp,l:[],m:[]}); compMap[k].l.push(p.lec); compMap[k].m.push(p.men); });
  const comps=Object.values(compMap).map(o=>({
    comp:o.comp, n:o.l.length,
    exact:o.l.filter((v,i)=>v===o.m[i]).length/o.l.length,
    mad:mean(o.l.map((v,i)=>Math.abs(v-o.m[i]))),
    bias:mean(o.l.map((v,i)=>v-o.m[i])),
    r:pearson(o.l,o.m),
    kappa:weightedKappa(o.l,o.m,K),
  })).sort((a,b)=>a.kappa-b.kappa);

  return {pairs:P, n:P.length, K, grand,
    r:pearson(lec,men), kappa:weightedKappa(lec,men,K),
    exact, within1, mad:mean(diff.map(Math.abs)), bias:mean(diff),
    sdDiff:sdev(diff), iccStudent, iccCell, raters:list, comps};
}
const irrBand=v=>v===null?["—","tag-n"]:v>=0.90?["ดีเยี่ยม","tag-ok"]:v>=0.75?["ดี","tag-ok"]:
  v>=0.60?["พอใช้","tag-warn"]:v>=0.40?["ต่ำ","tag-warn"]:["ต่ำมาก","tag-risk"];

/* ============================================================
   ความสอดคล้องของผู้ประเมินรายบุคคล
   เทียบคะแนนที่ผู้ประเมินคนนี้ให้ กับค่ากลางของผู้ประเมินฝ่ายอื่นในเซลล์เดียวกัน
   เซลล์ = (นักศึกษา × สมรรถนะ × รอบ) ซึ่งเป็นหน่วยที่เทียบกันได้ตรงที่สุด
   ใช้ระเบียนจริงจาก ASSESS_LOG จึงเป็นผลของผู้ประเมินคนนั้นเอง ไม่ใช่ค่าเฉลี่ยของช่องทาง
   ============================================================ */
function advisorIRR(uid){
  const me=userById(uid);
  if(!me) return {n:0};
  const cells=[];
  visStudents().forEach(st=>{
    const y=st.year, rounds=HIST[st.id]||[];
    (ASSESS_LOG[st.id]||[]).forEach(a=>{
      if(String(a.assessor_id)!==String(uid)) return;
      const rater=raterByType(a.type); if(!rater) return;
      const c=FW.competencies.find(x=>x.id===a.comp_id); if(!c) return;
      const round=rounds.find(r=>String(r.no||0)===String(a.round_no))||null;
      const own=compScoreBy(FW,st.id,c,y,rater.key,round?round[rater.key]:null);
      if(own===null) return;
      /* ค่ากลางของฝ่ายอื่น คิดจากผู้ประเมินทุกฝ่ายที่ไม่ใช่ช่องทางของตนเอง */
      const others=RATERS.filter(x=>x.key!==rater.key)
        .map(x=>compScoreBy(FW,st.id,c,y,x.key,round?round[x.key]:null))
        .filter(v=>v!==null);
      if(!others.length) return;
      cells.push({sid:st.id,student:st.name,program:st.program,comp:c,
        round:a.round_no,date:a.date,own,other:mean(others),d:own-mean(others),
        target:cfgOf(FW,y,c.id).target});
    });
  });
  if(cells.length<3) return {n:cells.length,me};

  const own=cells.map(x=>x.own), oth=cells.map(x=>x.other), d=cells.map(x=>x.d);
  const bias=mean(d), sdd=sdev(d)||1e-9, n=d.length;
  const z=bias/(sdd/Math.sqrt(n));
  const p=pTwoSided(z);
  /* ขนาดอิทธิพลแบบ Cohen d ของค่าเบี่ยงเบนคู่ บอกว่าต่างกันมากพอจะสังเกตได้หรือไม่
     ค่านัยสำคัญเพียงอย่างเดียวไม่พอ เพราะจำนวนเซลล์มากทำให้ค่าเล็กก็มีนัยสำคัญได้ */
  const dz=bias/sdd;

  /* ค่ากลางของคณะ คิดจากคะแนนทุกฝ่ายของนักศึกษาที่ผู้ประเมินรายนี้เห็น */
  const facultyAll=[];
  visStudents().forEach(st=>{
    const y=st.year;
    activeComps(FW,y).forEach(c=>RATERS.forEach(x=>{
      const v=compScoreBy(FW,st.id,c,y,x.key); if(v!==null) facultyAll.push(v);
    }));
  });
  const faculty=facultyAll.length?mean(facultyAll):null;

  /* แยกรายสมรรถนะ เพื่อชี้ว่าความต่างเกิดเฉพาะบางด้านหรือทั่วทั้งกรอบ */
  const byComp={};
  cells.forEach(x=>{ const k=x.comp.id;
    (byComp[k]=byComp[k]||{comp:x.comp,own:[],oth:[]}); byComp[k].own.push(x.own); byComp[k].oth.push(x.other); });
  const comps=Object.values(byComp).map(o=>({
    comp:o.comp,n:o.own.length,own:mean(o.own),other:mean(o.oth),
    d:mean(o.own.map((v,i)=>v-o.oth[i])),
  })).sort((a,b)=>b.d-a.d);

  /* แยกรายรอบ ดูว่าแนวโน้มคงที่หรือเปลี่ยนไปตามเวลา */
  const byRound={};
  cells.forEach(x=>{ const k=String(x.round);
    (byRound[k]=byRound[k]||{round:x.round,d:[],own:[]}); byRound[k].d.push(x.d); byRound[k].own.push(x.own); });
  const rounds=Object.values(byRound).sort((a,b)=>a.round-b.round)
    .map(o=>({round:o.round,n:o.d.length,d:mean(o.d),own:mean(o.own)}));

  const verdict = p>=0.05 ? "สอดคล้องกับค่ากลาง"
    : (bias>0 ? "ให้คะแนนสูงกว่าค่ากลางอย่างเป็นระบบ" : "ให้คะแนนต่ำกว่าค่ากลางอย่างเป็นระบบ");
  const cls = p>=0.05 ? "tag-ok" : (Math.abs(dz)>=0.5 ? "tag-risk" : "tag-warn");

  return {n, me, cells, ownMean:mean(own), otherMean:mean(oth), faculty,
    bias, sdDiff:sdd, z, p, dz, verdict, cls,
    exact:cells.filter(x=>Math.round(x.own)===Math.round(x.other)).length/n,
    within1:cells.filter(x=>Math.abs(x.own-x.other)<=1).length/n,
    r:pearson(own,oth), kappa:weightedKappa(own,oth,FW.levels.length),
    students:new Set(cells.map(x=>x.sid)).size, comps, rounds};
}

/** แผงความสอดคล้องของผู้ประเมิน แสดงในหน้าโปรไฟล์ของอาจารย์นิเทศก์และครูพี่เลี้ยง */
function pfRaterIRR(u){
  const A=advisorIRR(u.id);
  if(!A.n||A.n<3) return card("ความสอดคล้องระหว่างผู้ประเมิน",
    "เทียบคะแนนที่ท่านให้ กับค่ากลางของผู้ประเมินฝ่ายอื่นในนักศึกษาและสมรรถนะเดียวกัน",
    `<div class="empty">ยังมีระเบียนการประเมินของท่านไม่พอสำหรับคำนวณ (พบ ${A.n||0} รายการ ต้องมีอย่างน้อย 3)
      ผลจะปรากฏเมื่อท่านบันทึกผลการประเมินและมีผู้ประเมินฝ่ายอื่นประเมินนักศึกษาคนเดียวกัน</div>`);

  const dirWord=A.bias>0?"สูงกว่า":"ต่ำกว่า";
  const [rBand,rCls]=irrBand(A.r);
  const [kBand,kCls]=irrBand(A.kappa);

  const compRows=A.comps.map(o=>`<tr>
    <td style="font-size:.82rem">${esc(o.comp.th)}<div class="sub">${o.comp.code} · ${o.n} เซลล์</div></td>
    <td class="num">${fmt(o.own)}</td><td class="num">${fmt(o.other)}</td>
    <td class="num" style="font-weight:600;color:${Math.abs(o.d)<0.2?"var(--muted)":o.d>0?"var(--warn)":"var(--c1)"}">
      ${(o.d>=0?"+":"")+o.d.toFixed(2)}</td></tr>`).join("");

  const roundRows=A.rounds.map(o=>`<tr><td>ครั้งที่ ${o.round}</td><td class="num">${o.n}</td>
    <td class="num">${fmt(o.own)}</td>
    <td class="num" style="font-weight:600;color:${Math.abs(o.d)<0.2?"var(--muted)":o.d>0?"var(--warn)":"var(--c1)"}">
      ${(o.d>=0?"+":"")+o.d.toFixed(2)}</td></tr>`).join("");

  const reading = A.p>=0.05
    ? `คะแนนของท่านไม่ต่างจากค่ากลางอย่างมีนัยสำคัญทางสถิติ (p = ${A.p.toFixed(3)}) ถือว่าใช้เกณฑ์สอดคล้องกับผู้ประเมินฝ่ายอื่น`
    : `คะแนนของท่าน${dirWord}ค่ากลางเฉลี่ย ${Math.abs(A.bias).toFixed(2)} ระดับ และต่างอย่างมีนัยสำคัญ (p = ${A.p.toFixed(3)})
       ขนาดอิทธิพล d<sub>z</sub> = ${A.dz.toFixed(2)} ${Math.abs(A.dz)>=0.8?"ถือว่าใหญ่":Math.abs(A.dz)>=0.5?"ถือว่าปานกลาง":"ถือว่าเล็ก"}`;

  return `<div class="stack">
    ${card("ความสอดคล้องระหว่างผู้ประเมิน",
      `เทียบคะแนนที่ท่านให้ กับค่ากลางของผู้ประเมินฝ่ายอื่นในเซลล์เดียวกัน · ${A.n} เซลล์ จากนักศึกษา ${A.students} คน`,
      `<div class="grid g4">
        ${stat("คะแนนเฉลี่ยของท่าน",fmt(A.ownMean),"จากระเบียนที่ท่านบันทึกจริง")}
        ${stat("ค่ากลางของฝ่ายอื่น",fmt(A.otherMean),"เซลล์เดียวกับที่ท่านประเมิน")}
        ${stat("ส่วนต่างเฉลี่ย",(A.bias>=0?"+":"")+A.bias.toFixed(2),
          `<span class="tag ${A.cls}">${A.verdict}</span>`)}
        ${stat("ค่ากลางของคณะ",fmt(A.faculty),"ทุกฝ่ายในขอบเขตของท่าน")}
      </div>
      <div class="notebox" style="margin-top:.9rem">${reading}<br>
        ทดสอบด้วย paired t-test บนส่วนต่างรายเซลล์ · ค่าบวกหมายถึงท่านให้สูงกว่าฝ่ายอื่น
        ผลนี้ใช้เพื่อสอบเทียบความเข้าใจเกณฑ์ร่วมกัน ไม่ใช่การประเมินผลการปฏิบัติงานของท่าน</div>`)}

    ${card("ความสอดคล้องเชิงสถิติ","ตัวเลขทั้งหมดคำนวณจากคู่คะแนนของท่านกับค่ากลางของฝ่ายอื่น",
      `<table class="tight"><tbody>
        <tr><td>ตรงกันพอดี (ปัดเป็นระดับ)</td><td class="num">${(A.exact*100).toFixed(0)}%</td></tr>
        <tr><td>ต่างกันไม่เกิน 1 ระดับ</td><td class="num">${(A.within1*100).toFixed(0)}%</td></tr>
        <tr><td>สหสัมพันธ์เพียร์สัน (r)</td><td class="num">${fmt(A.r,3)} <span class="tag ${rCls}">${rBand}</span></td></tr>
        <tr><td>แคปปาถ่วงน้ำหนัก</td><td class="num">${fmt(A.kappa,3)} <span class="tag ${kCls}">${kBand}</span></td></tr>
        <tr><td>ส่วนเบี่ยงเบนของส่วนต่าง</td><td class="num">${fmt(A.sdDiff,2)}</td></tr>
      </tbody></table>`,"",false)}

    <div class="grid g2" style="align-items:start">
      ${card("ส่วนต่างรายสมรรถนะ","เรียงจากด้านที่ท่านให้สูงกว่าฝ่ายอื่นมากที่สุด",
        `<div class="scroll-y"><table class="tight"><thead><tr><th>สมรรถนะ</th>
          <th class="num">ของท่าน</th><th class="num">ฝ่ายอื่น</th><th class="num">ส่วนต่าง</th>
        </tr></thead><tbody>${compRows}</tbody></table></div>`,"",false)}
      ${card("ส่วนต่างรายรอบ","ดูว่าแนวโน้มคงที่หรือเปลี่ยนไปตามรอบการประเมิน",
        `<table class="tight"><thead><tr><th>รอบ</th><th class="num">เซลล์</th>
          <th class="num">ของท่าน</th><th class="num">ส่วนต่าง</th></tr></thead><tbody>${roundRows}</tbody></table>`,"",false)}
    </div>
    <div class="notebox">${docStamp("ที่มา: ระเบียนการประเมินของท่านในชีต Assessments")}</div>
  </div>`;
}

function irrPage(){
  const A=irrAnalyze();
  const tabs=[["sum","ภาพรวมความสอดคล้อง"],["rater","รายผู้ประเมิน"],
    ["comp","รายสมรรถนะ"],["note","วิธีคำนวณและข้อจำกัด"]]
    .map(([k,l])=>`<button class="${S.irrTab===k?"on":""}" data-act="irrtab" data-v="${k}">${l}</button>`).join("");
  let body="";
  if(A.error) body=card("ความสอดคล้องระหว่างผู้ประเมิน","",`<div class="empty">${esc(A.error)}</div>`);
  else if(S.irrTab==="rater") body=irrRaters(A);
  else if(S.irrTab==="comp") body=irrComps(A);
  else if(S.irrTab==="note") body=irrNotes(A);
  else body=irrSummary(A);
  return `<div class="stack">${filterBar()}<div class="tabs">${tabs}</div>${body}</div>`;
}

     ผู้เรียนที่ยังไม่มีระเบียนจะใช้การอนุมานจากบทบาทในสาขา ซึ่งเชื่อถือได้น้อยกว่า */

          <td><span class="tag ${ic}">${ib}</span></td><td class="sub">ความเชื่อถือได้เมื่อใช้ค่าเฉลี่ยของผู้ประเมินสองฝ่าย</td></tr>

      ${stat("ให้คะแนนต่ำกว่าอย่างมีนัยสำคัญ",strict.length,"ควรทบทวนความเข้าใจเกณฑ์")}
    </div>
    ${card("สรุปรายผู้ประเมิน","เรียงจากผู้ที่ให้คะแนนสูงกว่าคู่ประเมินมากที่สุด",
      `<div class="scroll-x"><table class="tight" style="min-width:860px"><thead><tr>
        <th>ผู้ประเมิน</th><th class="num">คู่คะแนน</th><th class="num">คะแนนเฉลี่ย</th>

    ${card("ข้อเสนอการดำเนินการ","",

        ? `<ul style="margin:0;padding-left:1.1rem;font-size:.88rem;line-height:1.9">
            ${lenient.length?`<li>จัดประชุมปรับมาตรฐานการให้คะแนนกับผู้ประเมินที่ให้คะแนนสูงกว่าคู่ประเมินอย่างมีนัยสำคัญ ได้แก่ ${lenient.map(r=>esc(r.name)).join(" · ")}</li>`:""}
            ${strict.length?`<li>ทบทวนความเข้าใจเกณฑ์กับผู้ประเมินที่ให้คะแนนต่ำกว่าคู่ประเมินอย่างมีนัยสำคัญ ได้แก่ ${strict.map(r=>esc(r.name)).join(" · ")}</li>`:""}
            <li>ใช้ตัวอย่างผลงานร่วมกันให้ผู้ประเมินทุกคนให้คะแนนชุดเดียวกัน แล้วอภิปรายจุดที่ต่างกัน</li>
            <li>ทบทวนคำอธิบายเกณฑ์ในสมรรถนะที่มีความสอดคล้องต่ำที่สุด ดูได้ในแท็บรายสมรรถนะ</li>
          </ul>`
        : `<div class="empty" style="padding:1.2rem">ยังไม่พบผู้ประเมินที่ให้คะแนนต่างจากคู่ประเมินอย่างมีนัยสำคัญทางสถิติ</div>`)}
  </div>`;
}

function shellView(){

  const navHtml=nav.map(k=>`<button class="${cur===k?"on":""}" data-act="nav" data-v="${k}">${NAV_LABEL[k]}${k==="approvals"&&PENDING.length?` (${PENDING.length})`:""}</button>`).join("");

  const ro=!canYear;
  switch(cur){
    case "dashboard":
      body = S.role==="Student"?studentDash()

           :(S.role==="Dean"||S.role==="Program Chair")?execDash():adminDash(); break;

    case "myladder": body=ladderPage(); break;

    case "exam": body=examPage(); break;

  return `<div class="shell">

    <div class="main">

        <div class="topright">${roleSw}
          <button class="btn btn-ghost btn-sm" data-act="modetoggle"

          <span class="themebtns" role="group" aria-label="เลือกโทนสีหลัก">${
