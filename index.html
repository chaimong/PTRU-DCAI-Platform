    <div class="notebox">ค่าสัมประสิทธิ์ของแบบจำลองนี้เป็นค่าตั้งต้นเชิงสาธิต ยังไม่ได้ประมาณจากข้อมูลผู้เรียนจริง
      ก่อนใช้งานต้องฝึกแบบจำลองด้วยข้อมูลย้อนหลังแยกตามชั้นปีและสาขาวิชา ตรวจสอบความเที่ยงตรงเชิงทำนาย และตรวจความเป็นธรรมระหว่างกลุ่มผู้เรียน</div>
    <div class="grid g4">${stat("ความน่าจะเป็นที่จะไม่ผ่านเกณฑ์",(A.edm.risk*100).toFixed(1)+"%",lb)}
      ${stat("สมรรถนะต่ำกว่าเป้าหมาย",Math.round(A.belowTarget*100)+"%",`เกณฑ์ของชั้นปีที่ ${A.year}`)}
      ${stat("ความครบถ้วนของหลักฐาน",featPct(st.evidence),featNote(st.evidence))}
      ${stat("การส่งงานตรงเวลา",featPct(st.ontime),featNote(st.ontime))}</div>
    ${card("ปัจจัยที่มีผลต่อการทำนาย","แท่งไปทางขวาคือเพิ่มความเสี่ยง ไปทางซ้ายคือลดความเสี่ยง",divergeBars(A.edm.parts))}
    ${card("มาตรการที่เสนอ","สร้างจากปัจจัยที่มีน้ำหนักสูงสุด",`<ul style="margin:0;padding-left:1.1rem;font-size:.88rem">
      ${featOr(st.ontime)<.7?"<li>นัดหมายติดตามการส่งงานรายสัปดาห์กับอาจารย์ที่ปรึกษา</li>":""}
      ${featOr(st.evidence)<.8?"<li>ทบทวนรายการหลักฐานที่ยังขาดและกำหนดวันส่งใหม่ร่วมกัน</li>":""}
      ${A.belowTarget>.3?"<li>จัดกิจกรรมเสริมในสมรรถนะที่ยังต่ำกว่าระดับเป้าหมายของชั้นปี</li>":""}
      ${A.edm.risk<.35&&featOr(st.ontime)>=.7&&featOr(st.evidence)>=.8?"<li>ยังไม่พบปัจจัยเสี่ยงที่ต้องดำเนินการเป็นพิเศษ ให้ติดตามตามรอบปกติ</li>":""}
    </ul>`)}</div>`;
}

/* ---------- 16ข. รายงานความก้าวหน้ารายบุคคล ---------- */
function scoreFromResp(resp,comp,y){
  const v=indsOf(FW,y,comp.id).map(i=>resp[i.id]).filter(x=>x!==undefined);
  return v.length?mean(v):null;
}
function progressPage(){
  const stu=filteredStudents();
  if(!stu.length) return card("ความก้าวหน้ารายบุคคล","",`<div class="empty">ยังไม่มีนักศึกษาในระบบ</div>`);
  if(S.role==="Student"){ const me=userById(S.user.linkTo||S.user.id); S.prgSid=me?me.id:stu[0].id; }
  if(!S.prgSid||!userById(S.prgSid)) S.prgSid=stu[0].id;
  const st=userById(S.prgSid), y=st.year, comps=activeComps(FW,y);
  const rounds=HIST[st.id]||[];
  const sel=S.role==="Student"?"":`<div class="field" style="margin-top:0"><label>นักศึกษา</label>
    <select class="inp" data-act="prgsid">${stu.map(x=>`<option value="${x.id}" ${x.id===S.prgSid?"selected":""}>${x.program} ปี ${x.year} · ${esc(x.code)} · ${esc(x.name)}</option>`).join("")}</select></div>`;

  /* ชั้นปีที่ผู้ดูแลปิดสมรรถนะไว้ทั้งหมด จะไม่มีเป้าหมายให้เฉลี่ย รายงานจึงคำนวณไม่ได้
     ต้องดักไว้ก่อน มิฉะนั้นค่าเฉลี่ยเป็น null แล้วพังตอนจัดรูปแบบตัวเลข */
  if(!comps.length) return `<div class="stack">${card("ความก้าวหน้ารายบุคคล",esc(st.name),
    `${sel}<div class="empty">${esc(yearOf(FW,y).label)}ยังไม่ได้เปิดใช้สมรรถนะใด
      รายงานจะแสดงเมื่อผู้ดูแลระบบเปิดใช้สมรรถนะในเมนูกรอบสมรรถนะรายชั้นปี</div>`)}</div>`;

  if(!rounds.length) return `<div class="stack">${card("ความก้าวหน้ารายบุคคล",esc(st.name),
    `${sel}<div class="empty">ยังไม่มีผลการประเมินของผู้เรียนรายนี้ รายงานจะแสดงเมื่อมีการบันทึกผลอย่างน้อยหนึ่งรอบ</div>`)}</div>`;

  /* คะแนนเฉลี่ยรวมและระดับในแต่ละรอบ */
  const series=rounds.map(r=>{
    const v=comps.map(c=>compScoreAvg(FW,st.id,c,y,r).v).filter(x=>x!==null);
    return v.length?mean(v):0;
  });
  const cur=series[series.length-1], first=series[0];
  const curLv=clamp(Math.round(cur),1,FW.levels.length);
  const gain=cur-first;
  const targetAvg=mean(comps.map(c=>cfgOf(FW,y,c.id).target));

  /* การกระจายจำนวนสมรรถนะตามระดับ ในแต่ละรอบ */
  const dist=rounds.map(r=>{
    const cnt=new Array(FW.levels.length).fill(0);
    comps.forEach(c=>{ const v=compScoreAvg(FW,st.id,c,y,r).v; if(v!==null) cnt[clamp(Math.round(v),1,FW.levels.length)-1]++; });
    return cnt;
  });
  const distRows=rounds.map((r,i)=>`<tr><td style="width:120px">${r.label}<div class="sub">${r.when}</div></td>
    <td>${stackBar(dist[i],comps.length)}</td>
    <td class="num" style="width:96px">${fmt(series[i])}</td>
    <td style="width:150px">${levelChip(series[i])}</td></tr>`).join("");

  /* ตารางรายสมรรถนะ */
  const rows=comps.map((c,k)=>{
    const vals=rounds.map(r=>compScoreAvg(FW,st.id,c,y,r).v);
    const last=vals[vals.length-1], f=vals[0], t=cfgOf(FW,y,c.id).target;
    const d=(last===null||f===null)?null:last-f;
    const arrow=d===null?"—":(d>0.05?"▲":d<-0.05?"▼":"▬");
    const col=d===null?"var(--muted)":(d>0.05?"var(--ok)":d<-0.05?"var(--risk)":"var(--muted)");
    return `<tr><td class="sub">${k+1}</td>
      <td style="font-size:.82rem">${esc(c.th)}<div class="sub">${c.code}</div></td>
      ${vals.map(v=>`<td class="num">${fmt(v,1)}</td>`).join("")}
      <td class="num delta" style="color:${col}">${arrow} ${d===null?"":(d>0?"+":"")+d.toFixed(1)}</td>
      <td>${levelChip(last)}</td><td class="num">${t}</td>
      <td>${last===null?`<span class="tag tag-n">ไม่มีข้อมูล</span>`:
        `<span class="tag ${last>=t?"tag-ok":last>=t-.5?"tag-warn":"tag-risk"}">${last>=t?"ถึงเป้าหมาย":last>=t-.5?"ใกล้เป้าหมาย":"ต้องพัฒนา"}</span>`}</td></tr>`;
  }).join("");

  /* สิ่งที่ต้องทำเพื่อขึ้นระดับถัดไป */
  const nextLv=Math.min(curLv+1,FW.levels.length);
  const behind=comps.map(c=>({c,v:compScoreAvg(FW,st.id,c,y,rounds[rounds.length-1]).v,t:cfgOf(FW,y,c.id).target}))

  const nextDesc=(cid)=>{
    const inds=indsOf(FW,y,cid); if(!inds.length) return "";
    const d=inds[0].descriptors[nextLv-1]; return d?esc(d):"";
  };
  const todo=behind.length?behind.map(x=>`<div style="border-left:3px solid var(--accent);padding-left:.8rem;margin-bottom:.7rem">
      <div style="font-weight:500;font-size:.9rem">${esc(x.c.th)}</div>

      <p style="font-size:.82rem;color:var(--muted);margin-top:.15rem">เกณฑ์ระดับถัดไป: ${nextDesc(x.c.id)}</p></div>`).join("")

  const trend = gain>0.15?"ก้าวหน้าขึ้น":gain<-0.15?"ลดลง":"คงที่";
  const trendTag = gain>0.15?"tag-ok":gain<-0.15?"tag-risk":"tag-warn";

  /* นักศึกษาเห็นเฉพาะของตนเอง จึงไม่ต้องมีตัวกรองชั้นปีและสาขา */
  return `<div class="stack">${S.role==="Student"?"":filterBar()}
    ${card("รายงานความก้าวหน้ารายบุคคล","",
      `${studentChip(st,`${rounds.length} รอบการประเมิน · ภาคการศึกษา ${(typeof LIVE_CFG!=="undefined"&&LIVE_CFG.term)||"1/2569"}`)}
       <div class="grid g4" style="gap:.7rem;align-items:end;margin-top:.9rem">${sel}
        ${stat("ระดับปัจจุบัน","ระดับที่ "+curLv,FW.levels[curLv-1].th+" · "+FW.levels[curLv-1].en)}
        ${stat("คะแนนเฉลี่ยล่าสุด",fmt(cur),`เป้าหมายเฉลี่ยของชั้นปี ${fmt(targetAvg,1)}`)}
        ${stat("การเปลี่ยนแปลงจากรอบแรก",(gain>=0?"+":"")+fmt(gain),`<span class="tag ${trendTag}">${trend}</span>`)}</div>`)}

    ${card("บันไดการเติบโตของสมรรถนะ · PTRU Competency Staircase",
      "ตำแหน่งบนเส้นทางพัฒนาสมรรถนะ · ระดับคำนวณจากคะแนนเฉลี่ยของสมรรถนะที่เปิดใช้ในชั้นปีนี้",
      `<p class="hint" style="margin:0 0 .5rem">ขณะนี้ยืนอยู่ที่
         <b>ขั้นที่ ${curLv} · ${esc(FW.levels[curLv-1].th)} · ${esc(FW.levels[curLv-1].en)}</b>
         คะแนนเฉลี่ย ${fmt(cur)} จาก ${FW.levels.length} ขั้น
         · เป้าหมายของชั้นปีที่ ${y} คือขั้นที่ ${stairStep(targetAvg)}${
           curLv<FW.levels.length
             ? ` · อีก ${fmt(Math.max(0,curLv+.5-cur))} คะแนนจะไต่ขึ้นขั้นที่ ${curLv+1}`
             : " · อยู่ขั้นสูงสุดของบันไดแล้ว"}</p>
       ${staircase(cur,curLv,targetAvg)}
       <h4 style="margin:1.4rem 0 .5rem;font-size:.92rem">ความหมายของการไต่ขั้น</h4>
       ${stairMeaning(curLv,targetAvg)}
       <p class="hint" style="margin-top:.8rem">
        ระดับที่แสดงเป็นภาพรวม ผู้เรียนอาจอยู่คนละระดับในแต่ละสมรรถนะ ดูรายละเอียดได้ในตารางด้านล่าง</p>`)}

    ${card("เปรียบเทียบสมรรถนะรายด้านด้วยแผนภาพเรดาร์",
      "แกนคือลำดับสมรรถนะทั้ง "+comps.length+" ด้าน · เส้นประสีทองคือระดับเป้าหมายของชั้นปี · ชี้ที่จุดเพื่อดูชื่อสมรรถนะ",
      radarMultiSVG(
        comps.map((c,k)=>String(k+1)),
        [{name:rounds[0].label+" (ต้นภาค)",color:"var(--c6)",values:comps.map(c=>compScoreAvg(FW,st.id,c,y,rounds[0]).v)},
         {name:rounds[rounds.length-1].label+" (ล่าสุด)",color:"var(--c1)",values:comps.map(c=>compScoreAvg(FW,st.id,c,y,rounds[rounds.length-1]).v)},
         {name:"ระดับเป้าหมาย",color:"var(--accent)",values:comps.map(c=>cfgOf(FW,y,c.id).target),fill:false,dots:false,dash:"5 4",w:2}],
        FW.levels.length, comps.map(c=>c.th)))}

    ${card("คะแนนรายสมรรถนะเปรียบเทียบทุกรอบ",
      "แท่งเรียงจากรอบแรกไปรอบล่าสุด · ขีดสีทองคือระดับเป้าหมาย · ตัวเลขท้ายแท่งคือคะแนนรอบล่าสุด",
      groupBarSVG(

      ${card("การกระจายของสมรรถนะตามระดับ","ตัวเลขในแถบคือจำนวนสมรรถนะที่อยู่ในระดับนั้น",
        `<table class="tight"><tbody>${distRows}</tbody></table>
         <div class="legend">${FW.levels.map((l,k)=>`<span><i style="background:var(--l${k+1})"></i>ระดับ ${k+1} ${esc(l.th)}</span>`).join("")}</div>`)}

/** ที่มาของข้อมูลในรายงาน แสดงระเบียนการประเมินที่บันทึกไว้จริง
    ผู้อ่านรายงานตรวจสอบได้ว่าคะแนนแต่ละรอบมาจากใคร ประเมินเมื่อใด และครอบคลุมกี่ตัวชี้วัด */
function progressAudit(st){
  const recs=assessRecords(st.id);
  if(!recs.length) return card("ที่มาของผลการประเมิน","",
    `<div class="empty">ยังไม่มีระเบียนการประเมินของผู้เรียนรายนี้</div>`,"",false);

  /* สรุปรายรอบ แยกตามฝ่ายผู้ประเมิน */
  const byRound={};
  recs.forEach(r=>{
    const k=r.round;
    const R=byRound[k]=byRound[k]||{label:r.roundLabel,dates:new Set(),raters:{}};
    if(r.date) R.dates.add(r.date);
    const t=R.raters[r.kind]=R.raters[r.kind]||{by:new Set(),comps:0,items:0,sum:0,n:0};
    t.by.add(r.by); t.comps++; t.items+=r.nItems||0; t.sum+=r.v; t.n++;
  });
  const rows=Object.keys(byRound).sort((a,b)=>a-b).map(k=>{
    const R=byRound[k];
    const dates=[...R.dates].sort();
    const cells=RATERS.map(rt=>{
      const t=R.raters[rt.type];
      if(!t) return `<td class="sub" style="font-size:.8rem">— ยังไม่ประเมิน —</td>`;
      return `<td style="font-size:.8rem">${esc([...t.by].join(", "))}
        <div class="sub">${t.comps} สมรรถนะ · เฉลี่ย ${fmt(t.sum/t.n)}</div></td>`;
    }).join("");
    return `<tr><td style="white-space:nowrap">${esc(R.label)}
      <div class="sub">${dates.length?esc(dates[0]+(dates.length>1?" ถึง "+dates[dates.length-1]:"")):"ไม่ระบุวันที่"}</div></td>
      ${cells}</tr>`;
  }).join("");

  return card("ที่มาของผลการประเมิน",
    `ระเบียนจริง ${recs.length} รายการ จากชีต Assessments · ระบุผู้ประเมินและวันที่ประเมินทุกรายการ`,
    `<div class="scroll-x"><table class="tight" style="min-width:780px"><thead><tr>
      <th>รอบการประเมิน</th>${RATERS.map(r=>`<th>${esc(r.label)}</th>`).join("")}
    </tr></thead><tbody>${rows}</tbody></table></div>`,"",false);
}

/* ============================================================
   โปรไฟล์ผู้ใช้: ข้อมูลส่วนตัว ความปลอดภัย ประวัติการประเมิน คู่มือ
   ============================================================ */
function myUser(){ return userById(S.user.linkTo||S.user.id)||S.user; }

/** ระเบียนการประเมินของนักศึกษาหนึ่งคน สังเคราะห์จากผลที่บันทึกไว้แต่ละรอบ */
/** ระเบียนการประเมินที่บันทึกไว้จริงของนักศึกษาหนึ่งคน
    อ่านจาก ASSESS_LOG ซึ่งมาจากชีต Assessments โดยตรง
    แต่ละรายการมีผู้ประเมิน วันที่ประเมิน รอบ และประเภทการประเมินกำกับครบ
    คะแนนคำนวณจากตัวชี้วัดที่ผู้ประเมินรายนั้นให้ไว้จริงในรอบนั้น */
function assessRecords(sid){
  const st=userById(sid); if(!st) return [];
  const y=st.year;
  const rounds=HIST[sid]||[];
  const typeLabel=Object.fromEntries(ASSESS_TYPES);
  return (ASSESS_LOG[sid]||[]).map(a=>{
    const c=FW.competencies.find(x=>x.id===a.comp_id); if(!c) return null;
    const rater=raterByType(a.type); if(!rater) return null;
    const ri=rounds.findIndex(r=>String(r.no||0)===String(a.round_no));
    const round=ri>=0?rounds[ri]:null;
    const v=compScoreBy(FW,sid,c,y,rater.key,round?round[rater.key]:null);
    if(v===null) return null;
    const by=(a.assessor_id&&userById(a.assessor_id))||null;
    return {sid,student:st.name,round:ri>=0?ri:(Number(a.round_no)||1)-1,
      roundLabel:round?round.label:("ครั้งที่ "+(a.round_no||1)),
      when:round?round.when:"", date:a.date||"",
      comp:c, v, kind:a.type, type:typeLabel[a.type]||a.type,
      target:cfgOf(FW,y,c.id).target,
      by:by?by.name:(a.assessor_name||rater.label),
      byId:a.assessor_id||"", byRole:a.assessor_role||"",
      assessId:a.assess_id||"", nItems:a.n_items||0};
  }).filter(Boolean).sort((x,z)=>(x.round-z.round)||String(x.comp.code).localeCompare(String(z.comp.code)));
}

/** ข้อความกำกับเอกสาร ใช้ท้ายรายงานทุกฉบับ
    ระบุเวอร์ชันกรอบสมรรถนะ วันที่ออกเอกสาร และผู้สั่งพิมพ์ เพื่อให้ตรวจสอบย้อนหลังได้ */
function docStamp(extra){
  const bits=[
    "กรอบสมรรถนะเวอร์ชัน "+esc(FW.version||"—"),
    FW.updatedAt?("ปรับปรุงกรอบล่าสุด "+esc(String(FW.updatedAt).slice(0,10))):"",
    "ออกเอกสาร "+new Date().toISOString().slice(0,10),
    S.user?("โดย "+esc(S.user.name)+(S.role?" ("+(ROLE_TH[S.role]||S.role)+")":"")):"",
    extra||""
  ].filter(Boolean);
  return bits.join(" · ");
}

function pfHead(u){
  const init=esc((u.name||"?").trim().charAt(0));
  const roleLb=u.roles.map(r=>ROLE_TH[r]||r).join(" · ");
  const bits=[];
  if(u.code) bits.push("รหัส "+esc(u.code));
  if(u.program) bits.push(u.program+" "+esc(progName(u.program)));
  if(u.year) bits.push("ชั้นปีที่ "+u.year);
  if(u.school) bits.push(esc(u.school));
  return `<div class="pfhead">
    <div class="avatar${u.photo?" hasimg":""}">${u.photo?`<img src="${esc(photoSrc(u.photo))}" alt="รูปประจำตัวของ ${esc(u.name)}" onerror="this.remove()">`:init}</div>
    <div class="pfmeta"><div class="pfname">${esc(u.name)}</div>
      <div class="pfrole"><span class="tag tag-a">${roleLb}</span>
        <span class="tag ${u.status==="active"?"tag-ok":"tag-warn"}">${u.status==="active"?"ใช้งานอยู่":"ระงับ"}</span></div>
      <div class="pfsub">${bits.join(" · ")}</div>

      <button class="btn btn-ghost btn-sm" data-act="gotoprofile" data-v="security">เปลี่ยนรหัสผ่าน</button>
      <button class="btn btn-ghost btn-sm" data-act="gotoprofile" data-v="history">ประวัติการประเมิน</button>
      <button class="btn btn-ghost btn-sm" data-act="gotoprofile" data-v="manual">คู่มือการประเมิน</button>
    </div></div>`;

/* บทบาทที่ทำหน้าที่ประเมิน จึงควรเห็นความสอดคล้องของตนเองเทียบกับผู้ประเมินฝ่ายอื่น */
const RATER_ROLES=["Lecturer","MajorAdvisor","Mentor","Director"];
function profilePage(){
  const u=myUser();
  const isRater=RATER_ROLES.includes(S.role);
  const list=[["info","ข้อมูลส่วนตัว"],["security","ความปลอดภัย"],["history","ประวัติการประเมิน"]]
    .concat(isRater?[["irr","ความสอดคล้องของผู้ประเมิน"]]:[])
    .concat([["manual","คู่มือการประเมินสมรรถนะ"],["docs","เอกสารและการแจ้งเตือน"]]);
  if(!list.some(([k])=>k===S.pfTab)) S.pfTab="info";
  const tabs=list.map(([k,l])=>`<button class="${S.pfTab===k?"on":""}" data-act="pftab" data-v="${k}">${l}</button>`).join("");
  let body="";
  if(S.pfTab==="security") body=pfSecurity(u);
  else if(S.pfTab==="history") body=pfHistory(u);
  else if(S.pfTab==="irr") body=pfRaterIRR(u);
  else if(S.pfTab==="manual") body=pfManual(u);
  else if(S.pfTab==="docs") body=pfDocs(u);
  else body=pfInfo(u);
  return `<div class="stack">${pfHead(u)}
    ${S.pfMsg?`<div class="alert alert-ok" style="margin-top:0">${esc(S.pfMsg)}</div>`:""}
    <div class="tabs">${tabs}</div>${body}</div>`;
}

      ${editable}<label for="pf_grp">กลุ่มสาระที่สอน</label><select class="inp" id="pf_grp">${SUBJECT_GROUPS.map(x=>`<option ${u.group===x?"selected":""}>${x}</option>`).join("")}</select></div>
      ${editable}<label for="pf_lvl">ระดับชั้นที่สอน</label><select class="inp" id="pf_lvl">${TEACH_LEVELS.map(x=>`<option ${u.teachLevel===x?"selected":""}>${x}</option>`).join("")}</select></div>
      ${editable}<label for="pf_exp">ประสบการณ์การสอน (ปี)</label><input class="inp" id="pf_exp" type="number" min="0" max="50" value="${esc(u.exp||"")}" data-nore></div>`;
  rows+=`</div>`;
  const err=S.pfErr?`<div class="alert alert-err">${esc(S.pfErr)}</div>`:"";
  const live=(typeof liveOn==="function")&&liveOn();

/* ---------- ประวัติการประเมิน ---------- */
function pfHistory(u){
  const isStu=u.roles.includes("Student");
  if(isStu){
    const recs=assessRecords(u.id);
    if(!recs.length) return card("ประวัติการประเมิน","",`<div class="empty">ยังไม่มีผลการประเมินที่บันทึกไว้</div>`);
    const y=u.year, comps=activeComps(FW,y);
    const rounds=HIST[u.id]||[];
    const sum=rounds.map((r,ri)=>{
      const v=comps.map(c=>compScoreAvg(FW,u.id,c,y,r).v).filter(x=>x!==null);
      const av=v.length?mean(v):null;
      const onT=comps.filter(c=>{const x=compScoreAvg(FW,u.id,c,y,r).v;return x!==null&&x>=cfgOf(FW,y,c.id).target;}).length;
      return `<tr><td>${r.label}<div class="sub">${r.when} · ${ROUND_DATES[ri]||""}</div></td>
        <td class="num">${fmt(av)}</td><td>${levelChip(av)}</td>
        <td class="num">${onT} / ${comps.length}</td>
        <td class="num">${recs.filter(x=>x.round===ri).length} รายการ</td></tr>`;}).join("");
    const flt=S.histRound;
    const list=recs.filter(x=>flt==="all"||String(x.round)===flt)
      .map(x=>`<tr><td style="font-size:.8rem">${esc(x.comp.th)}<div class="sub">${x.comp.code}</div></td>
        <td style="font-size:.8rem">${esc(x.type)}<div class="sub">${esc(x.by)}</div></td>
        <td style="font-size:.8rem">${esc(x.roundLabel)}<div class="sub">${x.date}</div></td>
        <td class="num">${fmt(x.v,1)}</td><td class="num">${x.target}</td>
        <td><span class="tag ${x.v>=x.target?"tag-ok":x.v>=x.target-.5?"tag-warn":"tag-risk"}">${x.v>=x.target?"ถึงเป้าหมาย":x.v>=x.target-.5?"ใกล้เป้าหมาย":"ต้องพัฒนา"}</span></td></tr>`).join("");
    const pills=[["all","ทุกรอบ"]].concat(rounds.map((r,i)=>[String(i),r.label]))
      .map(([k,l])=>`<button class="${flt===k?"on":""}" data-act="histround" data-v="${k}">${l}</button>`).join("");
    return `<div class="stack">
      ${card("สรุปรายรอบการประเมิน","จำนวนสมรรถนะที่ถึงระดับเป้าหมายของชั้นปีในแต่ละรอบ",
        `<table class="tight"><thead><tr><th>รอบ</th><th class="num">เฉลี่ย</th><th>ระดับ</th><th class="num">ถึงเป้าหมาย</th><th class="num">ระเบียน</th></tr></thead><tbody>${sum}</tbody></table>`,"",false)}
      ${card("ระเบียนการประเมินรายรายการ",`ทั้งหมด ${recs.length} รายการ`,
        `<div class="card-b" style="border-bottom:1px solid var(--line-soft)"><div class="pills">${pills}</div></div>
         <div class="scroll-y"><table class="tight"><thead><tr><th>สมรรถนะ</th><th>ประเภท / ผู้ประเมิน</th><th>รอบ</th><th class="num">ระดับ</th><th class="num">เป้าหมาย</th><th>ผล</th></tr></thead><tbody>${list}</tbody></table></div>`,
        `<button class="btn btn-ghost btn-sm" data-act="noop">ส่งออกเป็น Excel</button>`,false)}
      <div class="notebox">ระเบียนนี้สังเคราะห์จากข้อมูลจำลองเพื่อสาธิตโครงสร้าง ระบบจริงต้องบันทึกผู้ประเมิน วันเวลา และเวอร์ชันเกณฑ์ของทุกรายการ
        เพื่อให้ตรวจสอบย้อนหลังและอุทธรณ์ผลได้</div></div>`;
  }
  /* อาจารย์และครูพี่เลี้ยง: ประวัติที่ตนเองเป็นผู้ประเมิน */
  const kind=u.roles.includes("Mentor")?"mentor":"lecturer";
  const kindTh=kind==="mentor"?"ประเมินโดยครูพี่เลี้ยง":"ประเมินโดยอาจารย์นิเทศก์";
  const all=visStudents().flatMap(s=>assessRecords(s.id)).filter(x=>x.kind===kind);
  if(!all.length) return card("ประวัติการประเมินที่ท่านบันทึก","",`<div class="empty">ยังไม่มีระเบียนการประเมินในขอบเขตของท่าน</div>`);
  const byStu={};
  all.forEach(x=>{ (byStu[x.sid]=byStu[x.sid]||[]).push(x); });
  const sumRows=Object.entries(byStu).map(([sid,rs])=>{
    const st=userById(sid);
    return `<tr><td>${esc(st.name)}<div class="sub">${esc(st.code)} · ${st.program} · ปี ${st.year}</div></td>
      <td class="num">${rs.length}</td><td class="num">${fmt(mean(rs.map(r=>r.v)),2)}</td>
      <td class="num">${rs.filter(r=>r.v>=r.target).length} / ${rs.length}</td>
      <td class="num">${rs.map(r=>r.date).sort().slice(-1)[0]}</td></tr>`;}).join("");
  const recent=all.slice().sort((a,b)=>b.date<a.date?-1:1).slice(0,40)
    .map(x=>`<tr><td style="font-size:.8rem">${esc(x.student)}</td>
      <td style="font-size:.8rem">${esc(x.comp.th)}<div class="sub">${x.comp.code}</div></td>
      <td style="font-size:.8rem">${esc(x.roundLabel)}<div class="sub">${x.date}</div></td>
      <td class="num">${fmt(x.v,1)}</td><td class="num">${x.target}</td></tr>`).join("");
  return `<div class="stack">
    <div class="grid g4">${stat("ระเบียนที่บันทึก",all.length,kindTh)}
      ${stat("นักศึกษาที่ประเมิน",Object.keys(byStu).length,scopeProgram()?progName(scopeProgram()):"ทุกสาขา")}
      ${stat("ระดับเฉลี่ยที่ให้",fmt(mean(all.map(r=>r.v))))}
      ${stat("ถึงเป้าหมาย",Math.round(all.filter(r=>r.v>=r.target).length/all.length*100)+"%","ของระเบียนทั้งหมด")}</div>
    ${card("สรุปรายนักศึกษา","",
      `<div class="scroll-y"><table class="tight"><thead><tr><th>นักศึกษา</th><th class="num">ระเบียน</th><th class="num">ระดับเฉลี่ย</th><th class="num">ถึงเป้าหมาย</th><th class="num">ประเมินล่าสุด</th></tr></thead><tbody>${sumRows}</tbody></table></div>`,"",false)}
    ${card("ระเบียนล่าสุด","แสดง 40 รายการล่าสุด",
      `<div class="scroll-y"><table class="tight"><thead><tr><th>นักศึกษา</th><th>สมรรถนะ</th><th>รอบ</th><th class="num">ระดับ</th><th class="num">เป้าหมาย</th></tr></thead><tbody>${recent}</tbody></table></div>`,"",false)}
    <div class="notebox">ระบบจริงควรแสดงความสอดคล้องระหว่างผู้ประเมิน (inter-rater reliability) ในหน้านี้ด้วย
      เพื่อให้ผู้ประเมินเห็นว่าตนเองให้คะแนนสูงหรือต่ำกว่าค่ากลางของคณะอย่างเป็นระบบหรือไม่</div></div>`;
}

/* ---------- 17. แดชบอร์ดและหน้าอื่น ---------- */
/* ============================================================
   ชั้นวิเคราะห์รายบุคคล (Personalized analytics)
   รวมผลจากทุกแหล่งที่ระบบมีจริง คือคะแนนรายฝ่าย พัฒนาการรายรอบ ผลการวัดเชิงจิตมิติ
   ผลสอบวัดสมรรถนะ และแฟ้มสะสมงาน แล้วสรุปเป็นข้อมูลชุดเดียวให้ทุกหน้าใช้ร่วมกัน
   ทุกตัวเลขคำนวณจากข้อมูลที่บันทึกไว้จริง ไม่มีค่าที่กำหนดไว้ล่วงหน้า
   ============================================================ */
function personalize(sid){
  const st=userById(sid); if(!st) return null;
  const y=st.year, comps=activeComps(FW,y);
  if(!comps.length) return null;
  const rounds=HIST[sid]||[];
  const A=analyze(FW,sid,{cdm:true});

  /* รายสมรรถนะ พร้อมคะแนนรายฝ่าย ส่วนต่างจากเป้าหมาย และแนวโน้มข้ามรอบ */
  const items=comps.map(c=>{
    const p=compScoreParts(FW,sid,c,y);
    const t=cfgOf(FW,y,c.id).target;
    const series=rounds.map(r=>compScoreParts(FW,sid,c,y,r).v);
    const seen=series.filter(v=>v!==null);
    return {c,parts:p,v:p.v,t,gap:p.v===null?null:p.v-t,series,
      trend:seen.length>1?seen[seen.length-1]-seen[0]:null};
  });
  const withV=items.filter(x=>x.v!==null);
  const overall=withV.length?mean(withV.map(x=>x.v)):null;
  const onTarget=withV.filter(x=>x.v>=x.t).length;
  const strengths=[...withV].sort((a,b)=>b.gap-a.gap).slice(0,3);
  const gaps=[...withV].filter(x=>x.gap<0).sort((a,b)=>a.gap-b.gap).slice(0,4);
  const declining=withV.filter(x=>x.trend!==null&&x.trend<-0.15)
    .sort((a,b)=>a.trend-b.trend).slice(0,3);

  /* พัฒนาการรวมรายรอบ */
  const series=rounds.map(r=>{
    const v=comps.map(c=>compScoreParts(FW,sid,c,y,r).v).filter(x=>x!==null);
    return v.length?mean(v):null;
  });
  const seenS=series.filter(v=>v!==null);
  const growth=seenS.length>1?seenS[seenS.length-1]-seenS[0]:null;
  const perRound=seenS.length>1?growth/(seenS.length-1):null;
  const targetAvg=mean(comps.map(c=>cfgOf(FW,y,c.id).target));

  /* การรู้จักตนเอง เทียบคะแนนที่ประเมินตนเองกับค่าเฉลี่ยของผู้ประเมินภายนอก */
  const selfV=withV.map(x=>x.parts.byGroup.self).filter(v=>v!==null);
  const extV=withV.map(x=>{
    const g=[x.parts.byGroup.advisor,x.parts.byGroup.mentor].filter(v=>v!==null);
    return g.length?mean(g):null;
  }).filter(v=>v!==null);
  const selfGap=(selfV.length&&extV.length)?mean(selfV)-mean(extV):null;

  /* ผลสอบวัดสมรรถนะและแฟ้มสะสมงาน */
  const openTests=comps.filter(c=>(cfgOf(FW,y,c.id).test||{open:true}).open!==false);
  const examOf=cid=>EXAM_RESULTS.filter(r=>r.sid===sid&&r.comp===cid).slice(-1)[0]||null;
  const examDone=openTests.filter(c=>examOf(c.id)).length;
  const examTheta=openTests.map(c=>examOf(c.id)).filter(Boolean).map(r=>Number(r.theta));
  const myEv=EVIDENCE.filter(e=>!e.student||e.student===sid);
  const evPending=myEv.filter(e=>String(e.status||"pending")==="pending").length;
  const evVerified=myEv.filter(e=>e.status==="verified").length;

  /* จุดที่ยังไม่รอบรู้ตามแบบจำลอง G-DINA เรียงจากความน่าจะเป็นต่ำสุด */
  const notMastered=(A&&A.gdina)?comps.map((c,k)=>({c,p:A.gdina.marginal[k]}))
    .filter(o=>o.p<0.7).sort((a,b)=>a.p-b.p).slice(0,3):[];

  /* มิติที่อ่อนที่สุดตามแบบจำลอง MIRT ใช้ยืนยันผลจากคะแนนดิบอีกทาง */
  const weakDims=(A&&A.mirt)?A.mirt.filter(m=>m.est&&m.raw!==null)
    .sort((a,b)=>a.est.theta-b.est.theta).slice(0,3):[];

  /* สัญญาณเตือน เรียงตามความเร่งด่วน */
  const alerts=[];
  const risk=A?A.edm.risk:0;
  if(risk>=0.6) alerts.push({lv:"risk",t:"ความเสี่ยงไม่ผ่านเกณฑ์สูง",
    d:`แบบจำลองประเมินความเสี่ยงที่ ${Math.round(risk*100)}% ควรนัดหมายอาจารย์นิเทศก์ทบทวนแผนโดยเร็ว`});
  else if(risk>=0.35) alerts.push({lv:"warn",t:"ต้องเฝ้าระวัง",
    d:`ความเสี่ยงที่ ${Math.round(risk*100)}% ยังแก้ไขได้ทันหากเริ่มปรับตั้งแต่ตอนนี้`});
  if(gaps.length) alerts.push({lv:gaps.length>=comps.length/3?"risk":"warn",
    t:`ยังไม่ถึงเป้าหมาย ${gaps.length} สมรรถนะ`,
    d:`ห่างมากที่สุดคือ ${esc(gaps[0].c.th)} (ขาดอีก ${Math.abs(gaps[0].gap).toFixed(2)} ระดับ)`});
  if(declining.length) alerts.push({lv:"warn",t:`คะแนนลดลง ${declining.length} สมรรถนะ`,
    d:`ลดมากที่สุดคือ ${esc(declining[0].c.th)} (${declining[0].trend.toFixed(2)} ระดับจากรอบแรก)`});
  if(selfGap!==null&&selfGap>=0.5) alerts.push({lv:"warn",t:"ประเมินตนเองสูงกว่าผู้ประเมินภายนอก",
    d:`สูงกว่าเฉลี่ย ${selfGap.toFixed(2)} ระดับ ควรทบทวนเกณฑ์ร่วมกับอาจารย์นิเทศก์เพื่อปรับมุมมอง`});
  if(selfGap!==null&&selfGap<=-0.5) alerts.push({lv:"warn",t:"ประเมินตนเองต่ำกว่าผู้ประเมินภายนอก",
    d:`ต่ำกว่าเฉลี่ย ${Math.abs(selfGap).toFixed(2)} ระดับ ผู้ประเมินเห็นความสามารถของท่านสูงกว่าที่ท่านประเมิน`});
  if(openTests.length&&examDone<openTests.length) alerts.push({lv:"info",
    t:`แบบทดสอบค้าง ${openTests.length-examDone} ชุด`,d:`ทำแล้ว ${examDone} จาก ${openTests.length} ชุด`});
  if(evPending) alerts.push({lv:"info",t:`หลักฐานรอตรวจสอบ ${evPending} รายการ`,
    d:"ความครบถ้วนของแฟ้มสะสมงานเป็นตัวแปรหนึ่งในแบบจำลองทำนายความเสี่ยง"});
  if(!alerts.length) alerts.push({lv:"ok",t:"ไม่พบสัญญาณที่ต้องเฝ้าระวัง",
    d:"ทุกสมรรถนะถึงระดับเป้าหมายและแนวโน้มเป็นบวก"});

  return {st,y,comps,rounds,A,items,withV,overall,onTarget,targetAvg,
    strengths,gaps,declining,series,growth,perRound,selfGap,
    openTests,examDone,examTheta,myEv,evPending,evVerified,
    notMastered,weakDims,alerts,risk,
    level:overall===null?null:clamp(Math.round(overall),1,FW.levels.length)};
}

/** เกณฑ์ระดับถัดไปของสมรรถนะหนึ่ง ใช้เป็นเป้าหมายที่จับต้องได้ในข้อเสนอแนะ */
function nextLevelDescriptor(y,cid,level){
  const inds=indsOf(FW,y,cid); if(!inds.length) return "";
  const k=clamp(level,1,FW.levels.length)-1;
  return inds[0].descriptors[k]||"";
}

/** เส้นทางการเรียนรู้รายบุคคล สร้างจากช่องว่างสมรรถนะจริงของผู้เรียน
    แต่ละระยะผูกกับสมรรถนะที่ระบุชื่อได้ และมีเกณฑ์ระดับถัดไปเป็นหลักฐานความสำเร็จ */
function personalPath(P){
  if(!P) return [];
  const g=P.gaps, y=P.y;
  const nx=o=>Math.min(Math.ceil(o.t),FW.levels.length);
  const phases=[
    {n:"ระยะที่ 1 · สัปดาห์ที่ 1–2",head:"ตั้งฐานและปรับความเข้าใจเกณฑ์",
     items:[
       P.selfGap!==null&&Math.abs(P.selfGap)>=0.4
         ? `ทบทวนเกณฑ์การประเมินร่วมกับอาจารย์นิเทศก์ เพราะการประเมินตนเอง${P.selfGap>0?"สูง":"ต่ำ"}กว่าผู้ประเมินภายนอก ${Math.abs(P.selfGap).toFixed(2)} ระดับ`
         : "ยืนยันความเข้าใจเกณฑ์กับอาจารย์นิเทศก์ให้ตรงกันก่อนเริ่มแผน",
       P.evPending?`ติดตามหลักฐาน ${P.evPending} รายการที่รอตรวจสอบให้ได้ข้อสรุป`
                  :"ตรวจความครบถ้วนของหลักฐานในแฟ้มสะสมงานเทียบกับเกณฑ์ของชั้นปี",
       "บันทึกสะท้อนคิดสัปดาห์ละครั้ง ระบุสิ่งที่ทำได้และสิ่งที่ยังติดขัด"]},
  ];
  if(g.length) phases.push({n:"ระยะที่ 2 · สัปดาห์ที่ 3–6",
    head:"ยกระดับสมรรถนะที่ห่างเป้าหมายมากที่สุด",
    items:g.slice(0,2).map(o=>{
      const d=nextLevelDescriptor(y,o.c.id,nx(o));
      return `<b>${esc(o.c.th)}</b> ปัจจุบัน ${fmt(o.v)} เป้าหมาย ${o.t}
        ${d?`<br><span class="sub">เกณฑ์ระดับ ${nx(o)}: ${esc(d)}</span>`:""}`;
    }).concat(["ขอรับการนิเทศเฉพาะจุดจากครูพี่เลี้ยงอย่างน้อย 2 ครั้งในสองสมรรถนะนี้"])});
  if(g.length>2) phases.push({n:"ระยะที่ 3 · สัปดาห์ที่ 7–10",
    head:"ขยายผลไปยังสมรรถนะที่เหลือ",
    items:g.slice(2).map(o=>`<b>${esc(o.c.th)}</b> ฝึกปฏิบัติในชั้นเรียนจริงและเก็บหลักฐานประกอบ (ขาดอีก ${Math.abs(o.gap).toFixed(2)} ระดับ)`)
      .concat(["เข้าร่วม PLC ของกลุ่มสาระเพื่อแลกเปลี่ยนแนวปฏิบัติ"])});
  else phases.push({n:"ระยะที่ 3 · สัปดาห์ที่ 7–10",head:"ต่อยอดจากจุดแข็ง",
    items:P.strengths.slice(0,2).map(o=>`<b>${esc(o.c.th)}</b> (${fmt(o.v)}) พัฒนาเป็นผลงานเด่นเพื่อเป็นแบบอย่างแก่เพื่อนร่วมรุ่น`)
      .concat(["รับบทบาทพี่เลี้ยงให้เพื่อนในสมรรถนะที่ท่านทำได้ดี"])});
  phases.push({n:"ระยะที่ 4 · สัปดาห์ที่ 11–14",head:"ประเมินซ้ำและสรุปผล",
    items:[
      P.openTests.length>P.examDone?`ทำแบบทดสอบวัดสมรรถนะที่ยังค้างอีก ${P.openTests.length-P.examDone} ชุด`
        :"ทบทวนผลการสอบวัดสมรรถนะเทียบกับผลการประเมินจากผู้ประเมิน",
      "ประเมินตนเองอีกครั้งแล้วเทียบกับผลรอบก่อนหน้า",
      P.risk>=0.5?"นัดหมายทบทวนแผนกับอาจารย์นิเทศก์ก่อนสิ้นภาคเรียน"
                 :"จัดทำรายงานสะท้อนคิดปลายภาคพร้อมหลักฐานที่พัฒนาแล้ว"]});
  return phases;
}

function studentDash(){
  const me=userById(S.user.linkTo||S.user.id)||students()[0];
  const y=me.year, comps=activeComps(FW,y);
  const sc=comps.map(c=>compScore(FW,me.id,c,y));
  const valid=sc.filter(v=>v!==null);
  const ov=valid.length?mean(valid):null;
  const onT=comps.filter((c,i)=>sc[i]!==null&&sc[i]>=cfgOf(FW,y,c.id).target).length;
  const radar=comps.map((c,i)=>({name:c.code.replace("PC-",""),v:sc[i]||0,full:c.th}));
  const myEv=EVIDENCE.filter(e=>!e.student||e.student===me.id);

  /* สมรรถนะที่ยังไม่ถึงระดับเป้าหมาย เรียงจากที่ห่างมากที่สุด ใช้เป็นรายการสิ่งที่ต้องทำจริง */
  const behind=comps.map((c,i)=>({c,v:sc[i],t:cfgOf(FW,y,c.id).target}))
    .filter(x=>x.v!==null&&x.v<x.t).sort((a,b)=>(a.v-a.t)-(b.v-b.t));

  /* แบบทดสอบที่เปิดให้ชั้นปีนี้ และผลล่าสุดของแต่ละสมรรถนะ */
  const openTests=comps.filter(c=>(cfgOf(FW,y,c.id).test||{open:true}).open!==false);
  const doneTest=cid=>EXAM_RESULTS.filter(r=>r.sid===me.id&&r.comp===cid).slice(-1)[0];
  const nDone=openTests.filter(c=>doneTest(c.id)).length;
  const todoTest=openTests.filter(c=>!doneTest(c.id));

  /* พัฒนาการจากรอบการประเมินที่บันทึกไว้จริง */
  const rounds=HIST[me.id]||[];
  const roundAvg=rounds.map(r=>{
    const v=comps.map(c=>compScoreAvg(FW,me.id,c,y,r).v).filter(x=>x!==null);
    return {label:r.label,when:r.when||"",v:v.length?mean(v):null};
  }).filter(x=>x.v!==null);
  const gain=roundAvg.length>1?roundAvg[roundAvg.length-1].v-roundAvg[0].v:null;

  const progressBody=roundAvg.length
    ? `<table class="tight"><thead><tr><th>รอบการประเมิน</th><th class="num">คะแนนเฉลี่ย</th><th>ระดับ</th></tr></thead><tbody>
        ${roundAvg.map(r=>`<tr><td>${esc(r.label)}${r.when?`<div class="sub">${esc(r.when)}</div>`:""}</td>
          <td class="num">${fmt(r.v)}</td><td>${levelChip(r.v)}</td></tr>`).join("")}</tbody></table>
       ${gain===null?"":`<div class="notebox" style="margin-top:.7rem">เทียบรอบแรกกับรอบล่าสุด
         <b style="color:${gain>0.05?"var(--ok)":gain<-0.05?"var(--risk)":"var(--muted)"}">
         ${gain>=0?"+":""}${gain.toFixed(2)}</b> ระดับ</div>`}`
    : `<div class="empty">ยังไม่มีผลการประเมินที่บันทึกไว้</div>`;

  const todoRows=[
    ...behind.slice(0,4).map(x=>`<tr><td>ยกระดับ ${esc(x.c.th)}<div class="sub">ปัจจุบัน ${fmt(x.v)} · เป้าหมาย ${x.t}</div></td>
      <td class="num"><span class="tag tag-warn">ต่ำกว่าเป้าหมาย</span></td></tr>`),
    ...(todoTest.length?[`<tr><td>ทำแบบทดสอบวัดสมรรถนะที่ยังค้าง<div class="sub">เหลือ ${todoTest.length} จาก ${openTests.length} ชุด</div></td>
      <td class="num"><button class="btn btn-primary btn-sm" data-act="gotoexam" data-v="${todoTest[0].id}">เริ่มทำ</button></td></tr>`]:[]),
    ...(myEv.filter(e=>String(e.status||"pending")==="pending").length
      ? [`<tr><td>ติดตามหลักฐานที่รอการตรวจสอบ<div class="sub">${myEv.filter(e=>String(e.status||"pending")==="pending").length} รายการ</div></td>
          <td class="num"><button class="btn btn-ghost btn-sm" data-act="nav" data-v="portfolio">เปิดแฟ้ม</button></td></tr>`]:[]),
  ].join("");

  return `<div class="stack">${pfHead(me)}
    <div class="grid g4">${stat("ระดับสมรรถนะโดยรวม",fmt(ov),ov?levelOf(FW,ov).th:"ยังไม่มีข้อมูล")}
      ${stat("ถึงระดับเป้าหมาย",`${onT} / ${comps.length}`,`เกณฑ์ของ${yearOf(FW,y).label}`)}
      ${stat("หลักฐานในแฟ้มสะสมงาน",myEv.length,`รอตรวจสอบ ${myEv.filter(e=>String(e.status||"pending")==="pending").length} รายการ`)}
      ${stat("แบบทดสอบที่ทำแล้ว",`${nDone} / ${openTests.length}`,todoTest.length?`เหลืออีก ${todoTest.length} ชุด`:"ครบทุกชุดแล้ว")}</div>
    <div class="grid g2">
      ${card("สมรรถนะรายด้าน","ตัวเลขคือลำดับสมรรถนะตามกรอบ PTRU",radarSVG(radar,5))}
      <div class="stack">
        ${card("พัฒนาการรายรอบ",SCORE_RULE,progressBody,"",false)}
        ${card("สิ่งที่ต้องทำ","สร้างจากผลการประเมินและสถานะจริงของบัญชีท่าน",
          todoRows?`<table><tbody>${todoRows}</tbody></table>`
                 :`<div class="empty">ไม่มีรายการค้าง ทุกสมรรถนะถึงระดับเป้าหมายแล้ว</div>`,"",false)}
      </div></div>
    ${personalBoard(me)}
    <div class="notebox">${docStamp("ผลวิเคราะห์ทั้งหมดคำนวณจากผลการประเมินและผลสอบที่บันทึกไว้จริงของท่าน")}</div>
  </div>`;
}

/* ---------- แผงวิเคราะห์รายบุคคลบนแดชบอร์ดนักศึกษา ---------- */
function personalBoard(me){
  const P=personalize(me.id);
  if(!P) return card("ผลวิเคราะห์รายบุคคล","",
    `<div class="empty">ยังไม่มีผลการประเมินเพียงพอสำหรับวิเคราะห์ ระบบจะแสดงเมื่อมีการบันทึกผลอย่างน้อยหนึ่งรอบ</div>`);

  const lv=P.level?FW.levels[P.level-1]:null;
  const riskLb=P.risk>=.6?"เสี่ยงสูง":P.risk>=.35?"ต้องเฝ้าระวัง":"ความเสี่ยงต่ำ";
  const riskCls=P.risk>=.6?"tag-risk":P.risk>=.35?"tag-warn":"tag-ok";

  /* 👤 Personalized Profile */
  const profile=card("👤 Personalized Profile","ข้อมูลประจำตัวและบริบทที่ใช้ประกอบการวิเคราะห์ทั้งหมด",
    `<table class="tight"><tbody>
      <tr><td style="color:var(--muted);width:150px">ผู้เรียน</td><td>${esc(me.name)} · รหัส ${esc(me.code||"—")}</td></tr>
      <tr><td style="color:var(--muted)">สาขาวิชา / ชั้นปี</td><td>${esc(me.program||"—")} ${esc(progName(me.program))} · ${esc(yearOf(FW,P.y).label)}</td></tr>
      <tr><td style="color:var(--muted)">ระยะการฝึก</td><td>${esc(yearOf(FW,P.y).stage||"—")}${me.school?" · "+esc(me.school):""}</td></tr>
      <tr><td style="color:var(--muted)">สมรรถนะที่ประเมิน</td><td>${P.withV.length} จาก ${P.comps.length} ด้าน · ตัวชี้วัดที่มีผล ${P.A?P.A.nItems:0} รายการ</td></tr>
      <tr><td style="color:var(--muted)">รอบการประเมิน</td><td>${P.rounds.length} รอบ${P.rounds.length?" · ล่าสุด "+esc(P.rounds[P.rounds.length-1].when||P.rounds[P.rounds.length-1].label):""}</td></tr>
      <tr><td style="color:var(--muted)">สถานะความเสี่ยง</td><td><span class="tag ${riskCls}">${riskLb} · ${Math.round(P.risk*100)}%</span></td></tr>
    </tbody></table>`,"",false);

  /* 🎯 Personalized Competency Score */
  const scoreRows=[...P.withV].sort((a,b)=>a.gap-b.gap).map(x=>`<tr>
    <td style="font-size:.82rem">${esc(x.c.th)}<div class="sub">${x.c.code}</div></td>
    ${RATERS.map(r=>`<td class="num" style="font-size:.8rem;${x.parts.byRater[r.key]===null?"color:var(--muted)":""}">${fmt(x.parts.byRater[r.key])}</td>`).join("")}
    <td class="num" style="font-weight:600">${fmt(x.v)}</td><td class="num">${x.t}</td>
    <td class="num" style="font-weight:600;color:${x.gap>=0?"var(--ok)":"var(--risk)"}">${(x.gap>=0?"+":"")+x.gap.toFixed(2)}</td>
  </tr>`).join("");
  const score=card("🎯 Personalized Competency Score",
    `${SCORE_RULE} · เรียงจากด้านที่ห่างเป้าหมายมากที่สุด`,
    `<div class="grid g4" style="margin-bottom:.8rem">
      ${stat("คะแนนรวม",fmt(P.overall),lv?lv.th+" · "+lv.en:"—")}
      ${stat("ถึงเป้าหมาย",`${P.onTarget} / ${P.withV.length}`,`เป้าหมายเฉลี่ย ${fmt(P.targetAvg,1)}`)}
      ${stat("จุดแข็งสูงสุด",P.strengths.length?fmt(P.strengths[0].v):"—",P.strengths.length?esc(P.strengths[0].c.th):"—")}
      ${stat("ต้องพัฒนามากสุด",P.gaps.length?fmt(P.gaps[0].v):"—",P.gaps.length?esc(P.gaps[0].c.th):"ถึงเป้าหมายทุกด้าน")}
     </div>
     <div class="scroll-x"><table class="tight" style="min-width:720px"><thead><tr>
       <th>สมรรถนะ</th>${RATERS.map(r=>`<th class="num" title="${esc(r.label)}">${esc(r.short)}</th>`).join("")}
       <th class="num">รวม</th><th class="num">เป้า</th><th class="num">ส่วนต่าง</th>
     </tr></thead><tbody>${scoreRows}</tbody></table></div>`,"",false);

  /* 📈 Personalized Progress */
  const progRows=P.series.map((v,i)=>`<tr><td>${esc(P.rounds[i].label)}
      <div class="sub">${esc(P.rounds[i].when||"")}</div></td>
    <td class="num">${fmt(v)}</td><td>${levelChip(v)}</td></tr>`).join("");
  const gRate=P.perRound===null?null:P.perRound;
  const progress=card("📈 Personalized Progress",
    "อัตราการเปลี่ยนแปลงคำนวณจากคะแนนรวมของทุกรอบที่บันทึกไว้จริง",
    `<div class="grid g3" style="margin-bottom:.8rem">
      ${stat("การเปลี่ยนแปลงรวม",P.growth===null?"—":(P.growth>=0?"+":"")+P.growth.toFixed(2),
        P.growth===null?"ต้องมีอย่างน้อย 2 รอบ":`จาก ${P.rounds.length} รอบการประเมิน`)}
      ${stat("อัตราต่อรอบ",gRate===null?"—":(gRate>=0?"+":"")+gRate.toFixed(2),
        gRate===null?"—":(gRate>0.1?"ก้าวหน้าชัดเจน":gRate<-0.1?"ถดถอย ควรทบทวนแผน":"ค่อนข้างคงที่"))}
      ${stat("สมรรถนะที่ลดลง",P.declining.length,P.declining.length?esc(P.declining[0].c.th):"ไม่มี")}
     </div>
     ${P.series.length?`<table class="tight"><thead><tr><th>รอบ</th><th class="num">คะแนนรวม</th><th>ระดับ</th></tr></thead><tbody>${progRows}</tbody></table>
       ${P.series.length>1?`<div style="margin-top:.8rem">${lineSVG(P.rounds.map(r=>r.label),P.series.map(v=>v||0),FW.levels.length,+P.targetAvg.toFixed(1))}</div>`:""}`
      :`<div class="empty">ยังไม่มีรอบการประเมิน</div>`}`,"",false);

  /* 🧠 Personalized Recommendation */
  const recs=[];
  P.gaps.slice(0,3).forEach(o=>{
    const nx=Math.min(Math.ceil(o.t),FW.levels.length);
    const d=nextLevelDescriptor(P.y,o.c.id,nx);
    recs.push({h:esc(o.c.th),b:`ปัจจุบัน ${fmt(o.v)} เป้าหมาย ${o.t} ขาดอีก ${Math.abs(o.gap).toFixed(2)} ระดับ`+
      (d?`<br><span class="sub">เกณฑ์ระดับ ${nx}: ${esc(d)}</span>`:"")});
  });
  P.notMastered.slice(0,2).forEach(o=>recs.push({h:esc(o.c.th)+" (จากแบบจำลองวินิจฉัย)",
    b:`ความน่าจะเป็นที่รอบรู้คุณลักษณะนี้เพียง ${Math.round(o.p*100)}% ควรฝึกซ้ำในสถานการณ์จริงและเก็บหลักฐานยืนยัน`}));
  if(!recs.length&&P.strengths.length) recs.push({h:esc(P.strengths[0].c.th),
    b:`เป็นจุดแข็งที่ ${fmt(P.strengths[0].v)} สูงกว่าเป้าหมาย ${P.strengths[0].gap.toFixed(2)} ระดับ ควรต่อยอดเป็นผลงานเด่นในแฟ้มสะสมงาน`});
  const recommend=card("🧠 Personalized Recommendation",

/** ข้อความวิเคราะห์เชิงลึก สร้างจากกฎที่อ้างอิงค่าสถิติที่คำนวณได้จริง
    เขียนแบบวิชาการ ระบุตัวเลขและวิธีตีความกำกับทุกข้อสรุป */
function aiFeedback(P){
  const out=[];
  const lv=P.level?FW.levels[P.level-1]:null;

  out.push(`<p><b>ภาพรวมการวัด</b> คะแนนรวมอยู่ที่ ${fmt(P.overall)} จัดอยู่ในระดับ${lv?" "+esc(lv.th):"—"}
    เทียบกับระดับเป้าหมายเฉลี่ยของ${esc(yearOf(FW,P.y).label)} ที่ ${fmt(P.targetAvg,1)}
    ${P.overall!==null&&P.overall>=P.targetAvg?"ถือว่าถึงเกณฑ์ในภาพรวม":"จึงยังต่ำกว่าเกณฑ์ในภาพรวม"}
    โดยถึงเป้าหมายรายด้าน ${P.onTarget} จาก ${P.withV.length} สมรรถนะ</p>`);

  if(P.A&&P.A.irt){
    const t=P.A.irt.theta, se=P.A.irt.se;
    out.push(`<p><b>การวัดเชิงจิตมิติ</b> ค่าความสามารถแฝงประมาณด้วยโมเดล GRM แบบ EAP ได้ θ = ${fmt(t)}
      (SE = ${fmt(se)}) ช่วงเชื่อมั่น 95% อยู่ระหว่าง ${fmt(t-1.96*se)} ถึง ${fmt(t+1.96*se)}
      ${se>0.45?"ค่าความคลาดเคลื่อนยังกว้าง ควรเพิ่มจำนวนตัวชี้วัดที่ประเมินเพื่อให้ประมาณค่าได้แม่นขึ้น"
        :"ความคลาดเคลื่อนอยู่ในเกณฑ์ที่ใช้ตัดสินรายบุคคลได้"}
      ค่า θ เปรียบเทียบได้เฉพาะภายในชั้นปีเดียวกัน เพราะชุดตัวชี้วัดต่างกันตามชั้นปี</p>`);
  }

  if(P.weakDims.length){
    const w=P.weakDims[0];
    out.push(`<p><b>มิติที่อ่อนที่สุด</b> จากการวิเคราะห์รายมิติ (MIRT) พบว่า ${esc(w.comp.th)}
      มีค่า θ ต่ำที่สุดที่ ${fmt(w.est.theta)} ขณะที่คะแนนดิบอยู่ที่ ${fmt(w.raw)} เทียบกับเป้าหมาย ${w.target}
      ผลจากสองวิธีชี้ไปทางเดียวกัน จึงเป็นจุดที่ควรพัฒนาเป็นลำดับแรก</p>`);
  }

  if(P.growth!==null){
    const dir=P.growth>0.15?"มีพัฒนาการเชิงบวก":P.growth<-0.15?"มีแนวโน้มถดถอย":"ค่อนข้างคงที่";
    out.push(`<p><b>พัฒนาการตามเวลา</b> เทียบรอบแรกกับรอบล่าสุด คะแนนเปลี่ยนแปลง
      ${(P.growth>=0?"+":"")+P.growth.toFixed(2)} ระดับ เฉลี่ย ${(P.perRound>=0?"+":"")+P.perRound.toFixed(2)} ระดับต่อรอบ
      ถือว่า${dir} ${P.declining.length?`อย่างไรก็ตามมี ${P.declining.length} สมรรถนะที่คะแนนลดลง นำโดย ${esc(P.declining[0].c.th)} ซึ่งควรตรวจสอบว่าเกิดจากบริบทการฝึกที่เปลี่ยนไปหรือจากการใช้เกณฑ์ต่างกันระหว่างรอบ`:""}</p>`);
  }

  if(P.selfGap!==null){
    const w=Math.abs(P.selfGap);
    out.push(`<p><b>ความสอดคล้องของการประเมินตนเอง</b> คะแนนที่ท่านประเมินตนเอง${P.selfGap>=0?"สูงกว่า":"ต่ำกว่า"}
      ค่าเฉลี่ยของผู้ประเมินภายนอก ${w.toFixed(2)} ระดับ
      ${w<0.25?"ถือว่าสอดคล้องกันดี สะท้อนการรู้จักตนเองที่ตรงกับการสังเกตของผู้ประเมิน"
        :w<0.5?"ต่างกันเล็กน้อย อยู่ในช่วงที่ยอมรับได้"
        :P.selfGap>0?"ต่างกันมากพอที่ควรทบทวนเกณฑ์ร่วมกับอาจารย์นิเทศก์ เพราะการประเมินตนเองสูงเกินจริงมักทำให้มองข้ามจุดที่ต้องพัฒนา"
        :"ต่างกันมากพอที่ควรทบทวนร่วมกัน เพราะการประเมินตนเองต่ำเกินจริงอาจบั่นทอนความมั่นใจโดยไม่จำเป็น"}</p>`);
  }

  if(P.A&&P.A.gdina&&P.notMastered.length){
    out.push(`<p><b>การวินิจฉัยคุณลักษณะ</b> แบบจำลอง G-DINA ชี้ว่ายังไม่รอบรู้ ${P.notMastered.length} คุณลักษณะ
      ต่ำสุดคือ ${esc(P.notMastered[0].c.th)} ที่ความน่าจะเป็น ${Math.round(P.notMastered[0].p*100)}%
      ค่าต่ำกว่า 70% หมายถึงยังไม่มีหลักฐานเพียงพอว่ารอบรู้ ควรเก็บหลักฐานการปฏิบัติเพิ่มในด้านนี้</p>`);
  }

  out.push(`<p><b>ข้อควรระวังในการตีความ</b> ผลทั้งหมดคำนวณจากคะแนนที่ผู้ประเมินบันทึกไว้
    ซึ่งได้รับอิทธิพลจากความเข้มงวดของผู้ประเมินแต่ละคน ระบบจึงเทียบผลจากหลายฝ่ายประกอบกัน
    ค่าความเสี่ยงจากแบบจำลองทำนายยังไม่ได้สอบเทียบกับข้อมูลย้อนหลังจริงของคณะ ใช้ประกอบดุลยพินิจเท่านั้น</p>`);

  return `<div style="font-size:.86rem;line-height:1.85">${out.join("")}</div>`;
}

function execDash(){

    const comps=activeComps(FW,y.year);
    const onT=co.length?co.reduce((acc,s)=>{
      const ok=comps.filter(c=>{const v=compScore(FW,s.id,c,y.year);return v!==null&&v>=cfgOf(FW,y.year,c.id).target;}).length;
      return acc+(comps.length?ok/comps.length:0);},0)/co.length:0;
    return {name:"ปี "+y.year,v:vals.length?+mean(vals).toFixed(2):0,n:co.length,pass:Math.round(onT*100)};

      cohort.length?`<div class="scroll-x"><table class="tight" style="min-width:${320+comps.length*38}px">

        <tbody>${rows}</tbody></table></div>`:`<div class="empty">ไม่มีนักศึกษาในชั้นปีนี้</div>`,"",false)}
    ${yearScopeTable()}</div>`;
}

/** แถบเปรียบเทียบคะแนนรายฝ่ายกับค่าเฉลี่ยและเป้าหมายในช่องเดียว
    เส้นประคือระดับเป้าหมายของชั้นปี จุดคือคะแนนของแต่ละฝ่าย แถบทึบคือค่าเฉลี่ยที่ใช้รายงาน */
function raterBar(parts,target,max){
  const M=max||5;
  const pct=v=>clamp((v||0)/M,0,1)*100;
  const dots=RATERS.map(r=>{
    const v=parts.byRater[r.key];
    if(v===null||v===undefined) return "";
    return `<i title="${esc(r.label)} ${fmt(v)}" style="position:absolute;left:${pct(v)}%;top:50%;
      transform:translate(-50%,-50%);width:.5rem;height:.5rem;border-radius:50%;
      background:${r.color};box-shadow:0 0 0 1.5px var(--surface)"></i>`;
  }).join("");
  const tgt=target?`<span style="position:absolute;left:${pct(target)}%;top:-2px;bottom:-2px;width:0;
    border-left:2px dashed var(--text-soft)" title="เป้าหมาย ${target}"></span>`:"";
  const v=parts.v;
  const col=v===null?"var(--line)":(v>=target?"var(--ok)":v>=target-.5?"var(--warn)":"var(--risk)");
  return `<div style="position:relative;height:.85rem;background:var(--line-soft);border-radius:4px">
    <i style="position:absolute;left:0;top:0;bottom:0;width:${pct(v)}%;background:${col};
      border-radius:4px;opacity:.35"></i>${tgt}${dots}</div>`;
}

/** ที่มาของคะแนนช่องทางหนึ่ง อ่านจาก RESP_* ที่ applyAssessments เติมจากชีต Assessments
    และจากระเบียน ASSESS_LOG ซึ่งเก็บผู้ประเมิน วันที่ และรอบการประเมินจริง
    ไม่มีการสังเคราะห์ตัวเลขขึ้นเอง ฝ่ายที่ยังไม่ได้ประเมินจะคืน avg เป็น null */
function raterSource(sid,y,comps,key){
  const r=raterByKey(key);
  const vals=comps.map(c=>compScoreBy(FW,sid,c,y,key)).filter(v=>v!==null);
  const log=(ASSESS_LOG[sid]||[]).filter(a=>a.type===r.type);
  const who=[...new Set(log.map(a=>a.assessor_id).filter(Boolean))]
    .map(id=>{ const u=userById(id); return u?u.name:id; });
  const dates=log.map(a=>a.date).filter(Boolean).sort();
  const rounds=[...new Set(log.map(a=>a.round_no))].sort((a,b)=>a-b);
  return {r, avg:vals.length?mean(vals):null, nComp:vals.length,
          nAssess:log.length, nItems:log.reduce((s,a)=>s+(a.n_items||0),0),
          who, last:dates[dates.length-1]||"", rounds};
}
/** แสดงให้เห็นว่าคะแนนที่ใช้รายงานประกอบขึ้นจากค่าเฉลี่ยจริงของฝ่ายใดบ้าง
    ผู้เรียนจึงตรวจย้อนได้ว่าตัวเลขสรุปมาจากผลการประเมินจริงของแต่ละฝ่าย ไม่ใช่ค่าที่ระบบคิดเอง */
function scoreRollup(groupOverall,overallBy,ov,nGroups,src){
  const rows=SCORE_GROUPS.map(g=>{
    const v=groupOverall[g.key];
    const parts=g.raters.map(k=>{
      const s=src[k];
      return s.avg===null?null:`${s.r.short} ${fmt(s.avg)}`;
    }).filter(Boolean);
    const how=g.raters.length>1
      ? (parts.length>1?`เฉลี่ยของ ${parts.join(" และ ")}`
        :(parts.length?`มีข้อมูลฝ่ายเดียว คือ ${parts[0]}`:"ยังไม่มีฝ่ายใดประเมิน"))
      : (parts.length?`จากช่องทาง${g.label}`:"ยังไม่มีการประเมิน");
    return `<tr><td>${esc(g.label)}</td>
      <td class="num" style="font-weight:600">${fmt(v)}</td>
      <td style="font-size:.82rem;color:var(--text-soft)">${esc(how)}</td></tr>`;
  }).join("");
  const used=SCORE_GROUPS.filter(g=>groupOverall[g.key]!==null)
    .map(g=>fmt(groupOverall[g.key]));
  const formula=used.length
    ? `(${used.join(" + ")}) ÷ ${used.length} = <b>${fmt(ov)}</b>`
    : "ยังไม่มีฝ่ายใดบันทึกผลการประเมิน";
  return card("การรวมคะแนนเป็นคะแนนที่ใช้รายงาน",
    "ตรวจย้อนได้ว่าคะแนนสรุปมาจากค่าเฉลี่ยจริงของฝ่ายใดบ้าง",
    `<table class="tight"><thead><tr><th>ฝ่าย</th><th class="num" style="width:110px">คะแนนเฉลี่ยจริง</th>
      <th>ที่มาของค่าเฉลี่ย</th></tr></thead><tbody>${rows}</tbody></table>
     <div class="notebox" style="margin-top:.8rem">คะแนนที่ใช้รายงาน = ${formula}
       ${nGroups&&nGroups<SCORE_GROUPS.length?`<br>ขณะนี้มีข้อมูล ${nGroups} จาก ${SCORE_GROUPS.length} ฝ่าย ระบบเฉลี่ยเฉพาะฝ่ายที่ประเมินแล้ว จึงไม่ลงโทษผู้เรียนที่ยังได้รับการประเมินไม่ครบ`:""}</div>`,
    "",false);
}
/** พิสูจน์ที่มาของตัวเลขทุกฝ่าย พร้อมสถานะการเชื่อมต่อฐานข้อมูลและปุ่มดึงข้อมูลใหม่ */

  return card("ที่มาของคะแนนแต่ละฝ่าย",
    "ตรวจสอบได้ว่าค่าเฉลี่ยแต่ละฝ่ายมาจากผลการประเมินจริงของใคร กี่ครั้ง และเมื่อใด",

     <div class="scroll-x"><table class="tight" style="min-width:880px"><thead><tr>
      <th>ฝ่ายผู้ประเมิน</th><th class="num" style="width:96px">เฉลี่ยจริง</th>

      <th class="num" style="width:96px">ตัวชี้วัด</th><th>ผู้ประเมิน</th>
      <th style="width:110px">ล่าสุด</th><th style="width:110px">สถานะ</th>
     </tr></thead><tbody>${rows}</tbody></table></div>
     <div class="notebox" style="margin-top:.8rem">
       ค่าเฉลี่ยของทุกฝ่ายคำนวณจากคะแนนรายตัวชี้วัดที่บันทึกไว้ในชีต Assessments และ AssessmentScores โดยตรง
       ช่องผู้ประเมินและวันที่อ่านจากระเบียนเดียวกัน จึงตรวจสอบย้อนกลับได้ทุกตัวเลข</div>`,
    live?`<button class="btn btn-ghost btn-sm" data-act="mysync">ดึงข้อมูลจากฐานข้อมูลใหม่</button>`:"",

}

function ladderPage(){
  const me=userById(S.user.linkTo||S.user.id)||students()[0];
  const y=me.year;
  const comps=activeComps(FW,y);

  /* คะแนนรวมรายฝ่ายทั้งชั้นปี ใช้เป็นตัวเลขสรุปด้านบน */
  const overallBy={};
  RATERS.forEach(r=>{
    const v=comps.map(c=>compScoreBy(FW,me.id,c,y,r.key)).filter(x=>x!==null);
    overallBy[r.key]=v.length?mean(v):null;
  });
  const groupOverall={};
  SCORE_GROUPS.forEach(g=>{
    const v=comps.map(c=>compScoreParts(FW,me.id,c,y).byGroup[g.key]).filter(x=>x!==null);
    groupOverall[g.key]=v.length?mean(v):null;
  });
  const ov=overallAvg(FW,me.id,y);
  const nGroups=SCORE_GROUPS.filter(g=>groupOverall[g.key]!==null).length;

  const rows=comps.map((c,n)=>{
    const a=compScoreParts(FW,me.id,c,y), v=a.v, t=cfgOf(FW,y,c.id).target;
    const cells=RATERS.map(r=>{
      const x=a.byRater[r.key];
      return `<td class="num" style="font-size:.82rem;${x===null?"color:var(--muted)":""}">${fmt(x)}</td>`;
    }).join("");
    const gap=v===null?null:v-t;
    return `<tr><td class="sub">${n+1}</td>
      <td style="font-size:.84rem">${esc(c.th)}<div class="sub">${c.code} · ${PTRU[c.ptru]?PTRU[c.ptru].th:""}</div></td>
      ${cells}
      <td class="num" style="font-weight:600">${fmt(v)}${a.n===1?` <span class="tag tag-warn">ฝ่ายเดียว</span>`:""}</td>
      <td class="num">${t}</td>
      <td style="min-width:130px">${raterBar(a,t,FW.levels.length)}</td>
      <td class="num" style="font-weight:600;color:${gap===null?"var(--muted)":gap>=0?"var(--ok)":"var(--risk)"}">
        ${gap===null?"—":(gap>=0?"+":"")+gap.toFixed(2)}</td></tr>`;}).join("");

  const legend=RATERS.map(r=>`<span style="display:inline-flex;align-items:center;gap:.3rem;margin-right:.9rem">
      <i style="width:.55rem;height:.55rem;border-radius:50%;background:${r.color};display:inline-block"></i>
      <span style="font-size:.8rem">${esc(r.label)}</span></span>`).join("")+
    `<span style="display:inline-flex;align-items:center;gap:.3rem"><i style="width:0;height:.7rem;border-left:2px dashed var(--text-soft);display:inline-block"></i>
      <span style="font-size:.8rem">ระดับเป้าหมายของชั้นปี</span></span>`;

  /* การ์ดรายฝ่ายทั้งสี่ช่องทาง แยกวิชาชีพครูกับวิชาเอกออกจากกัน
     เดิมรวมสองช่องทางไว้ในการ์ดเดียว ผู้เรียนจึงไม่เห็นค่าเฉลี่ยจริงของแต่ละฝ่าย */
  const src={};
  RATERS.forEach(r=>{ src[r.key]=raterSource(me.id,y,comps,r.key); });
  const raterStats=RATERS.map(r=>{
    const s=src[r.key];
    const sub=s.avg===null?"ยังไม่มีการประเมิน"
      :`${s.nComp} จาก ${comps.length} สมรรถนะ · ประเมิน ${s.nAssess} ครั้ง`;
    return stat(r.label,fmt(s.avg),sub);
  }).join("");

  return `<div class="stack">
    <div class="notebox">คะแนนที่แสดงคำนวณจาก <b>${SCORE_RULE}</b><br>${SCORE_RULE_NOTE}<br>
      ผลนี้เป็นของ${yearOf(FW,y).label} เกณฑ์เป้าหมายกำหนดแยกตามชั้นปี จึงเทียบคะแนนข้ามชั้นปีโดยตรงไม่ได้</div>
    ${card("ค่าเฉลี่ยผลการประเมินจริงรายฝ่าย",
      `เฉลี่ยจากคะแนนที่ผู้ประเมินแต่ละฝ่ายบันทึกไว้จริง เฉพาะสมรรถนะที่ฝ่ายนั้นประเมินแล้ว`,
      `<div class="grid g4">${raterStats}</div>`)}
    ${scoreRollup(groupOverall,overallBy,ov,nGroups,src)}
    ${raterSourcePanel(me,y,comps,src)}
    ${card("พัฒนาการรายสมรรถนะ","เปรียบเทียบคะแนนของผู้ประเมินแต่ละฝ่ายกับค่าเฉลี่ยและระดับเป้าหมายของชั้นปี",
      `<div class="card-b" style="border-bottom:1px solid var(--line-soft);padding-top:0">${legend}</div>
       <div class="scroll-x"><table class="tight" style="min-width:980px"><thead><tr>
        <th style="width:34px">#</th><th>สมรรถนะ</th>
        ${RATERS.map(r=>`<th class="num" title="${esc(r.label)}">${esc(r.short)}</th>`).join("")}
        <th class="num">เฉลี่ย</th><th class="num">เป้าหมาย</th>
        <th>เทียบกับเป้าหมาย</th><th class="num">ส่วนต่าง</th>
      </tr></thead><tbody>${rows}</tbody></table></div>`,"",false)}</div>`;

/** สมรรถนะที่ผู้ใช้คนนี้ประเมินนักศึกษารายนี้ไปแล้วจริง
    อ่านจาก ASSESS_LOG ซึ่งมาจากชีต Assessments จึงเป็นระเบียนของผู้ประเมินคนนั้นเอง
    ไม่ใช่การเดาจากคะแนนรวมของช่องทาง คืนวัตถุ {comp_id: {date, round, n_items, type}} */
function assessedByMe(sid){
  const uid=String(S.user?(S.user.linkTo||S.user.id):"");
  const out={};
  (ASSESS_LOG[sid]||[]).forEach(a=>{
    if(String(a.assessor_id)!==uid) return;
    const prev=out[a.comp_id];
    if(!prev||String(a.date)>String(prev.date)||a.round_no>prev.round)
      out[a.comp_id]={date:a.date,round:a.round_no,n:a.n_items,type:a.type};
  });
  return out;
}
/** ชุดสมรรถนะที่เปิดใช้ของชั้นปีนี้ ตามที่ผู้ดูแลตั้งค่าไว้
    ผู้ประเมินจึงรู้ว่าแบบประเมินที่เห็นมาจากการตั้งค่าใด และตรงกับที่ผู้ดูแลเห็นในหน้าตั้งค่า */
function frameworkScopeNote(y,comps){
  const yc=yearOf(FW,y), open=comps||activeComps(FW,y);
  const inds=open.reduce((n,c)=>n+cfgOf(FW,y,c.id).indicators.length,0);
  const off=FW.competencies.length-open.length;
  return `<div class="alert alert-info" style="margin-top:0">
    <b>กรอบสมรรถนะ${esc(yc.label)}</b> · เปิดใช้ ${open.length} จาก ${FW.competencies.length} สมรรถนะ
    ${off?`(ปิดไว้ ${off})`:""} · ${inds} ตัวชี้วัดที่ต้องให้คะแนน
    · ระดับเป้าหมายเฉลี่ย ${open.length?fmt(mean(open.map(c=>cfgOf(FW,y,c.id).target)),1):"—"}
    <br>แบบประเมินแสดงเฉพาะสมรรถนะที่ผู้ดูแลระบบเปิดใช้ในชั้นปีนี้เท่านั้น</div>`;
}
/** สรุปการตั้งค่าทุกชั้นปีสำหรับฝั่งผู้ประเมิน ใช้ตัวเลขชุดเดียวกับหน้าตั้งค่าของผู้ดูแล */
function yearScopeTable(){
  const rows=FW.years.map(yy=>{
    const y=yy.year, comps=activeComps(FW,y);
    const inds=comps.reduce((n,c)=>n+cfgOf(FW,y,c.id).indicators.length,0);
    const off=FW.competencies.length-comps.length;
    return `<tr><td>${esc(yy.label)}<div class="sub">ระยะ${esc(yy.stage)}</div></td>
      <td class="num" style="font-weight:600">${comps.length} / ${FW.competencies.length}</td>
      <td class="num">${off||"—"}</td>
      <td class="num">${inds}</td>
      <td class="num">${comps.length?fmt(mean(comps.map(c=>cfgOf(FW,y,c.id).target)),1):"—"}</td>
      <td>${comps.length?`<span class="tag tag-ok">พร้อมประเมิน</span>`:`<span class="tag tag-risk">ยังไม่เปิดสมรรถนะ</span>`}</td></tr>`;
  }).join("");
  return card("สมรรถนะที่เปิดใช้ในแต่ละชั้นปี",
    "ตามการตั้งค่าของผู้ดูแลระบบ แบบประเมินของแต่ละชั้นปีจะแสดงเฉพาะสมรรถนะที่เปิดใช้",
    `<table class="tight"><thead><tr><th>ชั้นปี</th><th class="num" style="width:110px">เปิดใช้</th>
      <th class="num" style="width:80px">ปิด</th><th class="num" style="width:90px">ตัวชี้วัด</th>
      <th class="num" style="width:110px">เป้าหมายเฉลี่ย</th><th style="width:130px">สถานะ</th>
     </tr></thead><tbody>${rows}</tbody></table>`,"",false);
}
/** สรุปให้ผู้ประเมินเห็นว่าตนประเมินสมรรถนะใดไปแล้ว เหลืออีกกี่รายการ
    ผู้ประเมินจึงไม่ต้องเปิดทีละสมรรถนะเพื่อตรวจว่าทำครบหรือยัง */
function assessedPanel(st,comps,mine){
  const done=comps.filter(c=>mine[c.id]);
  const left=comps.filter(c=>!mine[c.id]);
  const y=st.year;
  const rows=comps.map((c,k)=>{
    const m=mine[c.id];
    const v=m?compScoreBy(FW,st.id,c,y,(raterByType(m.type)||{}).key):null;
    return `<tr${m?"":' style="opacity:.62"'}>
      <td class="sub">${k+1}</td>
      <td style="font-size:.83rem">${esc(c.th)}<div class="sub">${c.code}</div></td>
      <td>${m?`<span class="tag tag-ok">ประเมินแล้ว</span>`:`<span class="tag tag-n">ยังไม่ได้ประเมิน</span>`}</td>
      <td class="num" style="font-weight:600">${m?fmt(v):"—"}</td>
      <td class="num">${cfgOf(FW,y,c.id).target}</td>
      <td style="font-size:.8rem">${m?esc(m.date||"—"):"—"}</td>
      <td class="num">${m?`ครั้งที่ ${m.round}`:"—"}</td>
      <td class="num">${m?`${m.n} ตัวชี้วัด`:"—"}</td>
      <td class="num"><button class="btn btn-ghost btn-sm" data-act="ascomp2" data-v="${c.id}">${m?"แก้ไข":"ประเมิน"}</button></td></tr>`;
  }).join("");
  return card("สมรรถนะที่ท่านประเมินนักศึกษารายนี้แล้ว",
    `นับจากระเบียนการประเมินจริงในฐานข้อมูล เฉพาะรายการที่บันทึกโดยบัญชีของท่านเอง`,
    `<div class="grid g3" style="gap:.7rem;margin-bottom:.9rem">
      ${stat("ประเมินแล้ว",`${done.length} / ${comps.length}`,done.length?`ล่าสุด ${Object.values(mine).map(m=>m.date).filter(Boolean).sort().slice(-1)[0]||"—"}`:"ยังไม่ได้เริ่มประเมิน")}
      ${stat("คงเหลือ",left.length,left.length?left.slice(0,3).map(c=>c.code).join(" · ")+(left.length>3?" …":""):"ครบทุกสมรรถนะแล้ว")}
      ${stat("ความคืบหน้า",comps.length?Math.round(done.length/comps.length*100)+"%":"—",
        `${yearOf(FW,y).label} · ${comps.length} สมรรถนะที่เปิดใช้`)}
    </div>
    <div class="scroll-x"><table class="tight" style="min-width:820px"><thead><tr>
      <th style="width:32px">#</th><th>สมรรถนะ</th><th style="width:130px">สถานะ</th>
      <th class="num" style="width:80px">คะแนน</th><th class="num" style="width:80px">เป้าหมาย</th>
      <th style="width:110px">วันที่</th><th class="num" style="width:90px">รอบ</th>
      <th class="num" style="width:100px">ให้คะแนน</th><th style="width:90px"></th>
    </tr></thead><tbody>${rows}</tbody></table></div>`,"",false);
}

function assessPage(){
  const stu=visStudents();
  if(!stu.length) return card("การประเมิน","",`<div class="empty">ยังไม่มีนักศึกษาในระบบ</div>`);
  if(S.role==="Student"){const me=userById(S.user.linkTo||S.user.id); S.asSid=me?me.id:stu[0].id;}
  if(!S.asSid||!userById(S.asSid)) S.asSid=stu[0].id;
  const st=userById(S.asSid), y=st.year, comps=activeComps(FW,y);
  if(!comps.length) return card("การประเมิน","",`<div class="empty">ชั้นปีนี้ยังไม่มีสมรรถนะที่เปิดใช้</div>`);
  if(!S.asComp||!comps.some(c=>c.id===S.asComp)) S.asComp=comps[0].id;
  const c=comps.find(x=>x.id===S.asComp), cfg=cfgOf(FW,y,c.id);
  /* สมรรถนะที่บัญชีนี้ประเมินนักศึกษารายนี้ไปแล้วจริง อ่านจากระเบียนในฐานข้อมูล */
  const mine=assessedByMe(st.id);
  const done=cfg.indicators.length>0&&cfg.indicators.every(i=>S.asScores[i.id]);
  const result=done?mean(cfg.indicators.map(i=>S.asScores[i.id])):null;
  /* ประเภทการประเมินที่แต่ละบทบาทเลือกได้ ต้องสอดคล้องกับ api_assessSubmit ใน Code.gs
     อาจารย์นิเทศก์แต่ละประเภทบันทึกในช่องทางของตนเอง จึงแยกดูคะแนนรายฝ่ายได้ */
  const allowType=id=>S.role==="Student"?["self","peer"].includes(id)
    :S.role==="Mentor"?id==="mentor"
    :S.role==="Director"?id==="director"
    :S.role==="Lecturer"?id==="lecturer"
    :S.role==="MajorAdvisor"?id==="major":true;
  if(!allowType(S.asType)) S.asType=ASSESS_TYPES.map(([id])=>id).find(allowType)||"lecturer";
  const typeOpts=ASSESS_TYPES.filter(([id])=>allowType(id))
    .map(([id,l])=>`<option value="${id}" ${S.asType===id?"selected":""}>${l}</option>`).join("");
  const indCards=cfg.indicators.length?cfg.indicators.map((i,n)=>card(esc(i.th),`ตัวชี้วัดที่ ${n+1} จาก ${cfg.indicators.length}`,
    `<div class="scale-grid" style="grid-template-columns:repeat(${FW.levels.length},1fr)">
      ${FW.levels.map((l,k)=>`<button class="${S.asScores[i.id]===k+1?"on":""}" data-act="asscore" data-v="${i.id}" data-k="${k+1}">
        <b>${k+1}</b>${esc(i.descriptors[k]||l.th)}</button>`).join("")}</div>`)).join("")
    :card("","",`<div class="empty">สมรรถนะนี้ยังไม่มีตัวชี้วัดในชั้นปีนี้</div>`);
  return `<div class="grid g2" style="grid-template-columns:1.7fr 1fr;align-items:start">
    <div class="stack">
      ${card("แบบประเมินสมรรถนะ",`${yearOf(FW,y).label} · ระยะ${yearOf(FW,y).stage} · เป้าหมายระดับ ${cfg.target}`,
        `<div class="grid g3" style="gap:.7rem">
          ${S.role==="Student"?"":`<div class="field" style="margin-top:0"><label>นักศึกษา</label>
            <select class="inp" data-act="assid">${stu.map(s=>`<option value="${s.id}" ${s.id===S.asSid?"selected":""}>${s.program} ปี ${s.year} · ${esc(s.name)}</option>`).join("")}</select></div>`}
          <div class="field" style="margin-top:0"><label>สมรรถนะ</label>
            <select class="inp" data-act="ascomp">${comps.map(x=>`<option value="${x.id}" ${x.id===c.id?"selected":""}>${mine[x.id]?"✓ ":"◻ "}${x.code} · ${esc(x.th)}</option>`).join("")}</select>
            <div class="hint">✓ คือสมรรถนะที่ท่านประเมินนักศึกษารายนี้ไปแล้ว</div></div>
          <div class="field" style="margin-top:0"><label>ประเภทการประเมิน</label><select class="inp" data-act="astype">${typeOpts}</select></div>
        </div>
        ${frameworkScopeNote(y,comps)}
        ${mine[c.id]?`<div class="alert alert-info" style="margin-bottom:0">ท่านเคยประเมินสมรรถนะนี้แล้วเมื่อ ${esc(mine[c.id].date||"—")}
          (ครั้งที่ ${mine[c.id].round} · ให้คะแนน ${mine[c.id].n} ตัวชี้วัด) การบันทึกใหม่จะเป็นการประเมินซ้ำในรอบปัจจุบัน</div>`:""}`)}
      ${assessedPanel(st,comps,mine)}
      ${indCards}
      ${card("ข้อเสนอแนะเพื่อการพัฒนา","",
        `<textarea class="inp" rows="4" placeholder="ระบุสิ่งที่ทำได้ดีและสิ่งที่ควรพัฒนา พร้อมข้อเสนอแนะที่นำไปปฏิบัติได้" data-nore></textarea>
         ${S.asSaved?`<div class="alert alert-ok">บันทึกผลการประเมินแล้ว</div>`:""}
         <button class="btn btn-primary" ${done?"":"disabled style=opacity:.45"} data-act="assave">${done?"บันทึกผลการประเมิน":"เลือกระดับให้ครบทุกตัวชี้วัด"}</button>`)}
    </div>
    <div class="stack">
      ${card("สรุปผล","",result===null?`<div class="empty" style="padding:1.4rem 0">ผลจะแสดงเมื่อประเมินครบทุกตัวชี้วัด</div>`:
        `<div style="font-family:'Noto Serif Thai',serif;font-size:2.3rem;font-weight:600;line-height:1.1">${fmt(result)}</div>
         <div style="margin-top:.4rem">${levelChip(result)}</div>
         <p style="font-size:.82rem;margin-top:.7rem;color:${result>=cfg.target?"var(--ok)":"var(--warn)"}">
           ${result>=cfg.target?`ถึงระดับเป้าหมายของชั้นปี (${cfg.target})`:`ยังต่ำกว่าระดับเป้าหมายของชั้นปี (${cfg.target})`}</p>`)}
      ${assessAdvice(st,c,result)}
    </div></div>`;
}

/** ข้อเสนอแนะเชิงลึกสำหรับผู้ประเมิน ขณะกำลังประเมินสมรรถนะหนึ่งของนักศึกษาคนหนึ่ง
    ใช้ผลวิเคราะห์จริงของผู้เรียน เทียบกับคะแนนที่ผู้ประเมินกำลังจะให้ในรอบนี้ */
function assessAdvice(st,c,draft){
  const P=personalize(st.id);
  if(!P) return `<div class="aibox"><div class="lb">ข้อเสนอแนะจากระบบ</div>
    <p>ยังไม่มีผลการประเมินย้อนหลังของผู้เรียนรายนี้ ระบบจะวิเคราะห์ให้เมื่อมีผลอย่างน้อยหนึ่งรอบ</p></div>`;

  const it=P.items.find(x=>x.c.id===c.id);
  const y=P.y, t=cfgOf(FW,y,c.id).target;
  const parts=it?it.parts:null;
  const bits=[];

  /* บริบทของสมรรถนะนี้เทียบกับฝ่ายอื่นและกับรอบก่อน */
  if(parts){
    const others=RATERS.map(r=>({r,v:parts.byRater[r.key]})).filter(o=>o.v!==null);
    if(others.length) bits.push(`<p><b>คะแนนที่บันทึกไว้แล้วในสมรรถนะนี้</b> ${
      others.map(o=>`${esc(o.r.short)} ${fmt(o.v)}`).join(" · ")} (รวม ${fmt(it.v)} เทียบเป้าหมาย ${t})</p>`);
    if(it.trend!==null) bits.push(`<p><b>แนวโน้ม</b> เปลี่ยนแปลง ${(it.trend>=0?"+":"")+it.trend.toFixed(2)} ระดับจากรอบแรก
      ${it.trend<-0.15?"ซึ่งเป็นทิศทางลดลง ควรตรวจสอบว่าเกิดจากบริบทการฝึกหรือจากการใช้เกณฑ์ต่างกัน":""}</p>`);
  }
  /* เทียบคะแนนที่กำลังจะให้ กับค่าที่ฝ่ายอื่นเคยให้ */
  if(draft!==null&&parts){
    const ext=RATERS.filter(r=>r.type!==S.asType).map(r=>parts.byRater[r.key]).filter(v=>v!==null);
    if(ext.length){
      const d=draft-mean(ext);
      bits.push(`<p><b>คะแนนที่ท่านกำลังให้</b> ${fmt(draft)} ${Math.abs(d)<0.5?"สอดคล้องกับ":(d>0?"สูงกว่า":"ต่ำกว่า")}
        ค่าเฉลี่ยของผู้ประเมินฝ่ายอื่นในสมรรถนะนี้ (${fmt(mean(ext))}) อยู่ ${Math.abs(d).toFixed(2)} ระดับ
        ${Math.abs(d)>=1?"ส่วนต่างเกินหนึ่งระดับ ควรทบทวนหลักฐานประกอบก่อนบันทึก":""}</p>`);
    }
    const nx=Math.min(Math.ceil(t),FW.levels.length);
    const desc=nextLevelDescriptor(y,c.id,nx);
    if(desc&&draft<t) bits.push(`<p><b>เกณฑ์ระดับเป้าหมาย (${nx})</b> ${esc(desc)}</p>`);
  }
  /* ตำแหน่งของสมรรถนะนี้ในภาพรวมของผู้เรียน */
  const rank=[...P.withV].sort((a,b)=>a.gap-b.gap).findIndex(x=>x.c.id===c.id);
  if(rank>=0) bits.push(`<p><b>ภาพรวมของผู้เรียน</b> สมรรถนะนี้อยู่ลำดับที่ ${rank+1} จาก ${P.withV.length}
    เมื่อเรียงจากด้านที่ห่างเป้าหมายมากที่สุด · คะแนนรวมทุกด้าน ${fmt(P.overall)}
    · ความเสี่ยงไม่ผ่านเกณฑ์ ${Math.round(P.risk*100)}%</p>`);

  /* เส้นทางการเรียนรู้ที่ผู้ประเมินใช้แนะนำต่อได้ทันที */
  const g=P.gaps.slice(0,3);
  const path=g.length?`<div style="margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--line-soft)">
    <div class="lb">เส้นทางการเรียนรู้ที่แนะนำ (Personalized Path)</div>
    <ol style="margin:.35rem 0 0;padding-left:1.15rem;font-size:.83rem;line-height:1.75">
      ${g.map(o=>{const nx=Math.min(Math.ceil(o.t),FW.levels.length);
        const d=nextLevelDescriptor(y,o.c.id,nx);
        return `<li><b>${esc(o.c.th)}</b> ${fmt(o.v)} → ${o.t}${d?`<br><span class="sub">${esc(d)}</span>`:""}</li>`;}).join("")}
    </ol></div>`:"";

  return `<div class="aibox"><div class="lb">ข้อเสนอแนะจากระบบ AI · วิเคราะห์เชิงลึก</div>
    <div style="font-size:.84rem;line-height:1.8">${bits.join("")}</div>${path}
    <p class="note">สังเคราะห์จากผลการประเมินและผลวิเคราะห์เชิงจิตมิติที่บันทึกไว้จริง
      เป็นข้อมูลประกอบการพิจารณาเท่านั้น ผู้ประเมินเป็นผู้ตัดสินคะแนน</p></div>`;
}
/** นักศึกษาเจ้าของแฟ้มสะสมงานที่กำลังเปิดอยู่
    นักศึกษาดูของตนเองเสมอ ส่วนผู้ตรวจสอบเลือกจากรายชื่อในขอบเขตของตน */
function evidenceOwner(){
  if(S.role==="Student") return myUser().id;
  const stu=visStudents();
  if(!stu.length) return null;
  if(!S.evSid||!stu.some(s=>s.id===S.evSid)) S.evSid=stu[0].id;
  return S.evSid;
}
function evidenceCard(e,canVerify){
  const st=String(e.status||"pending");
  const tag=st==="verified"?`<span class="tag tag-ok">ตรวจสอบแล้ว</span>`
          :st==="rejected"?`<span class="tag tag-risk">ไม่ผ่าน</span>`
          :`<span class="tag tag-warn">รอตรวจสอบ</span>`;
  const link=e.url
    ? `<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer" style="font-size:.8rem">
         เปิดงานที่ส่ง <span class="sub">· ${esc(linkHost(e.url))}</span></a>`
    : `<span class="sub" style="font-size:.78rem">ไม่มีไฟล์หรือลิงก์แนบ</span>`;
  const act=canVerify?`<div class="row" style="margin-top:.6rem;gap:.35rem">
      <button class="btn btn-ghost btn-sm" data-act="evreject" data-v="${e.id}">ตีกลับให้แก้ไข</button>
      <button class="btn btn-primary btn-sm" data-act="evverify" data-v="${e.id}">ผ่านการตรวจสอบ</button></div>`:"";
  return `<div class="evidence">
    <div style="display:flex;justify-content:space-between;gap:1rem">
      <div><div style="font-weight:500;font-size:.9rem">${esc(e.title)}</div>
        <div class="sub">${esc(e.type)} · อัปโหลด ${esc(e.date||"—")}</div>${link}</div>
      ${tag}</div>
    <div style="margin-top:.5rem;display:flex;gap:.3rem;flex-wrap:wrap">${(e.comps||[]).map(id=>{
      const c=FW.competencies.find(x=>x.id===id); return c?`<span class="tag tag-n">${c.code} ${esc(c.th)}</span>`:"";}).join("")}</div>
    ${act}</div>`;
}
function portfolioPage(){
  const sid=evidenceOwner();
  if(!sid) return card("แฟ้มสะสมงาน","",`<div class="empty">ยังไม่มีนักศึกษาในขอบเขตของท่าน</div>`);
  const isOwner=S.role==="Student";
  const canVerify=canVerifyEvidence();

/* ============================================================
   เครื่องมือหาอนุพันธ์อัตโนมัติแบบย้อนกลับ (reverse-mode autodiff)
   ใช้ฝึกโมเดล Neural IRT / DKT / Transformer ในเบราว์เซอร์
   ============================================================ */
let TAPE=null;
function tstart(){ TAPE=[]; }
function tnode(r,c,d){ return {r,c,d:d||new Float64Array(r*c),g:new Float64Array(r*c),bw:null}; }
function tparam(r,c,scale,rng){
  const n=tnode(r,c);
  for(let i=0;i<r*c;i++) n.d[i]=(rng()*2-1)*scale;
  n.param=true; return n;
}
function push(n,bw){ n.bw=bw; if(TAPE) TAPE.push(n); return n; }

function mm(A,B){ // (r×k)(k×c)
  const out=tnode(A.r,B.c);
  for(let i=0;i<A.r;i++) for(let k=0;k<A.c;k++){
    const a=A.d[i*A.c+k]; if(a===0) continue;
    for(let j=0;j<B.c;j++) out.d[i*B.c+j]+=a*B.d[k*B.c+j];
  }
  return push(out,()=>{
    for(let i=0;i<A.r;i++) for(let k=0;k<A.c;k++){
      let s=0; const base=i*B.c;
      for(let j=0;j<B.c;j++) s+=out.g[base+j]*B.d[k*B.c+j];
      A.g[i*A.c+k]+=s;
    }
    for(let k=0;k<B.r;k++) for(let j=0;j<B.c;j++){
      let s=0;
      for(let i=0;i<A.r;i++) s+=A.d[i*A.c+k]*out.g[i*B.c+j];
      B.g[k*B.c+j]+=s;
    }
  });
}
function addBias(A,b){ // b คือ 1×c
  const out=tnode(A.r,A.c);
  for(let i=0;i<A.r;i++) for(let j=0;j<A.c;j++) out.d[i*A.c+j]=A.d[i*A.c+j]+b.d[j];
  return push(out,()=>{
    for(let i=0;i<A.r;i++) for(let j=0;j<A.c;j++){ A.g[i*A.c+j]+=out.g[i*A.c+j]; b.g[j]+=out.g[i*A.c+j]; }
  });
}
function addT(A,B){
  const out=tnode(A.r,A.c);
  for(let i=0;i<A.d.length;i++) out.d[i]=A.d[i]+B.d[i];
  return push(out,()=>{ for(let i=0;i<A.d.length;i++){ A.g[i]+=out.g[i]; B.g[i]+=out.g[i]; } });
}
function tanhT(A){
  const out=tnode(A.r,A.c);
  for(let i=0;i<A.d.length;i++) out.d[i]=Math.tanh(A.d[i]);
  return push(out,()=>{ for(let i=0;i<A.d.length;i++) A.g[i]+=out.g[i]*(1-out.d[i]*out.d[i]); });
}
function reluT(A){
  const out=tnode(A.r,A.c);
  for(let i=0;i<A.d.length;i++) out.d[i]=A.d[i]>0?A.d[i]:0;
  return push(out,()=>{ for(let i=0;i<A.d.length;i++) if(A.d[i]>0) A.g[i]+=out.g[i]; });
}
function scaleT(A,k){
  const out=tnode(A.r,A.c);
  for(let i=0;i<A.d.length;i++) out.d[i]=A.d[i]*k;
  return push(out,()=>{ for(let i=0;i<A.d.length;i++) A.g[i]+=out.g[i]*k; });
}
function mmT(A,B){ // A (r×k) คูณ B transpose (c×k) → (r×c)
  const out=tnode(A.r,B.r);
  for(let i=0;i<A.r;i++) for(let j=0;j<B.r;j++){
    let s=0; for(let k=0;k<A.c;k++) s+=A.d[i*A.c+k]*B.d[j*B.c+k];
    out.d[i*B.r+j]=s;
  }
  return push(out,()=>{
    for(let i=0;i<A.r;i++) for(let k=0;k<A.c;k++){
      let s=0; for(let j=0;j<B.r;j++) s+=out.g[i*B.r+j]*B.d[j*B.c+k];
      A.g[i*A.c+k]+=s;
    }
    for(let j=0;j<B.r;j++) for(let k=0;k<B.c;k++){
      let s=0; for(let i=0;i<A.r;i++) s+=out.g[i*B.r+j]*A.d[i*A.c+k];
      B.g[j*B.c+k]+=s;
    }
  });
}
/** softmax ตามแถว พร้อมมาสก์เชิงสาเหตุ (ช่องที่ j>i ถูกตัดทิ้ง) */
function causalSoftmax(A){
  const out=tnode(A.r,A.c);
  for(let i=0;i<A.r;i++){
    let mx=-Infinity;
    for(let j=0;j<=i&&j<A.c;j++) mx=Math.max(mx,A.d[i*A.c+j]);
    let sum=0;
    for(let j=0;j<=i&&j<A.c;j++){ const e=Math.exp(A.d[i*A.c+j]-mx); out.d[i*A.c+j]=e; sum+=e; }
    for(let j=0;j<=i&&j<A.c;j++) out.d[i*A.c+j]/=sum;
  }
  return push(out,()=>{
    for(let i=0;i<A.r;i++){
      let dot=0;
      for(let j=0;j<=i&&j<A.c;j++) dot+=out.g[i*A.c+j]*out.d[i*A.c+j];
      for(let j=0;j<=i&&j<A.c;j++) A.g[i*A.c+j]+=out.d[i*A.c+j]*(out.g[i*A.c+j]-dot);
    }
  });
}
/** ดึงแถวจากตารางฝัง (embedding lookup) */
function lookup(E,idx){
  const out=tnode(idx.length,E.c);
  for(let i=0;i<idx.length;i++) for(let j=0;j<E.c;j++) out.d[i*E.c+j]=E.d[idx[i]*E.c+j];
  return push(out,()=>{
    for(let i=0;i<idx.length;i++) for(let j=0;j<E.c;j++) E.g[idx[i]*E.c+j]+=out.g[i*E.c+j];
  });
}
/** ทำซ้ำเวกเตอร์แถวเดียวให้ครบ n แถว */
function repeatRow(v,n){
  const out=tnode(n,v.c);
  for(let i=0;i<n;i++) for(let j=0;j<v.c;j++) out.d[i*v.c+j]=v.d[j];
  return push(out,()=>{ for(let i=0;i<n;i++) for(let j=0;j<v.c;j++) v.g[j]+=out.g[i*v.c+j]; });
}
/** ต่อคอลัมน์สองตาราง */
function concatCols(A,B){
  const out=tnode(A.r,A.c+B.c);
  for(let i=0;i<A.r;i++){
    for(let j=0;j<A.c;j++) out.d[i*out.c+j]=A.d[i*A.c+j];
    for(let j=0;j<B.c;j++) out.d[i*out.c+A.c+j]=B.d[i*B.c+j];
  }
  return push(out,()=>{
    for(let i=0;i<A.r;i++){
      for(let j=0;j<A.c;j++) A.g[i*A.c+j]+=out.g[i*out.c+j];
      for(let j=0;j<B.c;j++) B.g[i*B.c+j]+=out.g[i*out.c+A.c+j];
    }
  });
}
/** เลือกค่าคอลัมน์ที่ระบุในแต่ละแถว แล้วคืนเป็นเวกเตอร์ (n×1) */
function gatherCol(A,cols){
  const out=tnode(A.r,1);
  for(let i=0;i<A.r;i++) out.d[i]=A.d[i*A.c+cols[i]];
  return push(out,()=>{ for(let i=0;i<A.r;i++) A.g[i*A.c+cols[i]]+=out.g[i]; });
}
/** ค่าเสียหาย binary cross-entropy เฉลี่ยเฉพาะแถวที่มาสก์เป็น 1 */
function bceLoss(logits,y,mask){
  let n=0,L=0;
  const pr=new Float64Array(logits.r);
  for(let i=0;i<logits.r;i++){
    if(mask&&!mask[i]) continue;
    const z=logits.d[i], p=1/(1+Math.exp(-Math.max(-30,Math.min(30,z))));
    pr[i]=p; n++;
    L+=-(y[i]*Math.log(Math.max(p,1e-9))+(1-y[i])*Math.log(Math.max(1-p,1e-9)));
  }
  const out=tnode(1,1); out.d[0]=n?L/n:0;
  push(out,()=>{
    if(!n) return;
    for(let i=0;i<logits.r;i++){ if(mask&&!mask[i]) continue; logits.g[i]+=(pr[i]-y[i])/n*out.g[0]; }
  });
  out.probs=pr; out.count=n;
  return out;
}
function backward(loss){
  loss.g[0]=1;
  for(let i=TAPE.length-1;i>=0;i--) if(TAPE[i].bw) TAPE[i].bw();
}
function zeroGrad(ps){ ps.forEach(p=>p.g.fill(0)); }
/** ปรับพารามิเตอร์ด้วย Adam */
function adamStep(ps,lr,t){
  ps.forEach(p=>{
    if(!p.m){ p.m=new Float64Array(p.d.length); p.v=new Float64Array(p.d.length); }
    for(let i=0;i<p.d.length;i++){
      p.m[i]=0.9*p.m[i]+0.1*p.g[i];
      p.v[i]=0.999*p.v[i]+0.001*p.g[i]*p.g[i];
      const mh=p.m[i]/(1-Math.pow(0.9,t)), vh=p.v[i]/(1-Math.pow(0.999,t));
      p.d[i]-=lr*mh/(Math.sqrt(vh)+1e-8);
    }
  });
}
function mulT(A,B){
  const out=tnode(A.r,A.c);
  for(let i=0;i<A.d.length;i++) out.d[i]=A.d[i]*B.d[i];
  return push(out,()=>{ for(let i=0;i<A.d.length;i++){ A.g[i]+=out.g[i]*B.d[i]; B.g[i]+=out.g[i]*A.d[i]; } });
}
function rowSum(A){
  const out=tnode(A.r,1);
  for(let i=0;i<A.r;i++){ let s=0; for(let j=0;j<A.c;j++) s+=A.d[i*A.c+j]; out.d[i]=s; }
  return push(out,()=>{ for(let i=0;i<A.r;i++) for(let j=0;j<A.c;j++) A.g[i*A.c+j]+=out.g[i]; });
}
function sliceRows(A,from,to){
  const r=to-from, out=tnode(r,A.c);
  for(let i=0;i<r;i++) for(let j=0;j<A.c;j++) out.d[i*A.c+j]=A.d[(from+i)*A.c+j];
  return push(out,()=>{ for(let i=0;i<r;i++) for(let j=0;j<A.c;j++) A.g[(from+i)*A.c+j]+=out.g[i*A.c+j]; });
}
function colMean(A){ // เฉลี่ยตามคอลัมน์ ได้เวกเตอร์ 1×c
  const out=tnode(1,A.c);
  for(let j=0;j<A.c;j++){ let s=0; for(let i=0;i<A.r;i++) s+=A.d[i*A.c+j]; out.d[j]=s/A.r; }
  return push(out,()=>{ for(let i=0;i<A.r;i++) for(let j=0;j<A.c;j++) A.g[i*A.c+j]+=out.g[j]/A.r; });
}

/* ============================================================
   คลังข้อสอบวัดสมรรถนะ 17 สมรรถนะ สมรรถนะละ 30 ข้อ
   ข้อความโจทย์เป็นแม่แบบสำหรับต้นแบบ ต้องแทนที่ด้วยข้อสอบจริงก่อนใช้งาน
   ค่าพารามิเตอร์จริงของข้อสอบใช้จำลองการตอบของกลุ่มทดลองใช้เท่านั้น
   ============================================================ */
const ITEMS_PER_COMP=30, PILOT_N=300, GUESS_C=1/5;   // 5 ตัวเลือก ระดับการเดาสุ่มเท่ากับ 0.20
const CHOICE_LB=["ก","ข","ค","จ"].slice(0,0).concat(["ก","ข","ค","ง","จ"]);
const N_CHOICE=5;
/* แม่แบบเนื้อหาตัวเลือก: ตัวเลือกที่ถูกอธิบายการปฏิบัติที่ครบถ้วน ส่วนตัวลวงสะท้อนความเข้าใจคลาดเคลื่อนที่พบบ่อย */
